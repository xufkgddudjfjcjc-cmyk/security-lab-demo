<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06142d"><title>Security Lab · 管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 50% 0,#12386b,#06142d 45%,#020817);color:#eef6ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:14px 14px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 16px}.brand{font-size:20px;font-weight:900;letter-spacing:1.5px}.sub,.muted{color:#91a9c7;font-size:13px;margin-top:3px}.card{background:rgba(8,30,66,.82);border:1px solid rgba(90,160,255,.25);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 15px 45px rgba(0,0,0,.2);backdrop-filter:blur(14px)}.login-card{margin-top:40px}h2{margin:0 0 12px;font-size:18px}
input{width:100%;background:#071a38;color:#fff;border:1px solid #294f80;border-radius:13px;padding:13px 14px;margin:6px 0;outline:none}input:focus{border-color:#5b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.12)}button{border:0;border-radius:13px;padding:12px 14px;background:#4f73ff;color:white;font-weight:800;margin-top:8px}button:active{transform:scale(.97)}.ghost,.small{background:#10294d;border:1px solid #2c568d}.ghost{width:auto;margin:0}.small{width:auto;margin:0;padding:8px 11px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat{background:rgba(11,35,75,.82);border:1px solid rgba(80,150,255,.2);border-radius:16px;padding:13px}.stat span{display:block;color:#91a9c7;font-size:12px}.stat b{display:block;font-size:25px;margin-top:5px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.navbtn{background:#0b2348;border:1px solid #244c80}.navbtn.active{background:#3565dd}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.item{padding:13px 0;border-bottom:1px solid rgba(130,170,220,.13)}.item:last-child{border:0}.itemTop{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:#153b67;color:#a8d7ff;white-space:nowrap}.pill.green{background:#123f35;color:#69e6ae}.pill.gray{background:#26364d;color:#9bb0c8}.msg{margin:8px 0;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.deleteBtn{background:transparent;color:#ff8e9d;border:1px solid rgba(255,100,124,.3);padding:7px 10px;font-size:12px}.empty{padding:30px 10px;text-align:center;color:#7893b3}.dangerText{color:#ff8e9d}.dangerBtn{background:#542033;border:1px solid #8e3550}.setting{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid rgba(130,170,220,.13)}.setting:last-child{border:0}.ok{color:#67e3a0}.code{letter-spacing:8px;text-align:center;font-size:22px}.secondary{background:#10294d;border:1px solid #2c568d}.status{min-height:20px;margin-top:8px}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.navbtn{font-size:12px;padding:11px 5px}.app{padding-left:10px;padding-right:10px}}
</style></head><body>
<div class="app"><header class="topbar"><div><div class="brand">🛡️ SECURITY LAB</div><div class="sub">手机管理后台</div></div><button id="logout" class="ghost hidden">退出</button></header>
<section id="login" class="card login-card"><h2>管理员登录</h2><p class="muted">管理员邮箱验证码登录</p>
<input id="email" type="email" placeholder="管理员邮箱" autocomplete="email"><button id="sendCode">发送验证码</button>
<div id="codeArea" class="hidden"><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" placeholder="输入邮箱验证码"><button id="verifyCode">验证并进入后台</button></div>
<div id="loginMsg" class="muted status"></div></section>
<main id="panel" class="hidden"><div class="stats"><div class="stat"><span>用户数量</span><b id="usersN">0</b></div><div class="stat"><span>消息数量</span><b id="messagesN">0</b></div><div class="stat"><span>今日活跃</span><b id="activeN">0</b></div></div>
<nav class="nav"><button class="navbtn active" data-page="users">👤 用户列表</button><button class="navbtn" data-page="messages">💬 消息管理</button><button class="navbtn" data-page="settings">⚙️ 系统设置</button></nav>
<section id="usersPage" class="page"><div class="card"><div class="section-head"><h2>用户列表</h2><button id="refresh" class="small">刷新</button></div><input id="userSearch" placeholder="搜索用户ID / 昵称 / 邮箱"><div id="usersList"></div></div></section>
<section id="messagesPage" class="page hidden"><div class="card"><div class="section-head"><h2>消息管理</h2><button id="refreshMsg" class="small">刷新</button></div><input id="messageSearch" placeholder="搜索消息内容 / 用户ID"><div id="messagesList"></div></div></section>
<section id="settingsPage" class="page hidden"><div class="card"><h2>系统设置</h2><div class="setting"><span>后台状态</span><b class="ok">● 正常</b></div><div class="setting"><span>数据来源</span><span class="muted">Supabase</span></div><div class="setting"><span>管理员权限</span><span class="muted">Edge Function 校验</span></div><div class="setting"><span>当前管理员</span><span id="adminEmailText" class="muted">-</span></div></div><div class="card"><h2>危险操作</h2><p class="muted">删除消息会直接从数据库删除，请谨慎操作。</p><button id="clearLocal" class="dangerBtn">退出管理员账号</button></div></section></main></div>
<script>
const SUPABASE_URL="https://lnducpwbmyjhnnjkqyxq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_aukve7aK4EQCniOtCSy8uQ_raK8MH0j";
const ADMIN_EMAIL="3591298603@qq.com";
const FUNCTION_NAME="admin-data-v2";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let payload={users:[],messages:[]};
function fmt(v){if(!v)return"-";try{return new Date(v).toLocaleString("zh-CN",{hour12:false})}catch{return v}}
function online(v){if(!v)return'<span class="pill gray">未知</span>';return Date.now()-new Date(v).getTime()<600000?'<span class="pill green">在线</span>':'<span class="pill gray">离线</span>'}
function renderUsers(){const q=$("userSearch").value.trim().toLowerCase();const a=payload.users.filter(x=>!q||[x.id,x.user_id,x.email,x.nickname].some(v=>String(v??"").toLowerCase().includes(q)));$("usersList").innerHTML=a.length?a.map(x=>`<div class="item"><div class="itemTop"><b>${esc(x.nickname||x.email||"未设置昵称")}</b>${online(x.last_sign_in_at)}</div><div class="muted">用户ID：${esc(x.id)}</div><div class="muted">邮箱：${esc(x.email||"未填写")}</div><div class="muted">注册时间：${esc(fmt(x.created_at))}</div></div>`).join(""):'<div class="empty">没有找到用户</div>'}
function renderMessages(){const q=$("messageSearch").value.trim().toLowerCase();const a=payload.messages.filter(x=>!q||[x.content,x.user_id,x.username,x.nickname].some(v=>String(v??"").toLowerCase().includes(q)));$("messagesList").innerHTML=a.length?a.map(x=>`<div class="item"><div class="itemTop"><b>${esc(x.username||x.nickname||x.user_id||"用户")}</b><span class="pill">${esc(fmt(x.created_at))}</span></div><div class="msg">${esc(x.content||"")}</div><div class="muted">用户ID：${esc(x.user_id||"-")}</div><button class="deleteBtn" data-id="${esc(x.id)}">🗑 删除消息</button></div>`).join(""):'<div class="empty">没有找到消息</div>';document.querySelectorAll(".deleteBtn").forEach(b=>b.onclick=()=>deleteMessage(b.dataset.id))}
function render(){ $("usersN").textContent=payload.users.length;$("messagesN").textContent=payload.messages.length;const d=new Date();d.setHours(0,0,0,0);$("activeN").textContent=payload.users.filter(x=>x.last_sign_in_at&&new Date(x.last_sign_in_at)>=d).length;renderUsers();renderMessages()}
async function callAdmin(action,extra={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error("管理员登录已失效");const r=await sb.functions.invoke(FUNCTION_NAME,{body:{action,...extra}});if(r.error)throw new Error(r.error.message||"Edge Function 请求失败");if(r.data?.error)throw new Error(r.data.error);return r.data}
async function load(){try{const d=await callAdmin("list",{limit:500});payload=d||{users:[],messages:[]};render()}catch(e){$("usersList").innerHTML=`<div class="dangerText">${esc(e.message)}</div>`}}
async function deleteMessage(id){if(!id||!confirm("确定删除这条消息吗？"))return;try{await callAdmin("delete_message",{id});await load()}catch(e){alert("删除失败："+e.message)}}
$("sendCode").onclick=async()=>{const email=$("email").value.trim().toLowerCase();if(email!==ADMIN_EMAIL){$("loginMsg").textContent="只有管理员邮箱可以登录";return}$("loginMsg").textContent="正在发送验证码…";const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error){$("loginMsg").textContent="发送失败："+error.message;return}$("codeArea").classList.remove("hidden");$("loginMsg").textContent="验证码已发送，请检查邮箱"}
$("verifyCode").onclick=async()=>{const email=$("email").value.trim().toLowerCase(),token=$("code").value.trim();if(email!==ADMIN_EMAIL)return $("loginMsg").textContent="管理员邮箱不正确";if(!token)return $("loginMsg").textContent="请输入验证码";$("loginMsg").textContent="验证中…";const {data,error}=await sb.auth.verifyOtp({email,token,type:"email"});if(error){$("loginMsg").textContent="验证失败："+error.message;return}if(!data.session){$("loginMsg").textContent="没有获得登录会话";return}$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");$("adminEmailText").textContent=email;await load()}
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};$("clearLocal").onclick=async()=>{await sb.auth.signOut();location.reload()};$("refresh").onclick=load;$("refreshMsg").onclick=load;$("userSearch").oninput=renderUsers;$("messageSearch").oninput=renderMessages;
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));$(b.dataset.page+"Page").classList.remove("hidden")});
sb.auth.getSession().then(({data:{session}})=>{if(session){$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");$("adminEmailText").textContent=session.user.email||"-";load()}});
</script></body></html>
