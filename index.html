<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Security Lab</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #f4f7fb;
    --panel: rgba(255,255,255,.86);
    --white: #ffffff;
    --text: #15171b;
    --muted: #7b818b;
    --line: rgba(0,0,0,.08);

    --blue: #1677ff;
    --blue-soft: #eaf3ff;

    --green: #22c55e;
    --green-dark: #16a34a;

    --shadow:
        0 18px 55px rgba(30,40,60,.10);
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        "Microsoft YaHei",
        sans-serif;
}

body {
    overflow: hidden;
}

/* =========================
   背景
========================= */

.background {
    position: fixed;
    inset: 0;

    z-index: 0;

    overflow: hidden;

    pointer-events: none;
}

.background::before {
    content: "";

    position: absolute;

    width: 520px;
    height: 520px;

    left: -180px;
    top: -180px;

    background:
        rgba(22,119,255,.09);

    filter: blur(110px);

    border-radius: 50%;
}

.background::after {
    content: "";

    position: absolute;

    width: 480px;
    height: 480px;

    right: -180px;
    bottom: -180px;

    background:
        rgba(120,80,255,.08);

    filter: blur(110px);

    border-radius: 50%;
}

/* =========================
   APP
========================= */

.app {
    position: relative;

    z-index: 1;

    width: 100vw;
    height: 100vh;

    display: grid;

    grid-template-columns:
        220px
        minmax(0,1fr)
        290px;

    gap: 14px;

    padding: 14px;
}

/* =========================
   面板
========================= */

.sidebar,
.chat,
.profile {

    background:
        var(--panel);

    border:
        1px solid rgba(255,255,255,.8);

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);
}

/* =========================
   左侧
========================= */

.sidebar {

    border-radius: 22px;

    padding: 18px 12px;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}

.brand {

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        8px 10px 20px;
}

.brand-icon {

    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #111827,
            #374151
        );

    color: white;

    font-size: 20px;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.12);
}

.brand-name {

    font-weight: 750;

    font-size: 16px;
}

.brand-sub {

    color: var(--muted);

    font-size: 11px;

    margin-top: 2px;
}

.section-title {

    padding: 10px;

    color: #9aa0aa;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .08em;
}

.channel {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 11px 12px;

    margin: 2px 0;

    border-radius: 11px;

    color: #555b65;

    cursor: pointer;

    transition: .18s;
}

.channel:hover {

    background:
        #eef2f7;
}

.channel.active {

    background:
        var(--blue-soft);

    color:
        var(--blue);

    font-weight: 600;
}

.channel-icon {

    font-size: 17px;
}

.sidebar-bottom {

    margin-top: auto;
}

.mini-status {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 12px;

    color: var(--muted);

    font-size: 12px;
}

.green-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        var(--green);

    box-shadow:
        0 0 10px
        rgba(34,197,94,.55);
}

/* =========================
   聊天
========================= */

.chat {

    min-width: 0;

    border-radius: 22px;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}

/* =========================
   Header
========================= */

.chat-header {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 22px;

    border-bottom:
        1px solid var(--line);

    background:
        rgba(255,255,255,.58);
}

.chat-title {

    display: flex;

    align-items: center;

    gap: 10px;
}

.hash {

    font-size: 23px;

    color: #9298a2;
}

.chat-name {

    font-size: 16px;

    font-weight: 700;
}

.chat-description {

    color: var(--muted);

    font-size: 11px;

    margin-top: 2px;
}

.connection {

    display: flex;

    align-items: center;

    gap: 7px;

    color: #6f7680;

    font-size: 12px;
}

/* =========================
   消息
========================= */

.messages {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 22px;
}

.messages::-webkit-scrollbar {

    width: 5px;
}

.messages::-webkit-scrollbar-thumb {

    background:
        #d6d9df;

    border-radius: 10px;
}

.message {

    display: flex;

    gap: 11px;

    margin-bottom: 21px;

    animation:
        messageIn .2s ease;
}

@keyframes messageIn {

    from {

        opacity: 0;

        transform:
            translateY(5px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}

/* =========================
   头像
========================= */

.avatar {

    flex: 0 0 auto;

    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #111827,
            #64748b
        );

    color: white;

    font-weight: 750;

    font-size: 14px;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.08);
}

.message-content {

    min-width: 0;

    max-width:
        min(700px, 100%);
}

.message-top {

    display: flex;

    align-items: baseline;

    gap: 8px;

    flex-wrap: wrap;
}

.message-user {

    font-weight: 700;

    font-size: 14px;
}

.message-time {

    color: #a0a5ad;

    font-size: 10px;
}

.message-text {

    margin-top: 5px;

    color: #424750;

    line-height: 1.55;

    word-break: break-word;

    white-space: pre-wrap;
}

/* =========================
   表情
========================= */

.reactions {

    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    margin-top: 8px;
}

.reaction {

    border:
        1px solid #e3e6eb;

    background:
        rgba(255,255,255,.9);

    border-radius: 12px;

    padding:
        4px 8px;

    font-size: 12px;

    cursor: pointer;

    transition: .15s;

    color: #555;
}

.reaction:hover {

    border-color:
        #b9d5ff;

    background:
        #f2f7ff;
}

.reaction.active {

    background:
        #eaf3ff;

    border-color:
        #9fc6ff;

    color:
        #1677ff;
}

/* =========================
   正在输入
========================= */

.typing-area {

    height: 28px;

    padding:
        0 22px;

    display: flex;

    align-items: center;

    color: #8a919c;

    font-size: 11px;
}

.typing-dots {

    display: inline-flex;

    gap: 3px;

    margin-left: 5px;
}

.typing-dots span {

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background:
        #8a919c;

    animation:
        typingDot 1.2s infinite;
}

.typing-dots span:nth-child(2) {

    animation-delay:
        .15s;
}

.typing-dots span:nth-child(3) {

    animation-delay:
        .3s;
}

@keyframes typingDot {

    0%,60%,100% {

        opacity: .3;

        transform:
            translateY(0);
    }

    30% {

        opacity: 1;

        transform:
            translateY(-3px);
    }
}

/* =========================
   输入
========================= */

.input-area {

    padding:
        8px 18px 18px;

    border-top:
        1px solid var(--line);

    background:
        rgba(255,255,255,.58);
}

.input-box {

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        6px 7px 6px 15px;

    border:
        1px solid #e1e5ea;

    border-radius: 15px;

    background:
        white;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.04);
}

.input-box:focus-within {

    border-color:
        #b7d4ff;

    box-shadow:
        0 0 0 4px
        rgba(22,119,255,.08);
}

.message-input {

    flex: 1;

    min-width: 0;

    border: 0;

    outline: 0;

    background:
        transparent;

    font-size: 15px;

    color: var(--text);
}

.message-input::placeholder {

    color: #a5aab2;
}

.send {

    width: 40px;
    height: 40px;

    border: 0;

    border-radius: 12px;

    background:
        #111827;

    color: white;

    cursor: pointer;

    font-size: 19px;

    transition: .18s;
}

.send:hover {

    transform:
        scale(1.04);

    background:
        #000;
}

.send:disabled {

    opacity: .45;

    cursor: default;
}

/* =========================
   右侧 PROFILE
========================= */

.profile {

    border-radius: 22px;

    padding: 18px;

    overflow-y: auto;
}

.profile-title {

    color: #9298a2;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .08em;

    margin:
        5px 4px 14px;
}

/* 用户 */

.user-card {

    padding: 18px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f5f7fa
        );

    border:
        1px solid #edf0f3;
}

.user-main {

    display: flex;

    align-items: center;

    gap: 11px;
}

.big-avatar {

    width: 54px;
    height: 54px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            #111827,
            #64748b
        );

    color: white;

    font-size: 19px;

    font-weight: 750;
}

.user-name {

    font-weight: 700;
}

.user-online {

    display: flex;

    align-items: center;

    gap: 5px;

    margin-top: 4px;

    color: #22a35a;

    font-size: 11px;
}

.info-divider {

    height: 1px;

    background:
        #eceff3;

    margin:
        16px 0;
}

.info-row {

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 7px 0;

    color: #606771;

    font-size: 13px;
}

.info-icon {

    width: 25px;

    text-align: center;

    font-size: 16px;
}

/* =========================
   天气
========================= */

.weather {

    margin-top: 15px;

    padding: 16px;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            #eaf4ff,
            #f7fbff
        );

    border:
        1px solid #dcecff;
}

.weather-top {

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.weather-temp {

    font-size: 31px;

    font-weight: 700;

    color: #172033;
}

.weather-icon {

    font-size: 34px;
}

.weather-city {

    margin-top: 4px;

    color: #4e596b;

    font-size: 13px;
}

.weather-detail {

    margin-top: 12px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}

.weather-small {

    padding: 9px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.7);

    color: #687282;

    font-size: 11px;
}

.weather-small strong {

    display: block;

    margin-top: 3px;

    color: #303847;

    font-size: 13px;
}

.status-message {

    margin-top: 12px;

    color: #858b95;

    font-size: 11px;

    line-height: 1.5;
}

/* =========================
   通知按钮
========================= */

.notify-button {

    width: 100%;

    margin-top: 14px;

    padding: 11px;

    border:
        1px solid #e1e5ea;

    border-radius: 12px;

    background:
        white;

    color: #444;

    font-size: 12px;

    cursor: pointer;
}

.notify-button:hover {

    background:
        #f5f7fa;
}

/* =========================
   Toast
========================= */

.toast {

    position: fixed;

    z-index: 9999;

    left: 50%;

    bottom: 25px;

    transform:
        translate(-50%, 20px);

    padding:
        11px 17px;

    border-radius: 13px;

    background:
        rgba(17,24,39,.94);

    color: white;

    font-size: 12px;

    opacity: 0;

    pointer-events: none;

    transition:
        .25s ease;
}

.toast.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* =========================
   Mobile
========================= */

@media (max-width: 900px) {

    .app {

        grid-template-columns:
            190px
            minmax(0,1fr);
    }

    .profile {

        display: none;
    }
}

@media (max-width: 650px) {

    body {

        overflow: auto;
    }

    .app {

        display: block;

        width: 100%;

        height: auto;

        min-height: 100vh;

        padding: 8px;
    }

    .sidebar {

        height: 58px;

        padding:
            8px 10px;

        border-radius: 17px;

        margin-bottom: 8px;

        flex-direction: row;

        align-items: center;
    }

    .brand {

        padding: 0;

        margin-right: 8px;
    }

    .brand-icon {

        width: 40px;
        height: 40px;
    }

    .brand-text {

        display: none;
    }

    .section-title,
    .sidebar-bottom {

        display: none;
    }

    .channel {

        display: none;
    }

    .channel.active {

        display: flex;

        margin: 0;

        padding:
            9px 12px;
    }

    .chat {

        height:
            calc(100vh - 74px);

        min-height: 600px;

        border-radius: 18px;
    }

    .chat-header {

        height: 62px;

        padding:
            0 15px;
    }

    .messages {

        padding:
            16px 13px;
    }

    .input-area {

        padding:
            8px 10px 10px;
    }

    .typing-area {

        padding:
            0 13px;
    }

    .chat-description {

        display: none;
    }

    .message-content {

        max-width:
            calc(100vw - 85px);
    }
}

</style>
</head>

<body>

<div class="background"></div>

<div class="app">

    <!-- =========================

<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
    "https://inducpwbmyjhnnjkqyxq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aukve7aK4EQCniOtCSy8uQ_raK8MH0j";


let supabaseClient = null;


try {

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

} catch (error) {

    console.error(
        "Supabase 初始化失败:",
        error
    );

}


/* =====================================================
   用户昵称
===================================================== */

let nickname =
    localStorage.getItem(
        "security_lab_nickname"
    ) || "游客";


function updateProfile() {

    const name =
        nickname || "游客";


    document
        .getElementById(
            "profileName"
        )
        .textContent =
        name;


    document
        .getElementById(
            "bigAvatar"
        )
        .textContent =
        getAvatarLetter(name);

}


function getAvatarLetter(name) {

    const value =
        String(name || "游").trim();

    return value
        ? value.charAt(0).toUpperCase()
        : "游";
}


updateProfile();


/* =====================================================
   Toast
===================================================== */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    setTimeout(
        function() {

            toast.classList.remove(
                "show"
            );

        },
        2200
    );
}


/* =====================================================
   聊天加载
===================================================== */

let firstMessageLoad = true;

let previousLatestMessageId =
    null;


async function loadMessages() {

    if (!supabaseClient) {

        showChatError(
            "Supabase 初始化失败"
        );

        return;

    }


    try {

        const result =
            await supabaseClient
                .from("messages")
                .select(
                    "id,username,message,created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                )
                .limit(100);


        if (result.error) {

            console.error(
                result.error
            );

            showChatError(
                result.error.message
            );

            return;

        }


        const list =
            result.data || [];


        /*
         * 新消息通知
         */

        if (
            !firstMessageLoad &&
            list.length > 0
        ) {

            const latest =
                list[list.length - 1];


            if (
                latest.id !==
                previousLatestMessageId &&
                latest.username !==
                nickname
            ) {

                notifyNewMessage(
                    latest
                );

            }

        }


        if (list.length > 0) {

            previousLatestMessageId =
                list[list.length - 1].id;

        }


        renderMessages(
            list
        );


        firstMessageLoad =
            false;


    } catch (error) {

        console.error(
            "加载消息失败:",
            error
        );

        showChatError(
            "TypeError: Load failed"
        );

    }

}

) {

        document.getElementById(

        box.innerHTML = `

            <div style="
                text-align:center;
                color:#9aa0aa;
                padding:50px 20px;
            ">

                还没有消息

                <br>

                <span style="
                    font-size:12px;
                ">
                    发送第一条消息吧
                </span>

            </div>

        `;

        return;

    }


    box.innerHTML = "";


    list.forEach(
        function(item) {

            const username =
                item.username ||
                "匿名";


            const text =
                item.message ||
                "";


            const avatar =
                getAvatarLetter(
                    username
                );


            const message =
                document.createElement(
                    "div"
                );


            message.className =
                "message";


            message.innerHTML = `

                <div class="avatar">
                    ${escapeHTML(avatar)}
                </div>

                <div class="message-content">

                    <div class="message-top">

                        </span>

                        <span class="message-time">
                            ${formatTime(
                                item.created_at

                    </div>

                            type="button"
                            onclick="toggleReaction(this)"
                        >

                        </button>

                            type="button"
                            onclick="toggleReaction(this)"
                        >

                        </button>

                            class="reaction"
                            type="button"
                            onclick="toggleReaction(this)"
                        >

                        </button>

                        <button
                            class="reaction"
                            type="button"
                            onclick="toggleReaction(this)"
                        >
                            😮 0
                        </button>

                        <button
                            class="reaction"
                            type="button"
                            onclick="toggleReaction(this)"
                        >
                            😢 0

            box.appendChild(

/* =====================================================
   表情反应
   目前只做前端 UI
   不修改 Supabase
===================================================== */

function toggleReaction(
    button
) {

    const match =
        button.textContent.match(
            /(\d+)$/
        );


    if (!match) {

        return;

    }


    let number =
        Number(match[1]);


    if (
        button.classList.contains(
            "active"
        )
    ) {

        number =
            Math.max(
                0,
                number - 1
            );

        button.classList.remove(
            "active"
        );

    } else {

        number++;

        button.classList.add(
            "active"
        );

    }


    button.textContent =
        button.textContent.replace(
            /\d+$/,
            String(number)
        );

}


/* =====================================================
   发送消息
===================================================== */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    if (!supabaseClient) {

        showToast(
            "聊天服务器未连接"
        );

        return;

    }


    button.disabled =
        true;


    try {

        /*
         * 这里必须使用 message
         * 因为你的数据库字段就是 message
         */

        const result =
            await supabaseClient
                .from("messages")
                .insert([
                    {
                        username:
                            nickname || "游客",

                        message:
                            text
                    }
                ]);


        if (result.error) {

            console.error(
                "发送错误:",
                result.error
            );


            showToast(
                "发送失败：" +
                result.error.message
            );

            return;

        }


        input.value = "";


        updateTypingState(
            false
        );


        await loadMessages();


    } catch (error) {

        console.error(
            error
        );


        showToast(
            "发送失败：Load failed"
        );

    } finally {

        button.disabled =
            false;

    }

}

/* =====================================================
   正在输入
   使用 Supabase Realtime Presence
   不修改数据库
===================================================== */

let presenceChannel =
    null;


let typingTimer =
    null;


let isTyping =
    false;


const presenceKey =
    "user-" +
    Math.random()
        .toString(36)
        .slice(2);


async function setupPresence() {

    if (!supabaseClient) {

        return;

    }


    try {

        presenceChannel =
            supabaseClient.channel(
                "security-lab-presence",
                {
                    config: {
                        presence: {
                            key: presenceKey
                        }
                    }
                }
            );


        presenceChannel
            .on(
                "presence",
                {
                    event: "sync"
                },
                function() {

                    updateTypingUsers();

                }
            )
            .on(
                "presence",
                {
                    event: "join"
                },
                function() {

                    updateTypingUsers();

                }
            )
            .on(
                "presence",
                {
                    event: "leave"
                },
                function() {

                    updateTypingUsers();

                }
            );


        await presenceChannel.subscribe(
            async function(status) {

                if (
                    status ===
                    "SUBSCRIBED"
                ) {

                    await presenceChannel.track(
                        {
                            nickname:
                                nickname,
                            typing:
                                false
                        }
                    );

                }

            }
        );

    } catch (error) {

        console.warn(
            "Presence 不可用:",
            error
        );

    }

}


async function updateTypingState(
    typing
) {

    isTyping =
        typing;


    if (
        !presenceChannel
    ) {

        return;

    }


    try {

        await presenceChannel.track(
            {
                nickname:
                    nickname,
                typing:
                    typing
            }
        );

    } catch (error) {

        console.warn(
            error
        );

    }

}


function updateTypingUsers() {

    if (
        !presenceChannel
    ) {

        return;

    }


    try {

        const state =
            presenceChannel.presenceState();


        const users = [];


        Object.keys(state)
            .forEach(
                function(key) {

                    const entries =
                        state[key];


                    entries.forEach(
                        function(entry) {

                            if (
                                entry.typing &&
                                entry.nickname !==
                                nickname
                            ) {

                                users.push(
                                    entry.nickname ||
                                    "有人"
                                );

                            }

                        }
                    );

                }
            );


        const typingArea =
            document.getElementById(
                "typingArea"
            );


        if (!users.length) {

            typingArea.innerHTML =
                "";

            return;

        }


        let text;


        if (
            users.length === 1
        ) {

            text =
                escapeHTML(
                    users[0]
                ) +
                " 正在输入";

        } else {

            text =
                users.length +
                " 人正在输入";

        }


        typingArea.innerHTML = `

            ${text}

            <span class="typing-dots">

                <span></span>
                <span></span>
                <span></span>

            </span>

        `;

    } catch (error) {

        console.warn(
            error
        );

    }

}


/*
 * 输入时发送 typing 状态
 */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "input",
        function() {

            const hasText =
                this.value.trim().length > 0;


            updateTypingState(
                hasText
            );


            clearTimeout(
                typingTimer
            );


            if (hasText) {

                typingTimer =
                    setTimeout(
                        function() {

                            updateTypingState(
                                false
                            );

                        },
                        1800
                    );

            }

        }
    );


/* =====================================================
   通知
===================================================== */

let notificationEnabled =
    false;


async function enableNotifications() {

    if (
        !("Notification" in window)
    ) {

        showToast(
            "当前浏览器不支持通知"
        );

        return;

    }


    try {

        const permission =
            await Notification.requestPermission();


        if (
            permission ===
            "granted"
        ) {

            notificationEnabled =
                true;


            showToast(
                "消息通知已开启"
            );


            document
                .getElementById(
                    "notifyButton"
                )
                .textContent =
                "🔔 消息通知已开启";

        } else {

            showToast(
                "通知权限没有开启"
            );

        }

    } catch (error) {

        console.error(
            error
        );

    }

}


document
    .getElementById(
        "notifyButton"
    )
    .addEventListener(
        "click",
        enableNotifications
    );


function notifyNewMessage(
    item
) {

    const username =
        item.username ||
        "有人";


    const text =
        item.message ||
        "新消息";


    /*
     * 页面标题
     */

    document.title =
        "🔔 新消息 · Security Lab";


    setTimeout(
        function() {

            document.title =
                "Security Lab";

        },
        4000
    );


    /*
     * 浏览器通知
     */

    if (
        notificationEnabled &&
        "Notification" in window &&
        Notification.permission ===
        "granted"
    ) {

        try {

            new Notification(
                username,
                {
                    body:
                        text.slice(
                            0,
                            100
                        ),
                    tag:
                        "security-lab-message"
                }
            );

        } catch (error) {

            console.warn(
                error
            );

        }

    }

}


/* =====================================================
   时间
===================================================== */

function formatTime(
    value
) {

    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        "zh-CN",
        {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function updateTime() {

    document
        .getElementById(
            "localTime"
        )
        .textContent =
        new Date()
            .toLocaleTimeString(
                "zh-CN",
                {
                    hour:
                        "2-digit",

                    minute:
                        "2-digit",

                    second:
                        "2-digit"
                }
            );

}


updateTime();


setInterval(
    updateTime,
    1000
);


/* =====================================================
   IP → 城市 → 天气
===================================================== */

async function loadWeather() {

    const status =
        document.getElementById(
            "weatherStatus"
        );


    try {

        const ipResponse =
            await fetch(
                "https://ipwho.is/"
            );


        if (!ipResponse.ok) {

            throw new Error(
                "IP 定位失败"
            );

        }


        const ipData =
            await ipResponse.json();


        if (!ipData.success) {

            throw new Error(
                "无法获取位置"
            );

        }


        const city =
            ipData.city ||
            "未知城市";


        const country =
            ipData.country ||
            "";


        const latitude =
            ipData.latitude;


        const longitude =
            ipData.longitude;


        document
            .getElementById(
                "location"
            )
            .textContent =
            city;


        document
            .getElementById(
                "weatherCity"
            )
            .textContent =
            city +
            (
                country
                    ? " · " + country
                    : ""
            );


        if (
            latitude == null ||
            longitude == null
        ) {

            throw new Error(
                "无法获取坐标"
            );

        }


        const weatherURL =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" +
            encodeURIComponent(
                latitude
            ) +
            "&longitude=" +
            encodeURIComponent(
                longitude
            ) +
            "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code" +
            "&timezone=auto";


        const weatherResponse =
            await fetch(
                weatherURL
            );


        if (!weatherResponse.ok) {

            throw new Error(
                "天气服务连接失败"
            );

        }


        const weather =
            await weatherResponse.json();


        const current =
            weather.current;


        const temperature =
            Math.round(
                current.temperature_2m
            );


        const humidity =
            current.relative_humidity_2m;


        const wind =
            Math.round(
                current.wind_speed_10m
            );


        const weatherInfo =
            getWeatherInfo(
                current.weather_code
            );


        document
            .getElementById(
                "temperature"
            )
            .textContent =
            temperature +
            "°";


        document
            .getElementById(
                "humidity"
            )
            .textContent =
            humidity +
            "%";


        document
            .getElementById(
                "wind"
            )
            .textContent =
            wind +
            " km/h";


        document
            .getElementById(
                "weatherIcon"
            )
            .textContent =
            weatherInfo.icon;


        status.textContent =
            weatherInfo.text;

    } catch (error) {

        console.error(
            "天气错误:",
            error
        );


        status.textContent =
            "天气暂时无法获取";

    }

}


/* =====================================================
   天气代码
===================================================== */

function getWeatherInfo(
    code
) {

    if (code === 0) {

        return {
            icon: "☀️",
            text: "晴朗"
        };

    }


    if (
        code === 1 ||
        code === 2
    ) {

        return {
            icon: "🌤️",
            text: "晴间多云"
        };

    }


    if (code === 3) {

        return {
            icon: "☁️",
            text: "多云"
        };

    }


    if (
        code >= 45 &&
        code <= 48
    ) {

        return {
            icon: "🌫️",
            text: "雾"
        };

    }


    if (
        code >= 51 &&
        code <= 67
    ) {

        return {
            icon: "🌧️",
            text: "小雨"
        };

    }


    if (
        code >= 71 &&
        code <= 77
    ) {

        return {
            icon: "❄️",
            text: "降雪"
        };

    }


    if (
        code >= 80 &&
        code <= 82
    ) {

        return {
            icon: "🌦️",
            text: "阵雨"
        };

    }


    if (code >= 95) {

        return {
            icon: "⛈️",
            text: "雷暴"
        };

    }


    return {
        icon: "🌤️",
        text: "天气未知"
    };

}

   自动刷新
===================================================== */

setInterval(

/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

loadMessages();

loadWeather();

setupPresence();
