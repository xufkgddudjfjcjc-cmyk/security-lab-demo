<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Lab</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #08090d;
    --panel: rgba(18, 20, 27, 0.88);
    --panel2: rgba(24, 27, 36, 0.9);
    --border: rgba(255,255,255,.08);
    --text: #f4f6f8;
    --muted: #8c93a1;
    --green: #45e38a;
    --green2: #2bc978;
    --blue: #6c8cff;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
}

body {
    overflow: hidden;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

#background {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(69,227,138,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(108,140,255,.10),
            transparent 32%
        ),
        #08090d;
}

#background::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );
    background-size: 45px 45px;
    mask-image: linear-gradient(
        to bottom,
        black,
        transparent
    );
}

.app {
    position: relative;
    z-index: 1;

    width: 100vw;
    height: 100vh;

    display: grid;
    grid-template-columns: 250px minmax(0, 1fr) 240px;

    padding: 14px;

    gap: 14px;
}

/* =========================
   左侧
========================= */

.sidebar {
    min-width: 0;

    display: flex;
    flex-direction: column;

    background: var(--panel);

    border: 1px solid var(--border);
    border-radius: 18px;

    backdrop-filter: blur(20px);

    overflow: hidden;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 20px;

    border-bottom: 1px solid var(--border);
}

.brand-icon {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #45e38a,
            #2caaef
        );

    color: #06100a;

    font-weight: 900;
}

.brand-name {
    font-size: 16px;
    font-weight: 700;
}

.brand-sub {
    margin-top: 2px;

    color: var(--muted);

    font-size: 11px;
}

.section-title {
    padding: 18px 16px 8px;

    color: #6f7683;

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: .08em;
}

.rooms {
    padding: 0 10px;
}

.room {
    width: 100%;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 11px 12px;

    border: 0;
    border-radius: 10px;

    background: transparent;
    color: var(--muted);

    text-align: left;
}

.room:hover {
    background: rgba(255,255,255,.05);
    color: var(--text);
}

.room.active {
    background:
        rgba(69,227,138,.12);

    color: var(--text);
}

.room-icon {
    width: 24px;

    color: #707887;
}

.room.active .room-icon {
    color: var(--green);
}

.room-name {
    flex: 1;
}

.room-count {
    color: #5e6571;
    font-size: 11px;
}

.profile {
    margin-top: auto;

    padding: 14px;

    border-top: 1px solid var(--border);
}

.profile-box {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 10px;

    border-radius: 12px;

    background: rgba(255,255,255,.04);
}

.avatar {
    position: relative;

    width: 36px;
    height: 36px;

    flex: 0 0 auto;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #6c8cff,
            #45e38a
        );

    color: white;

    font-weight: 700;
}

.online-dot {
    position: absolute;

    right: -1px;
    bottom: -1px;

    width: 10px;
    height: 10px;

    border: 2px solid #161921;

    border-radius: 50%;

    background: var(--green);
}

.profile-name {
    min-width: 0;
    flex: 1;
}

.profile-name strong {
    display: block;

    max-width: 130px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 13px;
}

.profile-name span {
    color: var(--green);
    font-size: 11px;
}

/* =========================
   主聊天
========================= */

.chat {
    min-width: 0;

    display: flex;
    flex-direction: column;

    background: var(--panel);

    border: 1px solid var(--border);
    border-radius: 18px;

    backdrop-filter: blur(20px);

    overflow: hidden;
}

.chat-header {
    height: 72px;

    flex: 0 0 auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    border-bottom: 1px solid var(--border);
}

.channel-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.channel-icon {
    color: var(--muted);

    font-size: 23px;
}

.channel-name {
    font-size: 15px;
    font-weight: 700;
}

.channel-description {
    margin-top: 2px;

    color: var(--muted);

    font-size: 11px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-btn {
    width: 36px;
    height: 36px;

    border: 1px solid transparent;
    border-radius: 9px;

    background: transparent;
    color: var(--muted);

    font-size: 17px;
}

.icon-btn:hover {
    background: rgba(255,255,255,.06);
    color: var(--text);
}

/* =========================
   消息
========================= */

.messages {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 24px;

    scrollbar-width: thin;
    scrollbar-color:
        rgba(255,255,255,.12)
        transparent;
}

.welcome {
    padding: 20px 0 30px;
}

.welcome-icon {
    width: 48px;
    height: 48px;

    display: grid;
    place-items: center;

    margin-bottom: 14px;

    border-radius: 15px;

    background:
        rgba(69,227,138,.12);

    color: var(--green);

    font-size: 22px;
}

.welcome h1 {
    margin: 0 0 7px;

    font-size: 22px;
}

.welcome p {
    margin: 0;

    color: var(--muted);

    font-size: 13px;
}

.message {
    display: flex;
    gap: 12px;

    padding: 8px 8px;

    margin: 2px 0;

    border-radius: 10px;
}

.message:hover {
    background: rgba(255,255,255,.025);
}

.message-avatar {
    width: 36px;
    height: 36px;

    flex: 0 0 36px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #343b55,
            #222936
        );

    color: #dce1ea;

    font-size: 13px;
    font-weight: 700;
}

.message-content {
    min-width: 0;
}

.message-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
}

.message-user {
    color: var(--text);

    font-size: 13px;
    font-weight: 700;
}

.message-time {
    color: #646b77;

    font-size: 10px;
}

.message-text {
    margin-top: 4px;

    color: #c7ccd5;

    font-size: 14px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-break: break-word;
}

/* =========================
   输入区
========================= */

.composer {
    flex: 0 0 auto;

    padding: 14px 18px 18px;
}

.composer-inner {
    display: flex;
    align-items: flex-end;
    gap: 10px;

    padding: 8px 8px 8px 14px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 13px;

    background:
        rgba(0,0,0,.25);
}

.name-input {
    width: 130px;
    flex: 0 0 130px;
}

.message-input {
    min-width: 0;
    flex: 1;
}

.text-input {
    width: 100%;

    padding: 9px 4px;

    border: 0;
    outline: 0;

    background: transparent;

    color: var(--text);

    font-size: 14px;
}

.text-input::placeholder {
    color: #646b77;
}

.send-button {
    width: 38px;
    height: 38px;

    flex: 0 0 38px;

    border: 0;
    border-radius: 10px;

    background: var(--green);

    color: #06100a;

    font-size: 16px;
    font-weight: 900;
}

.send-button:hover {
    background: #67f0a2;
    transform: translateY(-1px);
}

.send-button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* =========================
   右侧成员
========================= */

.members {
    min-width: 0;

    display: flex;
    flex-direction: column;

    background: var(--panel);

    border: 1px solid var(--border);
    border-radius: 18px;

    backdrop-filter: blur(20px);

    overflow: hidden;
}

.members-header {
    padding: 20px;

    border-bottom: 1px solid var(--border);
}

.members-title {
    font-size: 13px;
    font-weight: 700;
}

.members-count {
    margin-top: 4px;

    color: var(--muted);

    font-size: 11px;
}

.member-list {
    padding: 10px;
}

.member {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 9px;

    border-radius: 10px;
}

.member:hover {
    background: rgba(255,255,255,.04);
}

.member-avatar {
    position: relative;

    width: 32px;
    height: 32px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #2b3243,
            #202632
        );

    font-size: 12px;
    font-weight: 700;
}

.member-status {
    position: absolute;

    right: -1px;
    bottom: -1px;

    width: 9px;
    height: 9px;

    border: 2px solid #181b24;

    border-radius: 50%;

    background: var(--green);
}

.member-name {
    min-width: 0;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    color: #c7ccd5;

    font-size: 12px;
}

.connection {
    margin-top: auto;

    padding: 15px;

    border-top: 1px solid var(--border);

    font-size: 11px;
}

.connection-line {
    display: flex;
    align-items: center;
    gap: 7px;

    color: var(--muted);
}

.connection-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);

    box-shadow: 0 0 8px rgba(69,227,138,.6);
}

/* =========================
   手机
========================= */

.mobile-menu {
    display: none;
}

@media (max-width: 900px) {

    .app {
        grid-template-columns:
            210px minmax(0,1fr);
    }

    .members {
        display: none;
    }

    .name-input {
        width: 110px;
        flex-basis: 110px;
    }
}

@media (max-width: 650px) {

    body {
        overflow: hidden;
    }

    .app {
        display: block;

        padding: 0;

        height: 100vh;
    }

    .sidebar {
        display: none;
    }

    .chat {
        width: 100vw;
        height: 100vh;

        border: 0;
        border-radius: 0;
    }

    .chat-header {
        height: 62px;

        padding: 0 15px;
    }

    .messages {
        padding: 16px 12px;
    }

    .composer {
        padding: 10px;
        padding-bottom:
            calc(
                10px +
                env(safe-area-inset-bottom)
            );
    }

    .composer-inner {
        padding-left: 12px;
    }

    .name-input {
        display: none;
    }

    .channel-description {
        display: none;
    }

    .mobile-menu {
        display: block;
    }
}
</style>
</head>

<body>

<div id="background"></div>

<div class="app">

    <!-- =========================
         左侧
    ========================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                S
            </div>

            <div>
                <div class="brand-name">
                    Security Lab
                </div>

                <div class="brand-sub">
                    Community
                </div>
            </div>

        </div>


        <div class="section-title">
            CHANNELS
        </div>


        <div class="rooms">

            <button class="room active">

                <span class="room-icon">
                    #
                </span>

                <span class="room-name">
                    general
                </span>

                <span
                    id="roomCount"
                    class="room-count">
                    0
                </span>

            </button>


            <button
                class="room"
                onclick="alert('这个频道即将开放')">

                <span class="room-icon">
                    #
                </span>

                <span class="room-name">
                    technology
                </span>

            </button>


            <button
                class="room"
                onclick="alert('这个频道即将开放')">

                <span class="room-icon">
                    #
                </span>

                <span class="room-name">
                    gaming
                </span>

            </button>

        </div>


        <div class="profile">

            <div class="profile-box">

                <div class="avatar">

                    <span id="profileAvatar">
                        ?
                    </span>

                    <span class="online-dot"></span>

                </div>


                <div class="profile-name">

                    <strong id="profileName">
                        未设置昵称
                    </strong>

                    <span>
                        ● Online
                    </span>

                </div>

            </div>

        </div>

    </aside>


    <!-- =========================
         聊天
    ========================== -->

    <main class="chat">

        <header class="chat-header">

            <div class="channel-info">

                <div class="channel-icon">
                    #
                </div>

                <div>

                    <div class="channel-name">
                        general
                    </div>

                    <div class="channel-description">
                        欢迎来到 Security Lab 社区
                    </div>

                </div>

            </div>


            <div class="header-actions">

                <button
                    class="icon-btn mobile-menu"
                    onclick="alert('频道菜单')">
                    ☰
                </button>

                <button
                    class="icon-btn"
                    onclick="loadMessages()">
                    ↻
                </button>

            </div>

        </header>


        <div
            id="messages"
            class="messages"
        >

            <div class="welcome">

                <div class="welcome-icon">
                    #
                </div>

                <h1>
                    欢迎来到 #general
                </h1>

                <p>
                    这是 Security Lab 的公共聊天室。
                    现在开始聊天吧。
                </p>

            </div>

        </div>


        <div class="composer">

            <div class="composer-inner">

                <div class="name-input">

                    <input
                        id="chatName"
                        class="text-input"
                        maxlength="30"
                        placeholder="你的昵称"
                    >

                </div>


                <div class="message-input">

                    <input
                        id="chatText"
                        class="text-input"
                        maxlength="500"
                        placeholder="发送消息到 #general..."
                    >

                </div>


                <button
                    id="sendButton"
                    class="send-button"
                    title="发送">
                    ↑
                </button>

            </div>

        </div>

    </main>


    <!-- =========================
         右侧成员
    ========================== -->

    <aside class="members">

        <div class="members-header">

            <div class="members-title">
                在线成员
            </div>

            <div
                id="membersCount"
                class="members-count">
                1 人在线
            </div>

        </div>


        <div
            id="memberList"
            class="member-list">

            <div class="member">

                <div class="member-avatar">

                    ?

                    <span class="member-status"></span>

                </div>

                <div class="member-name">
                    未设置昵称
                </div>

            </div>

        </div>


        <div class="connection">

            <div class="connection-line">

                <span class="connection-dot"></span>

                <span id="connectionText">
                    正在连接...
                </span>

            </div>

        </div>

    </aside>

</div>


<script>

/* ==================================================
   Supabase 配置
================================================== */

const SUPABASE_URL =
    "https://lnducpwbmyjhnnjkqyxq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aukve7aK4EQCniOtCSy8uQ_raK8MH0j";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   元素
================================================== */

const messagesElement =
    document.getElementById("messages");

const chatName =
    document.getElementById("chatName");

const chatText =
    document.getElementById("chatText");

const sendButton =
    document.getElementById("sendButton");

const profileName =
    document.getElementById("profileName");

const profileAvatar =
    document.getElementById("profileAvatar");

const memberList =
    document.getElementById("memberList");

const membersCount =
    document.getElementById("membersCount");

const connectionText =
    document.getElementById("connectionText");

const roomCount =
    document.getElementById("roomCount");


/* ==================================================
   安全处理文字
================================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null
        ? ""
        : String(value);

    return div.innerHTML;
}


/* ==================================================
   昵称
================================================== */

const savedName =
    localStorage.getItem(
        "security_lab_username"
    );


if (savedName) {

    chatName.value =
        savedName;

    updateProfile(
        savedName
    );
}


chatName.addEventListener(
    "input",
    function() {

        const name =
            chatName.value.trim();

        if (name) {

            localStorage.setItem(
                "security_lab_username",
                name
            );

            updateProfile(name);

        } else {

            updateProfile(
                "未设置昵称"
            );
        }
    }
);


/* ==================================================
   更新个人资料
================================================== */

function updateProfile(name) {

    profileName.textContent =
        name;

    profileAvatar.textContent =
        getInitial(name);

    updateMemberList(name);
}


function getInitial(name) {

    if (
        !name ||
        name === "未设置昵称"
    ) {
        return "?";
    }

    return name
        .trim()
        .charAt(0)
        .toUpperCase();
}


/* ==================================================
   在线成员
================================================== */

function updateMemberList(name) {

    const safeName =
        name || "未设置昵称";

    memberList.innerHTML = `

        <div class="member">

            <div class="member-avatar">

                ${escapeHTML(
                    getInitial(safeName)
                )}

                <span class="member-status"></span>

            </div>

            <div class="member-name">

                ${escapeHTML(
                    safeName
                )}

            </div>

        </div>

    `;

    membersCount.textContent =
        "1 人在线";
}


/* ==================================================
   加载消息
================================================== */

async function loadMessages() {

    const result =
        await supabaseClient
            .from("messages")
            .select(
                "id,created_at,username,message"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            )
            .limit(100);


    if (result.error) {

        console.error(
            result.error
        );

        connectionText.textContent =
            "数据库连接失败";

        connectionText.style.color =
            "#ff6b6b";

        messagesElement.innerHTML = `

            <div class="welcome">

                <div class="welcome-icon">
                    !
                </div>

                <h1>
                    暂时无法读取消息
                </h1>

                <p>
                    ${escapeHTML(
                        result.error.message
                    )}
                </p>

            </div>

        `;

        return;
    }


    connectionText.textContent =
        "数据库已连接";

    connectionText.style.color =
        "#45e38a";


    messagesElement.innerHTML = `

        <div class="welcome">

            <div class="welcome-icon">
                #
            </div>

            <h1>
                欢迎来到 #general
            </h1>

            <p>
                这是 Security Lab 的公共聊天室。
                现在开始聊天吧。
            </p>

        </div>

    `;


    if (
        result.data &&
        result.data.length
    ) {

        result.data.forEach(
            function(item) {

                addMessage(item);

            }
        );
    }


    updateRoomCount(
        result.data
        ? result.data.length
        : 0
    );


    scrollToBottom();
}


/* ==================================================
   添加消息
================================================== */

function addMessage(item) {

    if (!item) {
        return;
    }


    if (
        item.id &&
        document.querySelector(
            '[data-message-id="' +
            item.id +
            '"]'
        )
    ) {

        return;
    }


    const message =
        document.createElement("div");

    message.className =
        "message";


    if (item.id) {

        message.dataset.messageId =
            item.id;
    }


    const name =
        item.username ||
        "匿名用户";


    const initial =
        getInitial(name);


    let time = "";

    if (item.created_at) {

        time =
            new Date(
                item.created_at
            ).toLocaleString(
                "zh-CN",
                {
                    month: "numeric",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
    }


    message.innerHTML = `

        <div class="message-avatar">

            ${escapeHTML(initial)}

        </div>


        <div class="message-content">

            <div class="message-top">

                <span class="message-user">

                    ${escapeHTML(name)}

                </span>

                <span class="message-time">

                    ${escapeHTML(time)}

                </span>

            </div>


            <div class="message-text">

                ${escapeHTML(
                    item.message
                )}

            </div>

        </div>

    `;


    messagesElement.appendChild(
        message
    );
}


/* ==================================================
   更新消息数量
================================================== */

function updateRoomCount(count) {

    roomCount.textContent =
        count || 0;
}


/* ==================================================
   发送消息
================================================== */

async function sendMessage() {

    const username =
        chatName.value.trim();

    const message =
        chatText.value.trim();


    if (!username) {

        alert(
            "请先输入你的昵称"
        );

        chatName.focus();

        return;
    }


    if (!message) {

        chatText.focus();

        return;
    }


    if (
        username.length > 30
    ) {

        alert(
            "昵称最多30个字符"
        );

        return;
    }


    if (
        message.length > 500
    ) {

        alert(
            "消息最多500个字符"
        );

        return;
    }


    sendButton.disabled =
        true;

    sendButton.textContent =
        "…";


    const result =
        await supabaseClient
            .from("messages")
            .insert({

                username:
                    username,

                message:
                    message

            })
            .select()
            .single();


    if (result.error) {

        console.error(
            result.error
        );

        alert(
            "发送失败：\n" +
            result.error.message
        );

        sendButton.disabled =
            false;

        sendButton.textContent =
            "↑";

        return;
    }


    localStorage.setItem(
        "security_lab_username",
        username
    );


    chatText.value =
        "";


    /*
       立即显示消息
    */

    addMessage(
        result.data
    );


    updateRoomCount(
        document.querySelectorAll(
            ".message"
        ).length
    );


    scrollToBottom();


    sendButton.disabled =
        false;

    sendButton.textContent =
        "↑";
}


/* ==================================================
   点击发送
================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* ==================================================
   Enter 发送
================================================== */

chatText.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* ==================================================
   滚动到底部
================================================== */

function scrollToBottom() {

    setTimeout(
        function() {

            messagesElement.scrollTop =
                messagesElement.scrollHeight;

        },
        50
    );
}


/* ==================================================
   Supabase Realtime
================================================== */

const realtimeChannel =
    supabaseClient
        .channel(
            "security-lab-chat"
        )
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            function(payload) {

                console.log(
                    "New message:",
                    payload.new
                );


                addMessage(
                    payload.new
                );


                updateRoomCount(
                    document.querySelectorAll(
                        ".message"
                    ).length
                );


                scrollToBottom();
            }
        )
        .subscribe(
            function(state) {

                console.log(
                    "Realtime:",
                    state
                );


                if (
                    state === "SUBSCRIBED"
                ) {

                    connectionText.textContent =
                        "实时连接正常";

                    connectionText.style.color =
                        "#45e38a";
                }

            }
        );


/* ==================================================
   启动
================================================== */

loadMessages();

</script>
