<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>安全实验室聊天室</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    font-family:Arial,"Microsoft YaHei",sans-serif;
    background:#020b06;
    color:#00ff66;
}

body{overflow-x:hidden}

#matrix{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
}

.page{
    position:relative;
    z-index:1;
    min-height:100vh;
    padding:25px 15px;
}

.header,
.box{
    max-width:1000px;
    margin:20px auto;
    padding:25px;
    border:1px solid rgba(0,255,102,.4);
    border-radius:16px;
    background:rgba(0,15,8,.92);
    box-shadow:0 0 25px rgba(0,255,102,.12);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
    text-shadow:0 0 12px #00ff66;
}

.status{
    font-size:14px;
}

.dot{
    display:inline-block;
    width:9px;
    height:9px;
    margin-right:6px;
    border-radius:50%;
    background:#00ff66;
    box-shadow:0 0 12px #00ff66;
}

.title{
    text-align:center;
    font-size:40px;
    margin:0 0 8px;
    text-shadow:0 0 20px #00ff66;
}

.subtitle{
    text-align:center;
    color:#72ffad;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid #00aa44;
    border-radius:8px;
    outline:none;
    background:rgba(0,0,0,.7);
    color:#00ff66;
    font-size:16px;
}

.input:focus{
    border-color:#00ff66;
    box-shadow:0 0 12px rgba(0,255,102,.35);
}

.btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#00b84f;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.btn:hover{
    background:#00e861;
}

.chat{
    max-width:1000px;
    margin:30px auto;
}

.messages{
    height:400px;
    overflow-y:auto;
    padding:15px;
    border:1px solid rgba(0,255,102,.3);
    border-radius:10px;
    background:rgba(0,0,0,.55);
}

.message{
    padding:10px 12px;
    margin-bottom:10px;
    border-left:3px solid #00ff66;
    background:rgba(0,255,102,.05);
    border-radius:6px;
}

.username{
    color:#00ff66;
    font-weight:bold;
}

.time{
    color:#579b70;
    font-size:12px;
    margin-left:8px;
}

.text{
    margin-top:5px;
    color:#d5ffe2;
    word-break:break-word;
}

.send-area{
    display:grid;
    grid-template-columns:180px 1fr 110px;
    gap:10px;
    margin-top:12px;
}

.send-area .input{
    margin:0;
}

.send{
    margin:0;
}

.info{
    margin-top:10px;
    color:#72ffad;
    font-size:13px;
}

.error{
    color:#ff6666;
}

.footer{
    text-align:center;
    color:#579b70;
    padding:30px;
}

@media(max-width:700px){
    .header{
        padding:15px;
    }

    .title{
        font-size:30px;
    }

    .send-area{
        grid-template-columns:1fr;
    }

    .send{
        margin-top:5px;
    }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="page">

<header class="header">
    <div class="logo">🛡 SECURITY LAB</div>

    <div class="status">
        <span class="dot"></span>
        系统在线
    </div>
</header>


<section class="box">

    <h1 class="title">安全实验室</h1>

    <div class="subtitle">
        SECURITY LAB · REALTIME CHAT
    </div>

    <input
        id="username"
        class="input"
        maxlength="30"
        placeholder="输入聊天昵称"
    >

    <div id="userInfo" class="info">
        当前未设置昵称
    </div>

</section>


<section class="box chat">

    <h2>💬 实时聊天室</h2>

    <div id="messages" class="messages">
        正在连接聊天服务器...
    </div>

    <div class="send-area">

        <input
            id="chatName"
            class="input"
            maxlength="30"
            placeholder="昵称"
        >

        <input
            id="chatText"
            class="input"
            maxlength="500"
            placeholder="输入消息，按 Enter 发送"
        >

        <button
            id="sendButton"
            class="btn send"
        >
            发送
        </button>

    </div>

    <div id="status" class="info">
        正在连接 Supabase...
    </div>

</section>


<section class="box">

    <h2>📊 系统状态</h2>

    <p>
        数据库：
        <strong id="databaseStatus">
            检查中
        </strong>
    </p>

    <p>
        当前时间：
        <strong id="clock">
            --:--:--
        </strong>
    </p>

</section>


<footer class="footer">
    SECURITY LAB DEMO · 仅用于合法安全实验
</footer>

</div>


<script>

/* =====================================
   Supabase 配置
===================================== */

const SUPABASE_URL =
"https://inducpwbmyjhnnjkqyxq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aukve7aK4EQCniOtCSy8uQ_raK8MH0j";


/* 创建客户端 */

const client =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   页面元素
===================================== */

const usernameInput =
document.getElementById("username");

const chatName =
document.getElementById("chatName");

const chatText =
document.getElementById("chatText");

const messages =
document.getElementById("messages");

const status =
document.getElementById("status");

const databaseStatus =
document.getElementById("databaseStatus");

const userInfo =
document.getElementById("userInfo");


/* =====================================
   恢复昵称
===================================== */

const savedName =
localStorage.getItem(
    "security_lab_username"
);

if(savedName){

    usernameInput.value =
        savedName;

    chatName.value =
        savedName;

    userInfo.textContent =
        "当前昵称：" +
        savedName;
}


/* =====================================
   保存昵称
===================================== */

usernameInput.addEventListener(
    "input",
    function(){

        const name =
        usernameInput.value.trim();

        chatName.value =
        name;

        if(name){

            localStorage.setItem(
                "security_lab_username",
                name
            );

            userInfo.textContent =
                "当前昵称：" +
                name;

        }else{

            userInfo.textContent =
                "当前未设置昵称";
        }
    }
);


/* =====================================
   防止 HTML 注入
===================================== */

function escapeHTML(value){

    const div =
    document.createElement("div");

    div.textContent =
    value == null ? "" : String(value);

    return div.innerHTML;
}


/* =====================================
   加载聊天记录
===================================== */

async function loadMessages(){

    const result =
    await client
        .from("messages")
        .select(
            "id,created_at,username,message"
        )
        .order(
            "created_at",
            {ascending:true}
        )
        .limit(100);


    if(result.error){

        console.error(
            result.error
        );

        databaseStatus.textContent =
            "连接失败";

        status.innerHTML =
            '<span class="error">' +
            "读取聊天记录失败：" +
            escapeHTML(
                result.error.message
            ) +
            "</span>";

        return;
    }


    databaseStatus.textContent =
        "正常";

    status.textContent =
        "Supabase 已连接";


    messages.innerHTML = "";


    if(
        !result.data ||
        result.data.length === 0
    ){

        messages.innerHTML =
            "<div>目前没有聊天消息。</div>";

        return;
    }


    result.data.forEach(
        addMessage
    );


    scrollToBottom();
}


/* =====================================
   显示一条消息
===================================== */

function addMessage(item){

    if(
        document.querySelector(
            '[data-id="' +
            item.id +
            '"]'
        )
    ){

        return;
    }


    const div =
    document.createElement("div");

    div.className =
        "message";

    div.dataset.id =
        item.id;


    const username =
        escapeHTML(
            item.username
        );

    const text =
        escapeHTML(
            item.message
        );

    const time =
        item.created_at
        ? new Date(
            item.created_at
        ).toLocaleString("zh-CN")
        : "";


    div.innerHTML =

        '<div>' +

            '<span class="username">' +
            username +
            '</span>' +

            '<span class="time">' +
            escapeHTML(time) +
            '</span>' +

        '</div>' +

        '<div class="text">' +
        text +
        '</div>';


    messages.appendChild(
        div
    );
}


/* =====================================
   发送消息
===================================== */

async function sendMessage(){

    const username =
        chatName.value.trim();

    const message =
        chatText.value.trim();


    if(!username){

        alert("请输入昵称");

        chatName.focus();

        return;
    }


    if(!message){

        alert("请输入消息");

        chatText.focus();

        return;
    }


    if(username.length > 30){

        alert("昵称最多 30 个字符");

        return;
    }


    if(message.length > 500){

        alert("消息最多 500 个字符");

        return;
    }


    status.textContent =
        "正在发送...";


    const result =
    await client
        .from("messages")
        .insert({

            username:
                username,

            message:
                message
        })
        .select()
        .single();


    if(result.error){

        console.error(
            result.error
        );

        status.innerHTML =
            '<span class="error">' +
            "发送失败：" +
            escapeHTML(
                result.error.message
            ) +
            "</span>";

        return;
    }


    chatText.value = "";


    localStorage.setItem(
        "security_lab_username",
        username
    );


    status.textContent =
        "消息发送成功";


    /*
       立即显示自己的消息。
       如果 Realtime 随后收到同一条消息，
       addMessage 会自动避免重复。
    */

    if(result.data){

        addMessage(
            result.data
        );

        scrollToBottom();
    }
}


/* =====================================
   Enter 发送
===================================== */

chatText.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =====================================
   滚动到底部
===================================== */

function scrollToBottom(){

    messages.scrollTop =
        messages.scrollHeight;
}


/* =====================================
   Realtime
===================================== */

const channel =
client
    .channel(
        "security-lab-chat"
    )
    .on(
        "postgres_changes",
        {
            event:"INSERT",
            schema:"public",
            table:"messages"
        },
        function(payload){

            addMessage(
                payload.new
            );

            scrollToBottom();
        }
    )
    .subscribe(
        function(channelStatus){

            console.log(
                "Realtime:",
                channelStatus
            );
        }
    );


/* =====================================
   时钟
===================================== */

function updateClock(){

    document.getElementById(
        "clock"
    ).textContent =
        new Date().toLocaleTimeString(
            "zh-CN"
        );
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================
   Matrix 背景
===================================== */

const canvas =
document.getElementById(
    "matrix"
);

const ctx =
canvas.getContext("2d");

let width;
let height;
let columns;
let drops;

const characters =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789{}[]<>/\\$#@%";


function resizeMatrix(){

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;

    columns =
        Math.floor(
            width / 18
        );

    drops = [];

    for(
        let i = 0;
        i < columns;
        i++
    ){

        drops[i] =
            Math.random() * -50;
    }
}


function drawMatrix(){

    ctx.fillStyle =
        "rgba(2,11,6,0.08)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    ctx.font =
        "16px monospace";


    for(
        let i = 0;
        i < drops.length;
        i++
    ){

        const text =
            characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];


        ctx.fillStyle =
            "#00ff66";


        ctx.fillText(
            text,
            i * 18,
            drops[i] * 18
        );


        if(
            drops[i] * 18 > height &&
            Math.random() > 0.975
        ){

            drops[i] = 0;
        }


        drops[i]++;
    }
}


resizeMatrix();

window.addEventListener(
    "resize",
    resizeMatrix
);

setInterval(
    drawMatrix,
    50
);


/* =====================================
   启动
===================================== */

loadMessages();

</script>

</body>
</html>
