<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#020817">

<title>Security Lab</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#020817;
    --panel:rgba(5,20,48,.68);
    --panel2:rgba(8,29,65,.72);
    --line:rgba(92,174,255,.28);
    --blue:#3b82f6;
    --cyan:#22d3ee;
    --purple:#8b5cf6;
    --green:#22c55e;
    --text:#eef6ff;
    --muted:#8ca4c3;
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        "Microsoft YaHei",
        sans-serif;
}

body{
    overflow:hidden;
}

/* ================================
   星空背景
================================ */

#space{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    background:
        radial-gradient(
            circle at 50% 50%,
            #09265c 0%,
            #031637 42%,
            #010817 78%,
            #00030a 100%
        );
}

/* ================================
   地球
================================ */

.globe-layer{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#globe{
    width:min(720px,75vw);
    height:min(720px,75vw);
    opacity:.82;
    filter:
        drop-shadow(0 0 30px rgba(38,160,255,.25))
        drop-shadow(0 0 100px rgba(0,110,255,.18));
}

/* ================================
   光晕
================================ */

.ambient{
    position:fixed;
    width:380px;
    height:380px;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
    filter:blur(90px);
    opacity:.26;
    animation:floatLight 9s ease-in-out infinite alternate;
}

.ambient.one{
    background:#2563eb;
    left:8%;
    top:18%;
}

.ambient.two{
    background:#7c3aed;
    right:8%;
    top:28%;
    animation-delay:-3s;
}

.ambient.three{
    background:#06b6d4;
    left:38%;
    bottom:-80px;
    animation-delay:-6s;
}

@keyframes floatLight{
    from{
        transform:translate3d(-20px,-15px,0) scale(.9);
    }
    to{
        transform:translate3d(25px,20px,0) scale(1.12);
    }
}

/* ================================
   APP
================================ */

.app{
    position:relative;
    z-index:2;

    width:100vw;
    height:100vh;

    display:grid;
    grid-template-columns:230px minmax(0,1fr) 285px;

    gap:14px;
    padding:14px;
}

/* ================================
   面板
================================ */

.sidebar,
.chat,
.profile{
    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(10,35,76,.76),
            rgba(3,14,35,.72)
        );

    border:1px solid rgba(78,166,255,.32);

    box-shadow:
        inset 0 0 40px rgba(37,99,235,.06),
        0 20px 70px rgba(0,0,0,.32);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    overflow:hidden;
}

.sidebar::before,
.chat::before,
.profile::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    border-radius:inherit;

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.035),
        inset 0 0 35px rgba(37,99,235,.08);
}

/* 科技角 */

.sidebar::after,
.chat::after,
.profile::after{
    content:"";
    position:absolute;

    width:45px;
    height:45px;

    right:-1px;
    top:-1px;

    border-top:2px solid rgba(72,180,255,.7);
    border-right:2px solid rgba(72,180,255,.7);

    border-top-right-radius:20px;

    pointer-events:none;
}

/* ================================
   左栏
================================ */

.sidebar{
    border-radius:24px;
    padding:18px 12px;

    display:flex;
    flex-direction:column;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    padding:8px 10px 22px;
}

.brand-icon{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #8b5cf6
        );

    box-shadow:
        0 0 25px rgba(79,70,229,.55);

    font-size:20px;
}

.brand-name{
    font-size:16px;
    font-weight:800;
}

.brand-sub{
    color:#8ca4c3;
    font-size:10px;
    margin-top:3px;
}

.section-title{
    padding:10px;
    color:#7090b4;
    font-size:10px;
    font-weight:800;
    letter-spacing:.12em;
}

.channel{
    display:flex;
    align-items:center;
    gap:10px;

    margin:3px 0;
    padding:11px 12px;

    border-radius:12px;

    color:#9bb2cf;

    cursor:pointer;

    transition:.2s;
}

.channel:hover{
    background:rgba(37,99,235,.12);
    color:#dcebff;
}

.channel.active{
    color:white;
    background:
        linear-gradient(
            90deg,
            rgba(37,99,235,.42),
            rgba(79,70,229,.22)
        );

    border:1px solid rgba(70,150,255,.35);

    box-shadow:
        0 0 20px rgba(37,99,235,.15);
}

.channel-icon{
    color:#70b7ff;
    font-size:17px;
}

.sidebar-bottom{
    margin-top:auto;
}

.mini-status{
    display:flex;
    align-items:center;
    gap:8px;

    padding:12px;

    border:1px solid rgba(52,211,153,.18);
    border-radius:12px;

    background:rgba(16,185,129,.05);

    color:#8db1ad;
    font-size:11px;
}

.green-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;

    box-shadow:
        0 0 8px #22c55e,
        0 0 16px rgba(34,197,94,.55);

    flex:none;
}

/* ================================
   聊天
================================ */

.chat{
    border-radius:24px;

    display:flex;
    flex-direction:column;

    min-width:0;
}

.chat-header{
    height:76px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    border-bottom:1px solid rgba(80,150,220,.18);

    background:rgba(3,18,45,.4);
}

.chat-title{
    display:flex;
    align-items:center;
    gap:11px;
}

.hash{
    font-size:25px;
    color:#62aefc;
}

.chat-name{
    font-size:16px;
    font-weight:800;
}

.chat-description{
    color:#7795b8;
    font-size:10px;
    margin-top:3px;
}

.connection{
    display:flex;
    align-items:center;
    gap:7px;

    color:#a8c0dc;
    font-size:12px;
}

/* ================================
   消息区
================================ */

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:22px;

    position:relative;
}

.messages::-webkit-scrollbar{
    width:5px;
}

.messages::-webkit-scrollbar-thumb{
    background:rgba(91,155,220,.3);
    border-radius:10px;
}

.message{
    position:relative;

    display:flex;
    gap:11px;

    margin-bottom:20px;

    animation:messageIn .22s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(6px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    width:39px;
    height:39px;

    flex:0 0 39px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #8b5cf6
        );

    border:1px solid rgba(120,190,255,.3);

    box-shadow:
        0 0 18px rgba(59,130,246,.2);

    font-weight:800;
}

.message-content{
    min-width:0;
}

.message-top{
    display:flex;
    align-items:baseline;
    gap:8px;
}

.message-user{
    font-size:14px;
    font-weight:800;
    color:#e7f2ff;
}

.message-time{
    color:#64809f;
    font-size:10px;
}

.message-text{
    margin-top:5px;

    color:#b9cee6;

    line-height:1.6;

    word-break:break-word;
    white-space:pre-wrap;
}

.reactions{
    display:flex;
    gap:5px;
    margin-top:8px;
    flex-wrap:wrap;
}

.reaction{
    border:1px solid rgba(86,150,210,.25);

    background:rgba(20,49,88,.55);

    color:#b9cee6;

    border-radius:12px;

    padding:4px 8px;

    font-size:12px;

    cursor:pointer;

    transition:.15s;
}

.reaction:hover{
    background:rgba(37,99,235,.3);
    border-color:#4b9cff;
}

.typing{
    position:absolute;
    left:22px;
    bottom:8px;

    color:#6685a8;

    font-size:11px;

    opacity:0;

    transition:.2s;
}

.typing.show{
    opacity:1;
}

.typing-dots span{
    display:inline-block;

    width:4px;
    height:4px;

    margin-left:2px;

    border-radius:50%;

    background:#60a5fa;

    animation:typing 1s infinite;
}

.typing-dots span:nth-child(2){
    animation-delay:.15s;
}

.typing-dots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,100%{opacity:.2;transform:translateY(0)}
    50%{opacity:1;transform:translateY(-2px)}
}

/* ================================
   输入
================================ */

.input-area{
    flex:none;

    padding:12px 18px 18px;

    border-top:1px solid rgba(80,150,220,.18);

    background:rgba(2,15,38,.48);
}

.input-box{
    display:flex;
    align-items:center;
    gap:8px;

    padding:6px 7px 6px 15px;

    border:1px solid rgba(77,151,226,.35);

    border-radius:16px;

    background:rgba(5,29,65,.7);

    box-shadow:
        inset 0 0 20px rgba(37,99,235,.05);
}

.input-box:focus-within{
    border-color:#479cff;

    box-shadow:
        0 0 0 3px rgba(59,130,246,.1),
        0 0 25px rgba(37,99,235,.1);
}

.message-input{
    flex:1;
    min-width:0;

    border:0;
    outline:0;

    background:transparent;

    color:white;

    font-size:15px;
}

.message-input::placeholder{
    color:#6683a4;
}

.send{
    width:40px;
    height:40px;

    border:0;
    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color:white;

    font-size:19px;

    cursor:pointer;

    box-shadow:
        0 0 18px rgba(59,130,246,.3);

    transition:.18s;
}

.send:hover{
    transform:scale(1.05);
}

.send:disabled{
    opacity:.45;
}

/* ================================
   右栏
================================ */

.profile{
    border-radius:24px;
    padding:18px;

    overflow-y:auto;
}

.profile-title{
    color:#7290b3;

    font-size:10px;

    font-weight:800;

    letter-spacing:.12em;

    margin:5px 4px 13px;
}

.user-card{
    padding:17px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(23,56,104,.7),
            rgba(6,25,58,.68)
        );

    border:1px solid rgba(80,155,235,.3);
}

.user-main{
    display:flex;
    align-items:center;
    gap:11px;
}

.big-avatar{
    width:53px;
    height:53px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #8b5cf6
        );

    font-size:18px;
    font-weight:800;

    box-shadow:
        0 0 25px rgba(79,70,229,.28);
}

.user-name{
    font-weight:800;
}

.user-online{
    display:flex;
    align-items:center;
    gap:5px;

    margin-top:5px;

    color:#54e29a;
    font-size:10px;
}

.info-divider{
    height:1px;
    background:rgba(110,160,210,.15);
    margin:16px 0;
}

.info-row{
    display:flex;
    align-items:center;
    gap:9px;

    padding:7px 0;

    color:#9bb2cd;
    font-size:12px;
}

.info-icon{
    width:24px;
    text-align:center;
}

/* ================================
   天气
================================ */

.weather{
    padding:17px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(22,86,160,.65),
            rgba(8,37,78,.72)
        );

    border:1px solid rgba(82,173,255,.35);

    box-shadow:
        inset 0 0 30px rgba(59,130,246,.07);
}

.weather-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.weather-temp{
    font-size:34px;
    font-weight:800;
}

.weather-icon{
    font-size:34px;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,220,100,.35)
        );
}

.weather-city{
    margin-top:3px;

    color:#9db6d3;
    font-size:12px;
}

.weather-detail{
    margin-top:13px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:7px;
}

.weather-small{
    padding:9px;

    border-radius:10px;

    background:rgba(2,20,49,.5);

    color:#7695b7;

    font-size:10px;
}

.weather-small strong{
    display:block;

    margin-top:3px;

    color:#dcecff;

    font-size:12px;
}

.status-message{
    margin-top:12px;

    color:#7794b5;

    font-size:10px;
}

/* ================================
   Toast
================================ */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:translate(-50%,20px);

    z-index:99;

    padding:11px 16px;

    border:1px solid rgba(90,160,230,.35);

    border-radius:13px;

    background:rgba(5,20,48,.9);

    backdrop-filter:blur(20px);

    color:#dcecff;

    font-size:12px;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* ================================
   手机
================================ */

@media(max-width:900px){

    .app{
        grid-template-columns:190px minmax(0,1fr);
    }

    .profile{
        display:none;
    }

}

@media(max-width:650px){

    body{
        overflow:hidden;
    }

    .app{
        display:block;

        width:100%;
        height:100vh;

        padding:8px;
    }

    .sidebar{
        height:58px;

        padding:8px 10px;

        margin-bottom:8px;

        border-radius:17px;

        flex-direction:row;
        align-items:center;
    }

    .brand{
        padding:0;
        margin-right:8px;
    }

    .brand-icon{
        width:40px;
        height:40px;
    }

    .brand-text{
        display:none;
    }

    .section-title,
    .sidebar-bottom{
        display:none;
    }

    .channel{
        display:none;
    }

    .channel.active{
        display:flex;

        margin:0;

        padding:9px 12px;
    }

    .chat{
        height:calc(100vh - 74px);

        min-height:0;

        border-radius:18px;
    }

    .chat-header{
        height:62px;
        padding:0 15px;
    }

    .messages{
        padding:16px 13px 35px;
    }

    .input-area{
        padding:9px;
    }

    .chat-description{
        display:none;
    }

    #globe{
        width:105vw;
        height:105vw;
        opacity:.58;
    }

    .ambient{
        width:260px;
        height:260px;
        filter:blur(75px);
    }

}

/* 超小屏 */
@media(max-width:380px){

    .chat-name{
        font-size:14px;
    }

    .connection{
        font-size:10px;
    }

}
</style>
</head>

</aside>

</div>

/* =========================================================
   SUPABASE
   只使用 publishable key
========================================================= */

const SUPABASE_URL =
    "https://inducpwbmyjhnnjkqyxq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aukve7aK4EQCniOtCSy8uQ_raK8MH0j";

let supabaseClient = null;

try{

    if(
        window.supabase &&
        typeof window.supabase.createClient === "function"
    ){

        supabaseClient =
            window.supabase.createClient(

/* =========================================================
   Toast
========================================================= */

let toastTimer = null;

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove("show");

            },
            2500
        );
}


/* =========================================================
   HTML安全
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   时间
========================================================= */

function formatTime(value){

    if(!value){
        return "";
    }

    const date =
        new Date(value);

    if(isNaN(date.getTime())){
        return "";
    }

    return date.toLocaleString(
        "zh-CN",
        {
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =========================================================
   加载消息
========================================================= */

let firstMessageLoad = true;

async function loadMessages(){

    if(!supabaseClient){

        setServerStatus(false);

        return;

    }

    try{

        const result =
            await supabaseClient
                .from("messages")
                .select(
                    "id,username,message,created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                )
                .limit(100);


        if(result.error){

            console.error(
                "Supabase:",
                result.error
            );

            setServerStatus(false);

            return;

        }


        setServerStatus(true);

        renderMessages(
            result.data || []
        );


    }catch(error){

        console.error(
            "加载消息失败:",
            error
        );

        setServerStatus(false);

    }

}


/* =========================================================
   状态
========================================================= */

function setServerStatus(online){

    const status =
        document.getElementById(
            "serverStatus"
        );

    if(online){

        status.textContent =
            "聊天服务器已连接";

    }else{

        status.textContent =
            "聊天服务器暂时不可用";

    }

}


/* =========================================================
   显示消息
========================================================= */

function renderMessages(list){

    const box =
        document.getElementById(
            "messages"
        );

    const typing =
        document.getElementById(
            "typing"
        );


    box.innerHTML = "";


    if(!list.length){

        box.innerHTML = `

            <div style="
                text-align:center;
                color:#7190b3;
                padding:55px 20px;
            ">

                <div style="
                    font-size:32px;
                    margin-bottom:10px;
                ">
                    🌍
                </div>

                还没有消息

                <div style="
                    font-size:11px;
                    margin-top:6px;
                ">
                    发送第一条消息吧
                </div>

            </div>

        `;

        box.appendChild(typing);

        return;

    }


    list.forEach(
        function(item){

            const username =
                item.username ||
                "匿名";

            const text =
                item.message ||
                "";

            const avatar =
                username
                    .charAt(0)
                    .toUpperCase();


            const message =
                document.createElement(
                    "div"
                );

            message.className =
                "message";


            message.innerHTML = `

                <div class="avatar">
                    ${escapeHTML(avatar)}
                </div>

                <div class="message-content">

                    <div class="message-top">

                        <span class="message-user">
                            ${escapeHTML(username)}
                        </span>

                        <span class="message-time">
                            ${formatTime(item.created_at)}
                        </span>

                    </div>

                    <div class="message-text">
                        ${escapeHTML(text)}
                    </div>

                    <div class="reactions">

                        <button
                            class="reaction"
                            onclick="fakeReaction(this)"
                        >
                            ❤️ 0
                        </button>

                        <button
                            class="reaction"
                            onclick="fakeReaction(this)"
                        >
                            👍 0
                        </button>

                        <button
                            class="reaction"
                            onclick="fakeReaction(this)"
                        >
                            😂 0
                        </button>

                    </div>

                </div>
            `;


            box.appendChild(message);

        }
    );


    box.appendChild(typing);


    if(firstMessageLoad){

        box.scrollTop =
            box.scrollHeight;

        firstMessageLoad = false;

    }

}


/* =========================================================
   表情
   不修改 Supabase
========================================================= */

function fakeReaction(button){

    const match =
        button.textContent.match(
            /(\d+)$/
        );

    if(!match){
        return;
    }

    const number =
        Number(match[1]) + 1;

    button.textContent =
        button.textContent.replace(
            /\d+$/,
            number
        );

}


/* =========================================================
   发送消息
========================================================= */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    if(!supabaseClient){

        showToast(
            "聊天服务器暂时不可用"
        );

        return;

    }


    button.disabled = true;


    try{

        const result =
            await supabaseClient
                .from("messages")
                .insert([
                    {
                        username:
                            nickname || "游客",

                        message:
                            text
                    }
                ]);


        if(result.error){

            console.error(
                result.error
            );

            showToast(
                "发送失败：" +
                result.error.message
            );

            return;

        }


        input.value = "";

        await loadMessages();


    }catch(error){

        console.error(error);

        showToast(
            "发送失败：无法连接服务器"
        );

    }finally{

        button.disabled = false;

    }

}

/* =========================================================
   IP → 天气
========================================================= */

async function loadWeather(){

    const status =
        document.getElementById(
            "weatherStatus"
        );

    try{

        const response =
            await fetch(
                "https://ipwho.is/",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "IP服务不可用"
            );

        }


        const ip =
            await response.json();


        if(!ip.success){

            throw new Error(
                "IP定位失败"
            );

        }


        const city =
            ip.city ||
            "未知城市";

        const country =
            ip.country ||
            "";


        document.getElementById(
            "location"
        ).textContent =
            city;


        document.getElementById(
            "weatherCity"
        ).textContent =
            city +
            (
                country
                    ? " · " + country
                    : ""
            );


        if(
            ip.latitude == null ||
            ip.longitude == null
        ){

            throw new Error(
                "坐标获取失败"
            );

        }


        const weatherURL =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" +
            encodeURIComponent(ip.latitude) +
            "&longitude=" +
            encodeURIComponent(ip.longitude) +
            "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code" +
            "&timezone=auto";


        const weatherResponse =
            await fetch(
                weatherURL
            );


        if(!weatherResponse.ok){

            throw new Error(
                "天气服务不可用"
            );

        }


        const weather =
            await weatherResponse.json();


        const current =
            weather.current;


        const temperature =
            Math.round(
                current.temperature_2m
            );


        document.getElementById(
            "temperature"
        ).textContent =
            temperature + "°";


        document.getElementById(
            "humidity"
        ).textContent =
            current.relative_humidity_2m +
            "%";


        document.getElementById(
            "wind"
        ).textContent =
            Math.round(
                current.wind_speed_10m
            ) +
            " km/h";


        const info =
            getWeatherInfo(
                current.weather_code
            );


        document.getElementById(
            "weatherIcon"
        ).textContent =
            info.icon;


        status.textContent =
            info.text;


    }catch(error){

        console.error(
            "天气:",
            error
        );

        status.textContent =
            "天气暂时无法获取";

    }

}


function getWeatherInfo(code){

    if(code === 0)
        return {
            icon:"☀️",
            text:"晴朗"
        };

    if(code === 1 || code === 2)
        return {
            icon:"🌤️",
            text:"晴间多云"
        };

    if(code === 3)
        return {
            icon:"☁️",
            text:"多云"
        };

    if(code >= 45 && code <= 48)
        return {
            icon:"🌫️",
            text:"雾"
        };

    if(code >= 51 && code <= 67)
        return {
            icon:"🌧️",
            text:"降雨"
        };

    if(code >= 71 && code <= 77)
        return {
            icon:"❄️",
            text:"降雪"
        };

    if(code >= 80 && code <= 82)
        return {
            icon:"🌦️",
            text:"阵雨"
        };

    if(code >= 95)
        return {
            icon:"⛈️",
            text:"雷暴"
        };

    return {
        icon:"🌤️",
        text:"天气未知"
    };

}


/* =========================================================
   星空 Canvas
========================================================= */

const space =
    document.getElementById(
        "space"
    );

const sctx =
    space.getContext("2d");

let stars = [];

function resizeSpace(){

    space.width =
        window.innerWidth *
        devicePixelRatio;

    space.height =
        window.innerHeight *
        devicePixelRatio;

    sctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );


    const count =
        Math.min(
            220,
            Math.floor(
                window.innerWidth *
                window.innerHeight /
                7000
            )
        );


    stars = [];

    for(
        let i=0;
        i<count;
        i++
    ){

        stars.push({

            x:
                Math.random() *
                window.innerWidth,

            y:
                Math.random() *
                window.innerHeight,

            r:
                Math.random() *
                1.3 + .25,

            a:
                Math.random() *
                .7 + .2,

            speed:
                Math.random() *
                .15 + .03

        });

    }

}

resizeSpace();

window.addEventListener(
    "resize",
    resizeSpace
);


function animateSpace(){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    sctx.clearRect(
        0,
        0,
        w,
        h
    );


    stars.forEach(
        function(star){

            star.y -= star.speed;

            if(star.y < -5){

                star.y = h + 5;

            }


            const pulse =
                star.a +
                Math.sin(
                    Date.now() / 900 +
                    star.x
                ) * .15;


            sctx.beginPath();

            sctx.arc(
                star.x,
                star.y,
                star.r,
                0,
                Math.PI * 2
            );

            sctx.fillStyle =
                "rgba(170,220,255," +
                Math.max(.08,pulse) +
                ")";

            sctx.fill();

        }
    );


    requestAnimationFrame(
        animateSpace
    );

}

animateSpace();


/* =========================================================
   动态地球 Canvas
========================================================= */

const globe =
    document.getElementById(
        "globe"
    );

const gctx =
    globe.getContext("2d");

let globeSize = 600;

function resizeGlobe(){

    globeSize =
        Math.min(
            720,
            Math.max(
                260,
                Math.min(
                    window.innerWidth * .72,
                    window.innerHeight * .72
                )
            )
        );


    const scale =
        window.devicePixelRatio || 1;


    globe.width =
        globeSize * scale;

    globe.height =
        globeSize * scale;

    globe.style.width =
        globeSize + "px";

    globe.style.height =
        globeSize + "px";

    gctx.setTransform(
        scale,
        0,
        0,
        scale,
        0,
        0
    );

}

resizeGlobe();

window.addEventListener(
    "resize",
    resizeGlobe
);


/* 地球绘制 */

function drawGlobe(time){

    const size =
        globeSize;

    const cx =
        size / 2;

    const cy =
        size / 2;

    const r =
        size * .35;


    gctx.clearRect(
        0,
        0,
        size,
        size
    );


    /* 外部辉光 */

    const glow =
        gctx.createRadialGradient(
            cx,
            cy,
            r * .7,
            cx,
            cy,
            r * 1.45
        );

    glow.addColorStop(
        0,
        "rgba(30,150,255,.22)"
    );

    glow.addColorStop(
        .55,
        "rgba(20,100,255,.08)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    gctx.beginPath();

    gctx.arc(
        cx,
        cy,
        r * 1.45,
        0,
        Math.PI * 2
    );

    gctx.fillStyle =
        glow;

    gctx.fill();


    /* 地球本体 */

    const earth =
        gctx.createRadialGradient(
            cx-r*.35,
            cy-r*.35,
            r*.05,
            cx,
            cy,
            r
        );

    earth.addColorStop(
        0,
        "#1c8edb"
    );

    earth.addColorStop(
        .45,
        "#0753a4"
    );

    earth.addColorStop(
        .82,
        "#032b65"
    );

    earth.addColorStop(
        1,
        "#01152f"
    );


    gctx.beginPath();

    gctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI * 2
    );

    gctx.fillStyle =
        earth;

    gctx.fill();


    /* 经纬线 */

    const rotation =
        time * .00018;


    gctx.save();

    gctx.beginPath();

    gctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI * 2
    );

    gctx.clip();


    gctx.strokeStyle =
        "rgba(80,205,255,.28)";

    gctx.lineWidth =
        1;


    /* 纬线 */

    for(
        let i=-4;
        i<=4;
        i++
    ){

        const lat =
            i / 5;

        const y =
            cy +
            lat *
            r;

        const width =
            r *
            Math.sqrt(
                Math.max(
                    0,
                    1-lat*lat
                )
            );


        gctx.beginPath();

        gctx.ellipse(
            cx,
            y,
            width,
            r*.13,
            0,
            0,
            Math.PI*2
        );

        gctx.stroke();

    }


    /* 经线 */

    for(
        let i=-5;
        i<=5;
        i++
    ){

        const longitude =
            i / 5 * Math.PI +
            rotation;


        const visible =
            Math.cos(longitude);


        const width =
            Math.max(
                4,
                Math.abs(visible)*r
            );


        gctx.beginPath();

        gctx.ellipse(
            cx,
            cy,
            width,
            r,
            0,
            0,
            Math.PI*2
        );

        gctx.stroke();

    }


    /* 模拟大陆 */

    gctx.fillStyle =
        "rgba(50,220,170,.30)";


    const continents = [

        [-.35,-.18,.22,.16],
        [.05,-.28,.18,.13],
        [.22,.02,.25,.18],
        [-.1,.25,.17,.12],
        [.4,.25,.13,.09]

    ];


    continents.forEach(
        function(c){

            const x =
                cx + c[0]*r;

            const y =
                cy + c[1]*r;

            gctx.beginPath();

            gctx.ellipse(
                x,
                y,
                c[2]*r,
                c[3]*r,
                rotation*.2,
                0,
                Math.PI*2
            );

            gctx.fill();

        }
    );


    gctx.restore();


    /* 边缘高光 */

    const edge =
        gctx.createRadialGradient(
            cx-r*.45,
            cy-r*.45,
            r*.2,
            cx,
            cy,
            r
        );

    edge.addColorStop(
        .65,
        "rgba(0,0,0,0)"
    );

    edge.addColorStop(
        .9,
        "rgba(70,190,255,.18)"
    );

    edge.addColorStop(
        1,
        "rgba(100,220,255,.55)"
    );


    gctx.beginPath();

    gctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI*2
    );

    gctx.fillStyle =
        edge;

    gctx.fill();


    requestAnimationFrame(
        drawGlobe
    );

}

requestAnimationFrame(
    drawGlobe
);


/* =========================================================
   Supabase轮询
========================================================= */

loadMessages();

setInterval(
    loadMessages,
    5000
);

loadWeather();
