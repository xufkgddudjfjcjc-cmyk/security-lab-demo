<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Security Lab</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #f5f7fb;
    --panel: rgba(255,255,255,.82);
    --panel-solid: #ffffff;
    --text: #15171b;
    --muted: #777d87;
    --line: rgba(0,0,0,.08);
    --blue: #1677ff;
    --blue-soft: #eaf3ff;
    --green: #22c55e;
    --shadow: 0 12px 40px rgba(30,40,60,.08);
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        "Microsoft YaHei",
        sans-serif;
}

body {
    overflow: hidden;
}

/* =========================
   背景
========================= */

.background {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
}

.background::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    left: -150px;
    top: -180px;
    background: rgba(22,119,255,.08);
    filter: blur(100px);
    border-radius: 50%;
}

.background::after {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    right: -150px;
    bottom: -180px;
    background: rgba(120,80,255,.07);
    filter: blur(100px);
    border-radius: 50%;
}

/* =========================
   APP
========================= */

.app {
    position: relative;
    z-index: 1;

    width: 100vw;
    height: 100vh;

    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 270px;

    padding: 14px;

    gap: 14px;
}

/* =========================
   通用面板
========================= */

.sidebar,
.chat,
.profile {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.75);
    box-shadow: var(--shadow);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
}

/* =========================
   左侧
========================= */

.sidebar {
    border-radius: 22px;
    padding: 18px 12px;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 8px 10px 20px;
}

.brand-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background: #111827;
    color: white;

    font-size: 19px;
}

.brand-name {
    font-weight: 700;
    font-size: 16px;
}

.brand-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
}

.section-title {
    padding: 10px;
    color: #9aa0aa;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
}

.channel {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 11px 12px;
    margin: 2px 0;

    border-radius: 11px;

    color: #555b65;

    cursor: pointer;
    transition: .18s;
}

.channel:hover {
    background: #eef2f7;
}

.channel.active {
    background: var(--blue-soft);
    color: var(--blue);
    font-weight: 600;
}

.channel-icon {
    font-size: 17px;
}

.sidebar-bottom {
    margin-top: auto;
}

.mini-status {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 12px;

    color: var(--muted);
    font-size: 12px;
}

.green-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;
    background: var(--green);
}

/* =========================
   聊天主体
========================= */

.chat {
    min-width: 0;

    border-radius: 22px;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* 顶部 */

.chat-header {
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    border-bottom: 1px solid var(--line);

    background: rgba(255,255,255,.58);
}

.chat-title {
    display: flex;
    align-items: center;
    gap: 10px;
}

.hash {
    font-size: 22px;
    color: #9298a2;
}

.chat-name {
    font-size: 16px;
    font-weight: 700;
}

.chat-description {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
}

.connection {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #6f7680;
    font-size: 12px;
}

/* 消息 */

.messages {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 22px;
}

.messages::-webkit-scrollbar {
    width: 5px;
}

.messages::-webkit-scrollbar-thumb {
    background: #d6d9df;
    border-radius: 10px;
}

.message {
    display: flex;
    gap: 11px;

    margin-bottom: 20px;

    animation: messageIn .2s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.avatar {
    flex: 0 0 auto;

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(135deg,#111827,#64748b);

    color: white;

    font-weight: 700;
    font-size: 14px;
}

.message-content {
    min-width: 0;
}

.message-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
}

.message-user {
    font-weight: 700;
    font-size: 14px;
}

.message-time {
    color: #a0a5ad;
    font-size: 10px;
}

.message-text {
    margin-top: 5px;

    color: #424750;

    line-height: 1.55;

    word-break: break-word;
    white-space: pre-wrap;
}

.reactions {
    display: flex;
    gap: 5px;
    margin-top: 8px;
}

.reaction {
    border: 1px solid #e3e6eb;

    background: white;

    border-radius: 12px;

    padding: 4px 8px;

    font-size: 12px;

    cursor: pointer;

    transition: .15s;
}

.reaction:hover {
    border-color: #b9d5ff;
    background: #f2f7ff;
}

/* 输入区 */

.input-area {
    padding: 14px 18px 18px;

    border-top: 1px solid var(--line);

    background: rgba(255,255,255,.58);
}

.input-box {
    display: flex;
    align-items: center;

    gap: 8px;

    padding: 6px 7px 6px 15px;

    border: 1px solid #e1e5ea;

    border-radius: 15px;

    background: white;

    box-shadow:
        0 5px 20px rgba(0,0,0,.04);
}

.input-box:focus-within {
    border-color: #b7d4ff;

    box-shadow:
        0 0 0 4px rgba(22,119,255,.08);
}

.message-input {
    flex: 1;

    min-width: 0;

    border: 0;
    outline: 0;

    background: transparent;

    font-size: 15px;

    color: var(--text);
}

.message-input::placeholder {
    color: #a5aab2;
}

.send {
    width: 38px;
    height: 38px;

    border: 0;
    border-radius: 11px;

    background: #111827;
    color: white;

    cursor: pointer;

    transition: .18s;
}

.send:hover {
    transform: scale(1.04);
    background: #000;
}

.send:disabled {
    opacity: .45;
}

/* =========================
   右侧
========================= */

.profile {
    border-radius: 22px;

    padding: 18px;

    overflow-y: auto;
}

.profile-title {
    color: #9298a2;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .08em;

    margin: 5px 4px 14px;
}

/* 用户卡 */

.user-card {
    padding: 18px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f5f7fa
        );

    border: 1px solid #edf0f3;
}

.user-main {
    display: flex;
    align-items: center;
    gap: 11px;
}

.big-avatar {
    width: 52px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #111827,
            #64748b
        );

    color: white;

    font-size: 18px;
    font-weight: 700;
}

.user-name {
    font-weight: 700;
}

.user-online {
    display: flex;
    align-items: center;
    gap: 5px;

    margin-top: 4px;

    color: #22a35a;

    font-size: 11px;
}

.info-divider {
    height: 1px;

    background: #eceff3;

    margin: 16px 0;
}

.info-row {
    display: flex;
    align-items: center;

    gap: 9px;

    padding: 7px 0;

    color: #606771;

    font-size: 13px;
}

.info-icon {
    width: 25px;

    text-align: center;

    font-size: 16px;
}

.weather {
    margin-top: 15px;

    padding: 16px;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            #eaf4ff,
            #f7fbff
        );

    border: 1px solid #dcecff;
}

.weather-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.weather-temp {
    font-size: 31px;
    font-weight: 700;
    color: #172033;
}

.weather-icon {
    font-size: 34px;
}

.weather-city {
    margin-top: 4px;

    color: #4e596b;

    font-size: 13px;
}

.weather-detail {
    margin-top: 12px;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 8px;
}

.weather-small {
    padding: 9px;

    border-radius: 10px;

    background: rgba(255,255,255,.7);

    color: #687282;

    font-size: 11px;
}

.weather-small strong {
    display: block;

    margin-top: 3px;

    color: #303847;

    font-size: 13px;
}

.status-message {
    margin-top: 12px;

    color: #858b95;

    font-size: 11px;

    line-height: 1.5;
}

/* =========================
   Mobile
========================= */

.mobile-profile-button {
    display: none;
}

@media (max-width: 900px) {

    .app {
        grid-template-columns: 190px minmax(0,1fr);
    }

    .profile {
        display: none;
    }
}

@media (max-width: 650px) {

    body {
        overflow: auto;
    }

    .app {
        display: block;

        width: 100%;
        height: auto;

        min-height: 100vh;

        padding: 8px;
    }

    .sidebar {
        height: 58px;

        padding: 8px 10px;

        border-radius: 17px;

        margin-bottom: 8px;

        flex-direction: row;

        align-items: center;
    }

    .brand {
        padding: 0;

        margin-right: 8px;
    }

    .brand-icon {
        width: 40px;
        height: 40px;
    }

    .brand-text {
        display: none;
    }

    .section-title,
    .sidebar-bottom {
        display: none;
    }

    .channel {
        display: none;
    }

    .channel.active {
        display: flex;

        margin: 0;

        padding: 9px 12px;
    }

    .chat {
        height: calc(100vh - 74px);

        min-height: 600px;

        border-radius: 18px;
    }

    .chat-header {
        height: 62px;

        padding: 0 15px;
    }

    .messages {
        padding: 16px 13px;
    }

    .input-area {
        padding: 10px;
    }

    .chat-description {
        display: none;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="app">

    <!-- =========================
         左侧频道
    ========================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <div class="brand-text">

                <div class="brand-name">
                    Security Lab
                </div>

                <div class="brand-sub">
                    Community
                </div>

            </div>

        </div>


        <div class="section-title">
            CHANNELS
        </div>


        <div class="channel active">
            <span class="channel-icon">#</span>
            <span>总聊天室</span>
        </div>


        <div class="channel">
            <span class="channel-icon">#</span>
            <span>技术交流</span>
        </div>


        <div class="channel">
            <span class="channel-icon">#</span>
            <span>随便聊聊</span>
        </div>


        <div class="sidebar-bottom">

            <div class="mini-status">

                <span class="green-dot"></span>

                </span>

        </div>

    <!-- =========================
         聊天

            <div class="chat-title">

                </div>

                <div>

                    <div class="chat-name">

                    </div>

                    <div class="chat-description">
                        Security Lab Community
                    </div>

                </div>

            </div>


            <div class="connection">

                <span class="green-dot"></span>

                在线

            </div>

        </header>


        <section
            id="messages"
            class="messages"
        >

            <div style="
                text-align:center;
                color:#9aa0aa;

            ">
                正在加载聊天...
            </div>

        </section>

                >

<script>

/* =====================================================
   Supabase
   不修改你的 Supabase 配置
===================================================== */

const SUPABASE_URL =
    "https://inducpwbmyjhnnjkqyxq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aukve7aK4EQCniOtCSy8uQ_raK8MH0j";

let supabaseClient = null;

try {

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

} catch (error) {

    console.error(error);

}


/* =====================================================
   昵称
===================================================== */

let nickname =
    localStorage.getItem(
        "security_lab_nickname"
    ) || "游客";


function updateProfile() {

    const name =
        nickname || "游客";

    document
        .getElementById("profileName")
        .textContent = name;


    document
        .getElementById("bigAvatar")
        .textContent =
        name.charAt(0).toUpperCase();

}


updateProfile();


/* =====================================================
   聊天
   使用你现在已有的 messages 表
   username / message / created_at
===================================================== */

async function loadMessages() {

    if (!supabaseClient) {

        showChatError(
            "Supabase 初始化失败"
        );

        return;

    }


    try {

        const result =
            await supabaseClient
                .from("messages")
                .select(
                    "id,username,message,created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                )
                .limit(100);


        if (result.error) {

            console.error(
                result.error
            );

            showChatError(
                result.error.message
            );

            return;

        }


        renderMessages(
            result.data || []
        );


    } catch (error) {

        console.error(error);

        showChatError(
            "暂时无法连接聊天服务器"
        );

    }

}


/* 显示错误 */

function showChatError(
    message
) {

    document
        .getElementById("messages")
        .innerHTML = `

            <div style="
                text-align:center;
                color:#9aa0aa;
                padding:40px 20px;
            ">

                <div style="
                    font-size:30px;
                    margin-bottom:10px;
                ">
                    ☁️
                </div>

                ${escapeHTML(message)}

            </div>
        `;

}


/* =====================================================
   显示消息
===================================================== */

function renderMessages(
    list
) {

    const box =
        document.getElementById(
            "messages"
        );


    if (!list.length) {

        box.innerHTML = `

            <div style="
                text-align:center;
                color:#9aa0aa;
                padding:50px 20px;
            ">

                还没有消息

                <br>

                <span style="
                    font-size:12px;
                ">
                    发送第一条消息吧
                </span>

            </div>
        `;

        return;

    }


    box.innerHTML = "";


    list.forEach(
        function(item) {

            const username =
                item.username ||
                "匿名";

            const text =
                item.message ||
                "";

            const avatar =
                username
                    .charAt(0)
                    .toUpperCase();


            const message =
                document.createElement(
                    "div"
                );

            message.className =
                "message";


            message.innerHTML = `

                <div class="avatar">
                    ${escapeHTML(avatar)}
                </div>

                <div class="message-content">

                    <div class="message-top">

                        <span class="message-user">
                            ${escapeHTML(username)}
                        </span>

                        <span class="message-time">
                            ${formatTime(
                                item.created_at
                            )}
                        </span>

                    </div>

                    <div class="message-text">
                        ${escapeHTML(text)}
                    </div>

                    <div class="reactions">

                        <button
                            class="reaction"
                            onclick="fakeReaction(this)"
                        >
                            ❤️ 0
                        </button>

                        <button
                            class="reaction"
                            onclick="fakeReaction(this)"
                        >
                            👍 0
                        </button>

                        <button
                            class="reaction"
                            onclick="fakeReaction(this)"
                        >
                            😂 0
                        </button>

                    </div>

                </div>
            `;


            box.appendChild(
                message
            );

        }
    );


    box.scrollTop =
        box.scrollHeight;

}


/* =====================================================
   表情演示
   第一步只做 UI，不修改 Supabase
===================================================== */

function fakeReaction(
    button
) {

    const match =
        button.textContent.match(
            /(\d+)$/
        );


    if (!match) {
        return;
    }


    const number =
        Number(match[1]) + 1;


    button.textContent =
        button.textContent.replace(
            /\d+$/,
            number
        );

}


/* =====================================================
   发送消息
===================================================== */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    if (!nickname) {

        nickname = "游客";

    }


    button.disabled =
        true;


    try {

        const result =
            await supabaseClient
                .from("messages")
                .insert([
                    {
                        username:
                            nickname,

                        message:
                            text
                    }
                ]);


        if (result.error) {

            console.error(
                result.error
            );

            alert(
                "发送失败：\n" +
                result.error.message
            );

            return;

        }


        input.value = "";


        await loadMessages();


    } catch (error) {

        console.error(error);

        alert(
            "发送失败，请稍后再试"
        );

    } finally {

        button.disabled =
            false;

    }

}


/* =====================================================
   回车发送
===================================================== */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


document
    .getElementById(
        "sendButton"
    )
    .addEventListener(
        "click",
        sendMessage
    );


/* =====================================================
   时间
===================================================== */

function formatTime(
    value
) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        "zh-CN",
        {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   IP → 城市 → 天气
   不把 IP 保存到 Supabase
===================================================== */

async function loadWeather() {

    const status =
        document.getElementById(
            "weatherStatus"
        );


    try {

        /*
         * 只用于获取大概城市。
         * 不保存 IP。
         */

        const ipResponse =
            await fetch(
                "https://ipwho.is/"
            );


        if (!ipResponse.ok) {

            throw new Error(
                "IP 定位失败"
            );

        }


        const ipData =
            await ipResponse.json();


        if (!ipData.success) {

            throw new Error(
                "无法获取位置"
            );

        }


        const city =
            ipData.city ||
            "未知城市";

        const country =
            ipData.country ||
            "";


        const latitude =
            ipData.latitude;

        const longitude =
            ipData.longitude;


        document
            .getElementById(
                "location"
            )
            .textContent =
            city;


        document
            .getElementById(
                "weatherCity"
            )
            .textContent =
            city +
            (
                country
                    ? " · " + country
                    : ""
            );


        if (
            latitude == null ||
            longitude == null
        ) {

            throw new Error(
                "无法获取坐标"
            );

        }


        /*
         * Open-Meteo
         * 不需要 API Key
         */

        const weatherURL =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" +
            encodeURIComponent(
                latitude
            ) +
            "&longitude=" +
            encodeURIComponent(
                longitude
            ) +
            "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code" +
            "&timezone=auto";


        const weatherResponse =
            await fetch(
                weatherURL
            );


        if (!weatherResponse.ok) {

            throw new Error(
                "天气服务连接失败"
            );

        }


        const weather =
            await weatherResponse.json();


        const current =
            weather.current;


        const temperature =
            Math.round(
                current.temperature_2m
            );


        const humidity =
            current.relative_humidity_2m;


        const wind =
            Math.round(
                current.wind_speed_10m
            );


        const weatherInfo =
            getWeatherInfo(
                current.weather_code
            );


        document
            .getElementById(
                "temperature"
            )
            .textContent =
            temperature +
            "°";


        document
            .getElementById(
                "humidity"
            )
            .textContent =
            humidity +
            "%";


        document
            .getElementById(
                "wind"
            )
            .textContent =
            wind +
            " km/h";


        document
            .getElementById(
                "weatherIcon"
            )
            .textContent =
            weatherInfo.icon;


        status.textContent =
            weatherInfo.text;


    } catch (error) {

        console.error(
            "天气:",
            error
        );


        status.textContent =
            "天气暂时无法获取";

    }

}


/* =====================================================
   天气代码
===================================================== */

function getWeatherInfo(
    code
) {

    if (code === 0) {

        return {
            icon: "☀️",
            text: "晴朗"
        };

    }


    if (
        code === 1 ||
        code === 2
    ) {

        return {
            icon: "🌤️",
            text: "晴间多云"
        };

    }


    if (code === 3) {

        return {
            icon: "☁️",
            text: "多云"
        };

    }


    if (
        code >= 45 &&
        code <= 48
    ) {

        return {
            icon: "🌫️",
            text: "雾"
        };

    }


    if (
        code >= 51 &&
        code <= 67
    ) {

        return {
            icon: "🌧️",
            text: "小雨"
        };

    }


    if (
        code >= 71 &&
        code <= 77
    ) {

        return {
            icon: "❄️",
            text: "降雪"
        };

    }


    if (
        code >= 80 &&
        code <= 82
    ) {

        return {
            icon: "🌦️",
            text: "阵雨"
        };

    }


    if (
        code >= 95
    ) {

        return {
            icon: "⛈️",
            text: "雷暴"
        };

    }


    return {
        icon: "🌤️",
        text: "天气未知"
    };

}

/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

loadMessages();

loadWeather();
