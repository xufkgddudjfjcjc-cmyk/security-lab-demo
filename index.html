<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<meta name="theme-color" content="#020711">

<title>Security Lab</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   基础
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #020711;

    --glass: rgba(5, 14, 30, .56);
    --glass-strong: rgba(4, 12, 27, .78);

    --border: rgba(120, 180, 255, .20);
    --border-light: rgba(160, 210, 255, .34);

    --text: #f4f8ff;
    --muted: #8b9bb5;

    --blue: #45a8ff;
    --cyan: #45e8ff;
    --purple: #8c5cff;

    --green: #35e58a;

    --shadow:
        0 25px 80px rgba(0,0,0,.45);

    --glow:
        0 0 35px rgba(50,150,255,.12);
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        "Microsoft YaHei",
        sans-serif;
}

body {
    overflow: hidden;
}


/* =========================================================
   动态宇宙背景
========================================================= */

.space {
    position: fixed;

    inset: 0;

    z-index: 0;

    overflow: hidden;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(40,100,255,.13),
            transparent 40%
        ),
        #020711;
}


/* 星星 */

.stars,
.stars::before,
.stars::after {
    position: absolute;

    inset: -50%;

    content: "";

    background-image:
        radial-gradient(
            1px 1px at 10% 20%,
            rgba(255,255,255,.9),
            transparent
        ),
        radial-gradient(
            1px 1px at 30% 70%,
            rgba(120,210,255,.9),
            transparent
        ),
        radial-gradient(
            1px 1px at 70% 30%,
            rgba(255,255,255,.8),
            transparent
        ),
        radial-gradient(
            1px 1px at 85% 80%,
            rgba(130,170,255,.8),
            transparent
        ),
        radial-gradient(
            2px 2px at 55% 55%,
            rgba(255,255,255,.75),
            transparent
        );

    background-size:
        240px 240px,
        310px 310px,
        420px 420px,
        360px 360px,
        520px 520px;
}

.stars {
    animation: starsMove 70s linear infinite;
}

.stars::before {
    opacity: .45;

    transform: scale(1.5);

    animation: starsMoveReverse 100s linear infinite;
}

.stars::after {
    opacity: .3;

    transform: scale(2);

    animation: starsMove 130s linear infinite;
}

@keyframes starsMove {

    from {
        transform: translate3d(0,0,0);
    }

    to {
        transform: translate3d(120px,80px,0);
    }

}

@keyframes starsMoveReverse {

    from {
        transform: translate3d(0,0,0);
    }

    to {
        transform: translate3d(-100px,-60px,0);
    }

}


/* =========================================================
   地球
========================================================= */

.earth-wrap {

    position: absolute;

    width: min(850px, 90vw);
    height: min(850px, 90vw);

    left: 50%;
    top: 54%;

    transform:
        translate(-50%, -50%);

    opacity: .92;

    filter:
        drop-shadow(
            0 0 50px
            rgba(45,150,255,.28)
        );

    animation:
        earthFloat 10s ease-in-out infinite;
}

@keyframes earthFloat {

    0%,
    100% {
        margin-top: 0;
    }

    50% {
        margin-top: -12px;
    }

}

.earth {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 34% 28%,
            rgba(120,210,255,.35),
            transparent 20%
        ),
        radial-gradient(
            circle at 65% 55%,
            #0d4f88 0%,
            #06315e 34%,
            #020e24 70%
        );

    box-shadow:

        inset -55px -35px 90px
        rgba(0,0,0,.8),

        inset 35px 20px 65px
        rgba(80,180,255,.24),

        0 0 80px
        rgba(50,160,255,.25);
}


/* 地球大陆纹理 */

.earth::before {

    content: "";

    position: absolute;

    inset: -10%;

    background:

        radial-gradient(
            ellipse at 35% 38%,
            rgba(42,140,94,.9) 0 8%,
            transparent 9%
        ),

        radial-gradient(
            ellipse at 55% 31%,
            rgba(44,150,99,.85) 0 7%,
            transparent 8%
        ),

        radial-gradient(
            ellipse at 66% 50%,
            rgba(48,157,105,.8) 0 8%,
            transparent 9%
        ),

        radial-gradient(
            ellipse at 40% 68%,
            rgba(34,128,90,.7) 0 7%,
            transparent 8%
        ),

        radial-gradient(
            ellipse at 76% 68%,
            rgba(45,130,90,.65) 0 5%,
            transparent 6%
        );

    filter: blur(4px);

    animation:
        continentMove 35s linear infinite;

    transform: scale(1.05);
}

@keyframes continentMove {

    from {
        transform:
            translateX(-2%)
            scale(1.05);
    }

    50% {
        transform:
            translateX(2%)
            scale(1.06);
    }

    to {
        transform:
            translateX(-2%)
            scale(1.05);
    }

}


/* 云层 */

.clouds {

    position: absolute;

    inset: -5%;

    border-radius: 50%;

    background:

        repeating-linear-gradient(
            160deg,
            transparent 0 7%,
            rgba(255,255,255,.09) 8%,
            transparent 11% 17%
        );

    filter: blur(7px);

    opacity: .55;

    animation:
        cloudsMove 45s linear infinite;
}

@keyframes cloudsMove {

    from {
        transform:
            rotate(-8deg)
            translateX(-5%);
    }

    to {
        transform:
            rotate(-8deg)
            translateX(5%);
    }

}


/* 地球高光 */

.earth-glow {

    position: absolute;

    inset: -7%;

    border-radius: 50%;

    border:

        2px solid
        rgba(75,185,255,.38);

    box-shadow:

        0 0 45px
        rgba(45,155,255,.35),

        inset 0 0 40px
        rgba(65,190,255,.14);
}


/* =========================================================
   光晕
========================================================= */

.orb {

    position: absolute;

    border-radius: 50%;

    filter: blur(1px);

    opacity: .5;

    animation:
        orbFloat 9s ease-in-out infinite;
}

.orb.one {

    width: 250px;
    height: 250px;

    left: 3%;
    top: 12%;

    background:
        radial-gradient(
            circle,
            rgba(40,160,255,.20),
            transparent 70%
        );
}

.orb.two {

    width: 320px;
    height: 320px;

    right: 0;
    bottom: 0;

    background:
        radial-gradient(
            circle,
            rgba(135,70,255,.20),
            transparent 70%
        );

    animation-delay: -3s;
}

.orb.three {

    width: 180px;
    height: 180px;

    right: 22%;
    top: 12%;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,.13),
            transparent 70%
        );

    animation-delay: -6s;
}

@keyframes orbFloat {

    0%,
    100% {
        transform:
            translate3d(0,0,0);
    }

    50% {
        transform:
            translate3d(20px,-25px,0);
    }

}


/* =========================================================
   APP
========================================================= */

.app {

    position: relative;

    z-index: 2;

    width: 100vw;
    height: 100vh;

    display: grid;

    grid-template-columns:
        220px
        minmax(0,1fr)
        280px;

    gap: 14px;

    padding: 14px;
}


/* =========================================================
   Glass
========================================================= */

.glass {

    background:
        linear-gradient(
            135deg,
            rgba(15,35,65,.64),
            rgba(2,12,28,.52)
        );

    border:

        1px solid
        var(--border);

    box-shadow:
        var(--shadow),
        var(--glow);

    backdrop-filter:
        blur(25px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(150%);
}


/* =========================================================
   左侧
========================================================= */

.sidebar {

    border-radius: 24px;

    padding: 18px 12px;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}

.brand {

    display: flex;

    align-items: center;

    gap: 11px;

    padding:
        6px 8px 22px;
}

.brand-icon {

    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 14px;

    font-size: 21px;

    background:
        linear-gradient(
            135deg,
            #3d7cff,
            #8a45ff
        );

    box-shadow:
        0 0 25px
        rgba(80,130,255,.35);
}

.brand-name {

    font-weight: 800;

    font-size: 16px;
}

.brand-sub {

    color: var(--muted);

    font-size: 11px;

    margin-top: 3px;
}

.section-title {

    color: #70819d;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .12em;

    padding:
        8px 10px;
}

.channel {

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        11px 12px;

    margin:
        2px 0;

    border-radius: 13px;

    color: #9aa9bf;

    cursor: pointer;

    transition: .2s;
}

.channel:hover {

    background:
        rgba(80,150,255,.09);

    color: white;
}

.channel.active {

    color: white;

    background:
        linear-gradient(
            100deg,
            rgba(50,120,255,.30),
            rgba(110,70,255,.20)
        );

    border:
        1px solid
        rgba(90,160,255,.25);

    box-shadow:
        0 0 25px
        rgba(50,120,255,.10);
}

.channel-icon {

    font-size: 17px;

    color: #6e8fc5;
}

.sidebar-bottom {

    margin-top: auto;

    padding-top: 15px;

    border-top:
        1px solid
        rgba(255,255,255,.06);
}

.connection-box {

    padding: 12px;

    border-radius: 14px;

    background:
        rgba(0,0,0,.16);

    border:
        1px solid
        rgba(255,255,255,.06);
}

.connection-row {

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 11px;

    color: #9baac0;
}

.green-dot {

    width: 8px;
    height: 8px;

    flex: 0 0 auto;

    border-radius: 50%;

    background:
        var(--green);

    box-shadow:
        0 0 12px
        rgba(53,229,138,.8);

    animation:
        onlinePulse 2s infinite;
}

@keyframes onlinePulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: .45;
    }

}


/* =========================================================
   聊天
========================================================= */

.chat {

    min-width: 0;

    border-radius: 24px;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}

.chat-header {

    height: 72px;

    flex: 0 0 auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 22px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(5,15,30,.32);
}

.chat-title {

    display: flex;

    align-items: center;

    gap: 11px;
}

.hash {

    font-size: 25px;

    color: #7694c5;
}

.chat-name {

    font-weight: 800;

    font-size: 17px;
}

.chat-description {

    color: #71829d;

    font-size: 11px;

    margin-top: 2px;
}

.connection {

    display: flex;

    align-items: center;

    gap: 7px;

    color: #9aacc5;

    font-size: 12px;
}


/* =========================================================
   消息
========================================================= */

.messages {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding:
        22px;
}

.messages::-webkit-scrollbar {

    width: 5px;
}

.messages::-webkit-scrollbar-thumb {

    background:
        rgba(100,160,230,.25);

    border-radius: 10px;
}

.message {

    display: flex;

    gap: 11px;

    margin-bottom: 21px;

    animation:
        messageIn .25s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform:
            translateY(7px)
            scale(.99);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}

.avatar {

    width: 40px;
    height: 40px;

    flex: 0 0 auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #287cff,
            #743dff
        );

    border:
        1px solid
        rgba(130,200,255,.35);

    color: white;

    font-weight: 800;

    box-shadow:
        0 0 20px
        rgba(70,130,255,.18);
}

.message-content {

    min-width: 0;
}

.message-top {

    display: flex;

    align-items: baseline;

    gap: 8px;
}

.message-user {

    font-weight: 700;

    font-size: 14px;
}

.message-time {

    color: #647591;

    font-size: 10px;
}

.message-text {

    margin-top: 5px;

    color: #d5dfef;

    line-height: 1.55;

    word-break: break-word;

    white-space: pre-wrap;
}

.reactions {

    display: flex;

    gap: 5px;

    flex-wrap: wrap;

    margin-top: 8px;
}

.reaction {

    border:
        1px solid
        rgba(130,180,240,.15);

    background:
        rgba(20,45,75,.50);

    color: #c6d5ea;

    border-radius: 13px;

    padding:
        5px 9px;

    font-size: 12px;

    cursor: pointer;

    transition: .16s;
}

.reaction:hover {

    transform:
        translateY(-1px);

    background:
        rgba(55,110,200,.25);

    border-color:
        rgba(100,180,255,.35);
}


/* =========================================================
   正在输入
========================================================= */

.typing {

    height: 25px;

    padding:
        0 22px;

    color: #7186a5;

    font-size: 11px;
}

.typing span {

    display: inline-block;

    width: 4px;
    height: 4px;

    margin-left: 3px;

    border-radius: 50%;

    background: #63baff;

    animation:
        typingDot 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typingDot {

    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: .35;
    }

    30% {
        transform: translateY(-4px);
        opacity: 1;
    }

}


/* =========================================================
   输入
========================================================= */

.input-area {

    padding:
        10px 17px 17px;

    background:
        rgba(2,10,23,.28);
}

.input-box {

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        6px 7px 6px 15px;

    border:
        1px solid
        rgba(130,180,240,.20);

    border-radius: 17px;

    background:
        rgba(10,25,48,.62);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.05);
}

.input-box:focus-within {

    border-color:
        rgba(80,170,255,.55);

    box-shadow:
        0 0 0 4px
        rgba(45,140,255,.08),

        0 0 30px
        rgba(45,140,255,.10);
}

.message-input {

    flex: 1;

    min-width: 0;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    font-size: 15px;
}

.message-input::placeholder {

    color: #647691;
}

.send {

    width: 40px;
    height: 40px;

    border: 0;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #277cff,
            #694cff
        );

    color: white;

    font-size: 18px;

    cursor: pointer;

    box-shadow:
        0 0 22px
        rgba(60,120,255,.25);

    transition: .18s;
}

.send:hover {

    transform:
        scale(1.05);
}

.send:disabled {

    opacity: .4;

    transform: none;
}


/* =========================================================
   右侧
========================================================= */

.profile {

    border-radius: 24px;

    padding: 17px;

    overflow-y: auto;
}

.profile-title {

    color: #6f819f;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .13em;

    margin:
        5px 5px 12px;
}

.user-card {

    padding: 17px;

    border-radius: 19px;

    background:
        rgba(10,28,52,.50);

    border:
        1px solid
        rgba(120,180,255,.16);
}

.user-main {

    display: flex;

    align-items: center;

    gap: 11px;
}

.big-avatar {

    width: 52px;
    height: 52px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            #267cff,
            #8b45ff
        );

    color: white;

    font-size: 19px;

    font-weight: 800;

    box-shadow:
        0 0 25px
        rgba(90,100,255,.28);
}

.user-name {

    font-weight: 800;
}

.user-online {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 4px;

    color: #5fe49a;

    font-size: 11px;
}

.info-divider {

    height: 1px;

    background:
        rgba(255,255,255,.07);

    margin:
        15px 0;
}

.info-row {

    display: flex;

    align-items: center;

    gap: 9px;

    padding:
        7px 0;

    color: #9aacbf;

    font-size: 12px;
}

.info-icon {

    width: 24px;

    text-align: center;

    font-size: 15px;
}


/* =========================================================
   天气
========================================================= */

.weather {

    padding: 17px;

    border-radius: 19px;

    background:
        linear-gradient(
            145deg,
            rgba(20,90,160,.30),
            rgba(65,45,150,.20)
        );

    border:
        1px solid
        rgba(100,180,255,.18);

    overflow: hidden;

    position: relative;
}

.weather::after {

    content: "";

    position: absolute;

    width: 130px;
    height: 130px;

    right: -60px;
    top: -60px;

    border-radius: 50%;

    background:
        rgba(70,180,255,.16);

    filter: blur(20px);
}

.weather-top {

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.weather-temp {

    font-size: 32px;

    font-weight: 800;
}

.weather-icon {

    font-size: 35px;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,255,255,.15)
        );
}

.weather-city {

    margin-top: 3px;

    color: #91a5c0;

    font-size: 12px;
}

.weather-detail {

    margin-top: 13px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}

.weather-small {

    padding: 9px;

    border-radius: 11px;

    background:
        rgba(0,0,0,.16);

    color: #7e93ae;

    font-size: 10px;
}

.weather-small strong {

    display: block;

    margin-top: 4px;

    color: #d9e8fb;

    font-size: 13px;
}

.status-message {

    margin-top: 12px;

    color: #8094af;

    font-size: 10px;

    line-height: 1.5;
}


/* =========================================================
   通知
========================================================= */

.toast {

    position: fixed;

    z-index: 100;

    right: 18px;
    bottom: 18px;

    width: min(330px, calc(100vw - 36px));

    padding: 14px 16px;

    border-radius: 16px;

    background:
        rgba(5,16,32,.88);

    border:
        1px solid
        rgba(100,180,255,.28);

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.45);

    color: white;

    transform:
        translateY(20px);

    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

.toast.show {

    transform:
        translateY(0);

    opacity: 1;
}


/* =========================================================
   Mobile
========================================================= */

@media (max-width: 900px) {

    .app {

        grid-template-columns:
            180px
            minmax(0,1fr);
    }

    .profile {

        display: none;
    }

}


@media (max-width: 650px) {

    body {

        overflow: hidden;
    }

    .app {

        display: block;

        width: 100%;

        height: 100vh;

        padding: 7px;
    }

    .sidebar {

        position: fixed;

        z-index: 20;

        left: 7px;
        right: 7px;
        top: 7px;

        height: 56px;

        padding:
            7px 9px;

        border-radius: 17px;

        flex-direction: row;

        align-items: center;
    }

    .brand {

        padding: 0;

        margin-right: 6px;
    }

    .brand-icon {

        width: 40px;
        height: 40px;
    }

    .brand-text {

        display: none;
    }

    .section-title,
    .sidebar-bottom {

        display: none;
    }

    .channel {

        display: none;
    }

    .channel.active {

        display: flex;

        margin: 0;

        padding:
            8px 12px;
    }

    .chat {

        height:
            calc(100vh - 14px);

        min-height: 0;

        margin-top: 0;

        border-radius: 18px;
    }

    .chat-header {

        height: 68px;

        padding:
            0 14px;

        padding-top: 50px;

        height: 118px;

        align-items: flex-start;
    }

    .chat-title {

        padding-top: 3px;
    }

<script>

/* =========================================================
   Supabase 配置
========================================================= */

const SUPABASE_URL =
    "https://inducpwbmyjhnnjkqyxq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aukve7aK4EQCniOtCSy8uQ_raK8MH0j";


let supabaseClient = null;

let realtimeChannel = null;

let messagesCache = [];

let lastMessageId = null;


/* =========================================================
   初始化 Supabase
========================================================= */

try {

    if (
        window.supabase &&
        typeof window.supabase.createClient === "function"
    ) {

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        setConnection(
            "数据库已连接",
            true
        );

    } else {

        throw new Error(
            "Supabase SDK 加载失败"
        );

    }

} catch (error) {

    setConnection(
        "数据库连接失败",

    );

}


/* =========================================================
   连接状态
========================================================= */

function setConnection(
    text,
    online
) {

    const element =
        document.getElementById(
            "connectionText"
        );

    if (element) {

        element.textContent =
            text;

    }

}


/* =========================================================
   昵称
========================================================= */

let nickname =
    localStorage.getItem(
        "security_lab_nickname"
    );


if (!nickname) {

    nickname = "游客";

}


function updateProfile() {

    const name =
        nickname || "游客";

    document

        name
            .charAt(0)
            .toUpperCase();

}


updateProfile();


/* =========================================================
   加载消息
========================================================= */

async function loadMessages() {

    if (!supabaseClient) {

        showChatError(
            "Supabase 暂时无法连接"
        );

        return;

    }


    try {

        const result =
            await supabaseClient
                .from("messages")
                .select(
                    "id,username,message,created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                )
                .limit(100);


        if (result.error) {

            console.error(
                "Supabase:",
                result.error
            );

            showChatError(
                result.error.message
            );

            setConnection(
                "数据库连接异常",
                false
            );

            return;

        }


        setConnection(
            "数据库在线",
            true
        );


        const list =
            result.data || [];


        messagesCache =
            list;


        if (list.length) {

            lastMessageId =
                list[list.length - 1].id;

        }


        renderMessages(list);


    } catch (error) {

        console.error(error);

        showChatError(
            "网络连接失败"
        );

        setConnection(
            "网络异常",
            false
        );

    }

}


/* =========================================================
   错误
========================================================= */

function showChatError(
    text
) {

    document
        .getElementById("messages")
        .innerHTML = `

            <div style="
                text-align:center;
                color:#7187a5;
                padding:55px 20px;
            ">

                <div style="
                    font-size:32px;
                    margin-bottom:12px;
                ">

                <div>

                </div>

                <div style="
                    margin-top:8px;
                    font-size:10px;
                    color:#526580;
                ">
                    页面本身正常，聊天服务器暂时不可用
                </div>

            </div>

        `;

}


/* =========================================================
   显示消息
========================================================= */

function renderMessages(
    list
) {

    const box =
        document.getElementById(
            "messages"
        );


    if (!list.length) {

        box.innerHTML = `

            <div style="
                text-align:center;
                color:#7187a5;
                padding:55px 20px;
            ">

                <div style="
                    font-size:30px;
                    margin-bottom:10px;
                ">
                    🌍
                </div>

                还没有消息

                <br>

                <span style="
                    font-size:11px;
                ">
                    发送第一条消息吧
                </span>

            </div>

        `;

        return;

    }


    box.innerHTML = "";


    list.forEach(
        item => {

            const username =
                item.username ||
                "匿名";

            const text =
                item.message ||
                "";


            const avatar =
                username
                    .charAt(0)
                    .toUpperCase();


            const message =
                document.createElement(
                    "div"
                );


            message.className =
                "message";


            message.innerHTML = `

                <div class="avatar">
                    ${escapeHTML(avatar)}
                </div>


                <div class="message-content">

                    <div class="message-top">

                        <span class="message-user">
                            ${escapeHTML(username)}
                        </span>

                        <span class="message-time">
                            ${formatTime(
                                item.created_at
                            )}
                        </span>

                    </div>


                    <div class="message-text">
                        ${escapeHTML(text)}
                    </div>


                    <div class="reactions">

                        <button
                            class="reaction"
                            data-count="0"
                        >
                            ❤️ 0
                        </button>

                        <button
                            class="reaction"
                            data-count="0"
                        >
                            👍 0
                        </button>

                        <button
                            class="reaction"
                            data-count="0"
                        >
                            😂 0
                        </button>

                        <button
                            class="reaction"
                            data-count="0"
                        >
                            😮 0
                        </button>

                    </div>

                </div>

            `;


            message
                .querySelectorAll(
                    ".reaction"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                let count =
                                    Number(
                                        button.dataset.count
                                    );

                                count++;

                                button.dataset.count =
                                    count;

                                button.textContent =
                                    button.textContent
                                        .replace(
                                            /\d+$/,
                                            count
                                        );

                            }
                        );

                    }
                );


            box.appendChild(
                message
            );

        }
    );


    box.scrollTop =
        box.scrollHeight;

}


/* =========================================================
   发送
========================================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    if (!supabaseClient) {

        showToast(
            "数据库暂时无法连接"
        );

        return;

    }


    button.disabled =
        true;


    try {

        /*
         * 保持原来的数据库字段：
         *
         * username
         * message
         *
         * 不修改数据库。
         */

        const result =
            await supabaseClient
                .from("messages")
                .insert({

                    username:
                        nickname,

                    message:
                        text

                });


        if (result.error) {

            console.error(
                result.error
            );

            showToast(
                "发送失败：" +
                result.error.message
            );

            return;

        }


        input.value = "";


        hideTyping();


        await loadMessages();


    } catch (error) {

        console.error(error);

        showToast(
            "发送失败：网络连接异常"
        );

    } finally {

        button.disabled =
            false;

        input.focus();

    }

}


/* =========================================================
   输入框
========================================================= */

const messageInput =
    document.getElementById(
        "messageInput"
    );


messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


messageInput.addEventListener(
    "input",
    () => {

        showTyping();

    }
);


/* =========================================================
   正在输入
========================================================= */

let typingTimer = null;


function showTyping() {

    const typing =
        document.getElementById(
            "typing"
        );


    typing.innerHTML = `

        你正在输入

        <span></span>
        <span></span>
        <span></span>

    `;


    clearTimeout(
        typingTimer
    );


    typingTimer =
        setTimeout(
            hideTyping,
            1200
        );

}


function hideTyping() {

    document
        .getElementById(
            "typing"
        )
        .innerHTML = "";

}


/* =========================================================
   Realtime
========================================================= */

function startRealtime() {

    if (!supabaseClient) {

        return;

    }


    try {

        realtimeChannel =
            supabaseClient
                .channel(
                    "security-lab-messages"
                )
                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "messages"
                    },
                    payload => {

                        const newMessage =
                            payload.new;


                        if (
                            !newMessage
                        ) {

                            return;

                        }


                        const alreadyExists =
                            messagesCache.some(
                                item =>
                                    String(item.id) ===
                                    String(newMessage.id)
                            );


                        if (
                            !alreadyExists
                        ) {

                            messagesCache.push(
                                newMessage
                            );


                            if (
                                messagesCache.length >
                                100
                            ) {

                                messagesCache.shift();

                            }


                            renderMessages(
                                messagesCache
                            );


                            /*
                             * 如果是别人发的消息，
                             * 给出通知。
                             */

                            if (
                                newMessage.username !==
                                nickname
                            ) {

                                showToast(
                                    "💬 " +
                                    (
                                        newMessage.username ||
                                        "有人"
                                    ) +
                                    "： " +
                                    (
                                        newMessage.message ||
                                        ""
                                    )
                                );

                                browserNotification(
                                    newMessage
                                );

                            }

                        }

                    }
                )
                .subscribe(
                    status => {

                        console.log(
                            "Realtime:",
                            status
                        );

                    }
                );

    } catch (error) {

        console.error(
            "Realtime:",
            error
        );

    }

}


/* =========================================================
   浏览器通知
========================================================= */

async function requestNotificationPermission() {

    if (
        !("Notification" in window)
    ) {

        return;

    }


    if (
        Notification.permission ===
        "default"
    ) {

        try {

            await Notification.requestPermission();

        } catch (error) {

            console.log(error);

        }

    }

}


function browserNotification(
    message
) {

    if (
        !("Notification" in window)
    ) {

        return;

    }


    if (
        Notification.permission !==
        "granted"
    ) {

        return;

    }


    try {

        new Notification(
            "Security Lab",
            {
                body:
                    (
                        message.username ||
                        "有人"
                    ) +
                    "：" +
                    (
                        message.message ||
                        ""
                    )
            }
        );

    } catch (error) {

        console.log(error);

    }

}

let toastTimer = null;

) {

/* =========================================================
   时间
========================================================= */

function formatTime(
    value
) {

    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        "zh-CN",
        {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function updateTime() {

    document
        .getElementById(
            "localTime"
        )
        .textContent =
        new Date()
            .toLocaleTimeString(
                "zh-CN",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

}


updateTime();

setInterval(

    1000
);


/* =========================================================
   IP → 城市 → 天气
========================================================= */

async function loadWeather() {

    const status =
        document.getElementById(
            "weatherStatus"
        );


    try {

        const response =
            await fetch(
                "https://ipwho.is/",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "IP 服务不可用"
            );

        }


        const ipData =
            await response.json();


        if (!ipData.success) {

            throw new Error(
                "IP 定位失败"
            );

        }


        const city =
            ipData.city ||
            "未知城市";


        const country =
            ipData.country ||
            "";


        const latitude =
            ipData.latitude;


        const longitude =
            ipData.longitude;


        document
            .getElementById(
                "location"
            )
            .textContent =
            city;


        document
            .getElementById(
                "weatherCity"
            )
            .textContent =
            city +
            (
                country
                    ? " · " + country
                    : ""
            );


        if (
            latitude == null ||
            longitude == null
        ) {

            throw new Error(
                "没有坐标"
            );

        }


        const weatherURL =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" +
            encodeURIComponent(
                latitude
            ) +
            "&longitude=" +
            encodeURIComponent(
                longitude
            ) +
            "&current=" +
            "temperature_2m," +
            "relative_humidity_2m," +
            "wind_speed_10m," +
            "weather_code" +
            "&timezone=auto";


        const weatherResponse =
            await fetch(
                weatherURL,
                {
                    cache: "no-store"
                }
            );


        if (!weatherResponse.ok) {

            throw new Error(
                "天气服务失败"
            );

        }


        const weather =
            await weatherResponse.json();


        const current =
            weather.current;


        const temperature =
            Math.round(
                current.temperature_2m
            );


        const humidity =
            current.relative_humidity_2m;


        const wind =
            Math.round(
                current.wind_speed_10m
            );


        const info =
            getWeatherInfo(
                current.weather_code
            );


        document
            .getElementById(
                "temperature"
            )
            .textContent =
            temperature + "°";


        document
            .getElementById(
                "humidity"
            )
            .textContent =
            humidity + "%";


        document
            .getElementById(
                "wind"
            )
            .textContent =
            wind + " km/h";


        document
            .getElementById(
                "weatherIcon"
            )
            .textContent =
            info.icon;


        status.textContent =
            info.text;


    } catch (error) {

        console.error(
            "Weather:",
            error
        );


        status.textContent =
            "天气暂时无法获取";

    }

}


/* =========================================================
   天气代码
========================================================= */

function getWeatherInfo(
    code
) {

    if (code === 0) {

        return {
            icon: "☀️",
            text: "晴朗"
        };

    }


    if (
        code === 1 ||
        code === 2
    ) {

        return {
            icon: "🌤️",
            text: "晴间多云"
        };

    }


    if (code === 3) {

        return {
            icon: "☁️",
            text: "多云"
        };

    }


    if (
        code >= 45 &&
        code <= 48
    ) {

        return {
            icon: "🌫️",
            text: "有雾"
        };

    }


    if (
        code >= 51 &&
        code <= 67
    ) {

        return {
            icon: "🌧️",
            text: "降雨"
        };

    }


    if (
        code >= 71 &&
        code <= 77
    ) {

        return {
            icon: "❄️",
            text: "降雪"
        };

    }


    if (
        code >= 80 &&
        code <= 82
    ) {

        return {
            icon: "🌦️",
            text: "阵雨"
        };

    }


    if (
        code >= 95
    ) {

        return {
            icon: "⛈️",
            text: "雷暴"
        };

    }


    return {
        icon: "🌤️",
        text: "天气未知"
    };

}


/* =========================================================
   HTML 安全
========================================================= */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   自动刷新
========================================================= */

setInterval(
    () => {

        loadMessages();

    },
    10000
);


/* =========================================================
   启动
========================================================= */

loadMessages();

loadWeather();

startRealtime();

requestNotificationPermission();


/* =========================================================
   手机端首次触摸输入时请求通知
========================================================= */

document
    .addEventListener(
        "click",
        function requestOnce() {

            requestNotificationPermission();

            document.removeEventListener(
                "click",
                requestOnce
            );

        },
        {
            once: true
        }
    );

</script>

</body>
</html>
