<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈子涵 - 安全实验室</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #020b06;
            color: #00ff73;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 动态代码雨背景 */
        #matrix {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.35;
        }

        /* 黑色半透明遮罩 */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 10, 5, 0.45);
            z-index: -1;
            pointer-events: none;
        }

        .login-box {
            width: 360px;
            padding: 40px;
            background: rgba(0, 20, 10, 0.88);
            border: 1px solid #00ff73;
            border-radius: 12px;
            box-shadow:
                0 0 20px rgba(0, 255, 115, 0.35),
                inset 0 0 20px rgba(0, 255, 115, 0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 0 0 10px #00ff73;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: rgba(0, 0, 0, 0.6);
            color: #00ff73;
            border: 1px solid #00aa50;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #00ff73;
            box-shadow: 0 0 10px rgba(0, 255, 115, 0.4);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #00aa50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #00ff73;
            color: #001b0b;
            box-shadow: 0 0 15px #00ff73;
        }

        .tip {
            text-align: center;
            font-size: 12px;
            color: #7affae;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <!-- 动态背景 -->
    <canvas id="matrix"></canvas>

    <!-- 登录框 -->
    <div class="login-box">

        <h1>安全实验室</h1>

        <form onsubmit="alert('这是安全实验演示页面，不会收集账号或密码'); return false;">

            <input
                type="text"
                placeholder="测试用户名"
            >

            <input
                type="password"
                placeholder="测试密码"
            >

            <button type="submit">登录</button>

        </form>

        <div class="tip">
            SECURITY LAB DEMO
        </div>

    </div>

    <script>
        const canvas = document.getElementById("matrix");
        const ctx = canvas.getContext("2d");

        const characters =
            "01ABCDEFGHIJKLMNOPQRSTUVWXYZ<>[]{}$#@%";

        let width;
        let height;
        let columns;
        let drops;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            columns = Math.floor(width / 18);

            drops = [];

            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -50;
            }
        }

        function draw() {

            ctx.fillStyle = "rgba(0, 8, 4, 0.08)";
            ctx.fillRect(0, 0, width, height);

            ctx.font = "15px monospace";

            for (let i = 0; i < columns; i++) {

                const char =
                    characters[
                        Math.floor(
                            Math.random() * characters.length
                        )
                    ];

                const x = i * 18;
                const y = drops[i] * 18;

                ctx.fillStyle = "#00ff73";
                ctx.fillText(char, x, y);

                if (y > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener("resize", resize);

        resize();
        draw();
    </script>

</body>
</html>
