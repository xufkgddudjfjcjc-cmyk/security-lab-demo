<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Security Lab</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #020806;
    color: #00ff66;
    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
}

body {
    overflow-x: hidden;
}

/* =========================
   Matrix 背景
========================= */

#matrix {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: #020806;
}

/* =========================
   页面
========================= */

.page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 18px;
}

/* =========================
   顶部
========================= */

.header {
    width: 100%;
    max-width: 1100px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 16px 20px;

    border: 1px solid rgba(0,255,102,.35);
    border-radius: 16px;

    background: rgba(0,12,7,.88);

    box-shadow:
        0 0 25px rgba(0,255,102,.08);

    backdrop-filter: blur(12px);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    text-shadow: 0 0 15px #00ff66;
}

.online {
    font-size: 13px;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;

    margin-right: 6px;

    border-radius: 50%;
    background: #00ff66;

    box-shadow: 0 0 12px #00ff66;
}

/* =========================
   主体
========================= */

.container {
    width: 100%;
    max-width: 1100px;
    margin: 25px auto;
}

/* =========================
   标题
========================= */

.hero {
    text-align: center;
    padding: 25px 10px;
}

.hero h1 {
    margin: 0;

    font-size: clamp(34px, 7vw, 60px);

    text-shadow:
        0 0 10px #00ff66,
        0 0 30px rgba(0,255,102,.5);
}

.hero p {
    margin-top: 10px;
    color: #69e998;
}

/* =========================
   卡片
========================= */

.panel {
    width: 100%;

    margin-top: 20px;
    padding: 24px;

    border:
        1px solid rgba(0,255,102,.35);

    border-radius: 18px;

    background:
        rgba(0,15,8,.88);

    box-shadow:
        0 0 30px rgba(0,255,102,.08);

    backdrop-filter: blur(10px);
}

.panel-title {
    margin: 0 0 18px;

    font-size: 23px;

    text-shadow:
        0 0 10px #00ff66;
}

/* =========================
   昵称
========================= */

.nickname-area {
    display: flex;
    gap: 10px;
}

.nickname-input {
    flex: 1;

    min-width: 0;

    padding: 14px;

    border:
        1px solid #087d3a;

    border-radius: 10px;

    background: #020a06;

    color: #00ff66;

    font-size: 16px;

    outline: none;
}

.nickname-input:focus {
    border-color: #00ff66;

    box-shadow:
        0 0 15px rgba(0,255,102,.25);
}

.green-button {
    border: 0;

    padding: 14px 22px;

    border-radius: 10px;

    background: #00d957;

    color: #001b0b;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;
}

.green-button:active {
    transform: scale(.97);
}

/* =========================
   当前用户
========================= */

.user-info {
    margin-top: 12px;

    color: #75ffa8;

    font-size: 14px;
}

/* =========================
   聊天区域
========================= */

.chat-box {
    height: 430px;

    overflow-y: auto;

    padding: 10px;

    border:
        1px solid rgba(0,255,102,.15);

    border-radius: 12px;

    background:
        rgba(0,0,0,.35);
}

.chat-box::-webkit-scrollbar {
    width: 5px;
}

.chat-box::-webkit-scrollbar-thumb {
    background: #00a844;
    border-radius: 10px;
}

/* =========================
   消息
========================= */

.message {
    padding: 13px 15px;

    margin-bottom: 12px;

    border:
        1px solid rgba(0,255,102,.18);

    border-radius: 12px;

    background:
        rgba(0,255,102,.035);
}

.message-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;

    margin-bottom: 7px;
}

.message-user {
    color: #00ff66;
    font-weight: bold;
}

.message-time {
    color: #4f8d65;
    font-size: 12px;
}

.message-text {
    color: #d4ffe2;
    line-height: 1.6;
    word-break: break-word;
}

/* =========================
   输入聊天
========================= */

.chat-input-area {
    display: flex;

    gap: 10px;

    margin-top: 14px;
}

.chat-input {
    flex: 1;

    min-width: 0;

    padding: 15px;

    border:
        1px solid #087d3a;

    border-radius: 10px;

    background:
        #020a06;

    color: #00ff66;

    outline: none;

    font-size: 16px;
}

.chat-input:focus {
    border-color: #00ff66;

    box-shadow:
        0 0 15px rgba(0,255,102,.2);
}

.send-button {
    width: 100px;

    border: 0;

    border-radius: 10px;

    background: #00df5a;

    color: #001b0b;

    font-weight: bold;

    font-size: 16px;

    cursor: pointer;
}

.send-button:disabled {
    opacity: .5;
}

/* =========================
   状态
========================= */

.status-box {
    margin-top: 15px;

    min-height: 24px;

    font-size: 14px;
}

.status-ok {
    color: #00ff66;
}

.status-error {
    color: #ff5f6d;
}

.status-loading {
    color: #ffe66d;
}

/* =========================
   系统状态
========================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 14px;
}

.stat {
    padding: 20px;

    text-align: center;

    border:
        1px solid rgba(0,255,102,.18);

    border-radius: 12px;

    background:
        rgba(0,255,102,.035);
}

.stat-label {
    color: #72c88e;
    font-size: 14px;
}

.stat-value {
    margin-top: 8px;

    font-size: 22px;

    font-weight: bold;
}

/* =========================
   功能
========================= */

.features {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 16px;
}

.feature {
    padding: 22px;

    border:
        1px solid rgba(0,255,102,.2);

    border-radius: 14px;

    background:
        rgba(0,15,8,.8);
}

.feature h3 {
    margin-top: 0;
}

.feature p {
    color: #80b895;
    line-height: 1.6;
}

/* =========================
   页脚
========================= */

.footer {
    max-width: 1100px;

    margin: 40px auto 20px;

    text-align: center;

    color: #447456;

    font-size: 13px;
}

/* =========================
   昵称弹窗
========================= */

.nickname-modal {
    position: fixed;

    inset: 0;

    z-index: 999;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter: blur(8px);
}

.nickname-modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 430px;

    padding: 28px;

    border:
        1px solid #00ff66;

    border-radius: 18px;

    background:
        #020b06;

    box-shadow:
        0 0 35px rgba(0,255,102,.25);
}

.modal-box h2 {
    margin-top: 0;

    text-align: center;

    text-shadow:
        0 0 12px #00ff66;
}

.modal-box p {
    text-align: center;

    color: #72b987;
}

.modal-input {
    width: 100%;

    padding: 15px;

    margin-top: 12px;

    border:
        1px solid #087d3a;

    border-radius: 10px;

    outline: none;

    background: #000b06;

    color: #00ff66;

    font-size: 17px;
}

.modal-input:focus {
    border-color: #00ff66;
}

.modal-button {
    width: 100%;

    padding: 14px;

    margin-top: 14px;

    border: 0;

    border-radius: 10px;

    background: #00df5a;

    color: #001b0b;

    font-size: 16px;

    font-weight: bold;
}

/* =========================
   手机
========================= */

@media (max-width: 700px) {

    .page {
        padding: 10px;
    }

    .header {
        padding: 13px;
    }

    .logo {
        font-size: 17px;
    }

    .online {
        font-size: 12px;
    }

    .panel {
        padding: 17px;
    }

    .nickname-area {
        flex-direction: column;
    }

    .green-button {
        width: 100%;
    }

    .chat-box {
        height: 420px;
    }

    .chat-input-area {
        flex-direction: column;
    }

    .send-button {
        width: 100%;
        height: 50px;
    }

    .stats {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .features {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- Matrix -->
<canvas id="matrix"></canvas>

<div class="page">

    <!-- 顶部 -->
    <header class="header">

        <div class="logo">
            🛡 SECURITY LAB
        </div>

        <div class="online">
            <span class="dot"></span>
            系统在线
        </div>

    </header>


    <main class="container">

        <!-- 标题 -->
        <section class="hero">

            <h1>安全实验室</h1>

            <p>
                SECURITY LAB · ONLINE CHAT
            </p>

        </section>


        <!-- 用户 -->
        <section class="panel">

            <h2 class="panel-title">
                👤 用户身份
            </h2>

            <div class="nickname-area">

                <input
                    id="nicknameInput"
                    class="nickname-input"
                    type="text"
                    maxlength="20"
                    placeholder="输入你的昵称"
                >

                <button
                    class="green-button"
                    onclick="saveNickname()"
                >
                    保存昵称
                </button>

            </div>

            <div
                id="userInfo"
                class="user-info"
            >
                当前昵称：未设置
            </div>

        </section>


        <!-- 聊天 -->
        <section class="panel">

            <h2 class="panel-title">
                💬 安全实验室聊天室
            </h2>

            <div
                id="chatBox"
                class="chat-box"
            >

                <div
                    style="
                    text-align:center;
                    color:#477957;
                    padding:30px;
                    "
                >
                    正在连接聊天服务器...
                </div>

            </div>


            <div class="chat-input-area">

                <input
                    id="messageInput"
                    class="chat-input"
                    type="text"
                    maxlength="500"
                    placeholder="输入消息..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    class="send-button"
                    onclick="sendMessage()"
                >
                    发送
                </button>

            </div>


            <div
                id="status"
                class="status-box status-loading"
            >
                正在连接数据库...
            </div>

        </section>


        <!-- 系统状态 -->
        <section class="panel">

            <h2 class="panel-title">
                📊 系统状态
            </h2>

            <div class="stats">

                <div class="stat">

                    <div class="stat-label">
                        数据库
                    </div>

                    <div
                        id="databaseStatus"
                        class="stat-value"
                    >
                        连接中
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        聊天
                    </div>

                    <div
                        id="chatStatus"
                        class="stat-value"
                    >
                        在线
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        当前时间
                    </div>

                    <div
                        id="clock"
                        class="stat-value"
                    >
                        --:--:--
                    </div>

                </div>

            </div>

        </section>


        <!-- 功能 -->
        <section class="features">

            <div class="feature">

                <h3>
                    🔐 身份验证
                </h3>

                <p>
                    使用昵称进入安全实验室聊天室。
                </p>

            </div>


            <div class="feature">

                <h3>
                    🖥 在线聊天
                </h3>

                <p>
                    使用 Supabase 保存和读取聊天消息。
                </p>

            </div>


            <div class="feature">

                <h3>
                    📡 实时系统
                </h3>

                <p>
                    页面会自动刷新聊天消息。
                </p>

            </div>

        </section>

    </main>


    <footer class="footer">

        SECURITY LAB DEMO ·
        仅用于合法安全实验

    </footer>

</div>


<!-- 昵称弹窗 -->
<div
    id="nicknameModal"
    class="nickname-modal"
>

    <div class="modal-box">

        <h2>
            🛡 欢迎来到 Security Lab
        </h2>

        <p>
            第一次使用，请设置你的昵称
        </p>

        <input
            id="modalNickname"
            class="modal-input"
            type="text"
            maxlength="20"
            placeholder="例如：czh"
        >

        <button
            class="modal-button"
            onclick="saveModalNickname()"
        >
            进入聊天室
        </button>

    </div>

</div>


<script>

/* =====================================================
   Supabase 配置
===================================================== */

/*
   这是你的 Supabase 项目地址
*/

const SUPABASE_URL =
    "https://inducpwbmyjhnnjkqyxq.supabase.co";


/*
   这是你之前提供的 Publishable Key

   注意：
   sb_publishable 可以放在网页前端。
   不要把 sb_secret 放进这里。
*/

const SUPABASE_KEY =
    "sb_publishable_aukve7aK4EQCniOtCSy8uQ_raK8MH0j";


/* 创建 Supabase 客户端 */

let supabaseClient = null;

try {

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

} catch (error) {

    console.error(error);

}


/* =====================================================
   用户昵称
===================================================== */

let nickname =
    localStorage.getItem("security_lab_nickname") || "";


/* 页面打开 */

window.addEventListener("load", function() {

    updateNicknameUI();

    if (!nickname) {

        document
            .getElementById("nicknameModal")
            .classList.add("show");

        setTimeout(function() {

            document
                .getElementById("modalNickname")
                .focus();

        }, 300);

    }

    initChat();

});


/* 保存弹窗昵称 */

function saveModalNickname() {

    const input =
        document.getElementById("modalNickname");

    const name =
        input.value.trim();

    if (!name) {

        alert("请输入昵称");

        input.focus();

        return;
    }

    nickname = name;

    localStorage.setItem(
        "security_lab_nickname",
        nickname
    );

    document
        .getElementById("nicknameModal")
        .classList.remove("show");

    updateNicknameUI();

}


/* 保存普通昵称 */

function saveNickname() {

    const input =
        document.getElementById("nicknameInput");

    const name =
        input.value.trim();

    if (!name) {

        alert("请输入昵称");

        return;
    }

    nickname = name;

    localStorage.setItem(
        "security_lab_nickname",
        nickname
    );

    updateNicknameUI();

    showStatus(
        "昵称保存成功",
        "ok"
    );

}


/* 更新昵称 */

function updateNicknameUI() {

    const input =
        document.getElementById("nicknameInput");

    const info =
        document.getElementById("userInfo");

    if (nickname) {

        input.value = nickname;

        info.textContent =
            "当前昵称：" + nickname;

    } else {

        info.textContent =
            "当前昵称：未设置";

    }

}


/* =====================================================
   状态提示
===================================================== */

function showStatus(message, type) {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.className =
        "status-box " +
        (
            type === "error"
                ? "status-error"
                : type === "ok"
                ? "status-ok"
                : "status-loading"
        );

}


/* =====================================================
   数据库连接
===================================================== */

async function initChat() {

    if (!supabaseClient) {

        setDatabaseError(
            "Supabase 初始化失败"
        );

        return;
    }

    try {

        const result =
            await supabaseClient
                .from("messages")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                )
                .limit(100);


        if (result.error) {

            console.error(
                "Supabase:",
                result.error
            );

            setDatabaseError(
                result.error.message
            );

            return;
        }


        document
            .getElementById("databaseStatus")
            .textContent = "已连接";


        showStatus(
            "数据库连接成功",
            "ok"
        );


        renderMessages(
            result.data || []
        );


    } catch (error) {

        console.error(error);

        setDatabaseError(
            error.message || "连接失败"
        );

    }

}


/* 数据库错误 */

function setDatabaseError(message) {

    document
        .getElementById("databaseStatus")
        .textContent = "连接失败";

    showStatus(
        "数据库连接失败：" + message,
        "error"
    );

}


/* =====================================================
   读取聊天
===================================================== */

async function loadMessages() {

    if (!supabaseClient) {
        return;
    }

    try {

        const result =
            await supabaseClient
                .from("messages")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                )
                .limit(100);


        if (result.error) {

            console.error(
                result.error
            );

            showStatus(
                "读取聊天记录失败：" +
                result.error.message,
                "error"
            );

            return;
        }


        renderMessages(
            result.data || []
        );


    } catch (error) {

        console.error(error);

        showStatus(
            "读取聊天记录失败：" +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   显示聊天
===================================================== */

function renderMessages(messages) {

    const chatBox =
        document.getElementById("chatBox");


    if (!messages.length) {

        chatBox.innerHTML = `
            <div style="
                text-align:center;
                color:#477957;
                padding:40px;
            ">
                暂无消息<br>
                <span style="font-size:13px">
                    发送第一条消息吧
                </span>
            </div>
        `;

        return;
    }


    chatBox.innerHTML = "";


    messages.forEach(function(message) {

        const item =
            document.createElement("div");

        item.className = "message";


        const top =
            document.createElement("div");

        top.className = "message-top";


        const user =
            document.createElement("div");

        user.className = "message-user";

        user.textContent =
            message.username ||
            "匿名";


        const time =
            document.createElement("div");

        time.className = "message-time";

        time.textContent =
            formatTime(message.created_at);


        const text =
            document.createElement("div");

        text.className = "message-text";

        text.textContent =
            message.info || "";


        top.appendChild(user);

        top.appendChild(time);

        item.appendChild(top);

        item.appendChild(text);

        chatBox.appendChild(item);

    });


    chatBox.scrollTop =
        chatBox.scrollHeight;

}


/* =====================================================
   发送消息
===================================================== */

async function sendMessage() {

    if (!nickname) {

        document
            .getElementById("nicknameModal")
            .classList.add("show");

        return;
    }


    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();


    if (!text) {

        return;
    }


    if (!supabaseClient) {

        showStatus(
            "数据库没有连接",
            "error"
        );

        return;
    }


    const button =
        document.getElementById("sendButton");


    button.disabled = true;

    button.textContent =
        "发送中";


    try {

        /*
          messages 表对应：

          username = 昵称
          info     = 消息
          created_at = 时间
        */

        const result =
            await supabaseClient
                .from("messages")
                .insert([
                    {
                        username: nickname,
                        info: text
                    }
                ]);


        if (result.error) {

            console.error(
                result.error
            );

            showStatus(
                "发送失败：" +
                result.error.message,
                "error"
            );

            return;
        }


        input.value = "";

        showStatus(
            "消息发送成功",
            "ok"
        );


        await loadMessages();


    } catch (error) {

        console.error(error);

        showStatus(
            "发送失败：" +
            error.message,
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "发送";

    }

}


/* =====================================================
   时间
===================================================== */

function formatTime(dateString) {

    if (!dateString) {
        return "";
    }

    const date =
        new Date(dateString);


    if (isNaN(date.getTime())) {
        return "";
    }


    return date.toLocaleString(
        "zh-CN",
        {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   回车发送
===================================================== */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* =====================================================
   自动刷新聊天
===================================================== */

setInterval(
    function() {

        loadMessages();

    },
    5000
);


/* =====================================================
   实时时钟
===================================================== */

function updateClock() {

    const now =
        new Date();

    document
        .getElementById("clock")
        .textContent =
        now.toLocaleTimeString(
            "zh-CN"
        );

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   Matrix
===================================================== */

const canvas =
    document.getElementById("matrix");

const ctx =
    canvas.getContext("2d");


let width = 0;
let height = 0;
let columns = 0;
let drops = [];


const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789{}[]<>/\\$#@%";


function resizeMatrix() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;


    columns =
        Math.floor(
            width / 18
        );


    drops = [];


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        drops[i] =
            Math.random() * -50;

    }

}


function drawMatrix() {

    ctx.fillStyle =
        "rgba(2,8,6,0.08)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.font =
        "15px monospace";


    for (
        let i = 0;
        i < drops.length;
        i++
    ) {

        const text =
            characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];


        ctx.fillStyle =
            "rgba(0,255,102,.55)";


        ctx.fillText(
            text,
            i * 18,
            drops[i] * 18
        );


        if (
            drops[i] * 18 > height &&
            Math.random() > .975
        ) {

            drops[i] = 0;

        }


        drops[i]++;

    }

}


resizeMatrix();

window.addEventListener(
    "resize",
    resizeMatrix
);


setInterval(
    drawMatrix,
    50
);

</script>
