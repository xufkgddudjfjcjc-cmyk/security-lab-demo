<!-- ================================
     Security Lab 启动动画
================================ -->

<div id="bootScreen" class="boot-screen">
    <div class="boot-logo">
        <div class="boot-symbol">◇</div>
        <div class="boot-title">SECURITY LAB</div>
        <div class="boot-subtitle">INITIALIZING SYSTEM</div>

        <div class="boot-progress">
            <div id="bootProgress"></div>
        </div>

        <div id="bootText" class="boot-text">
            Starting Security Lab...
        </div>
    </div>
</div>


<!-- ================================
     设置中心
================================ -->

<div id="settingsModal" class="modal"
     onclick="closeSettingsOutside(event)">

    <div class="settings-card">

        <div class="settings-header">
            <div>
                <div class="settings-title">⚙️ 设置中心</div>
                <div class="settings-subtitle">
                    Security Lab Preferences
                </div>
            </div>

            <button
                class="modal-close"
                onclick="closeSettings()">
                ✕
            </button>
        </div>


        <div class="settings-section">
            <div class="settings-section-title">
                外观
            </div>

            <label class="setting-row">
                <div>
                    <strong>🌌 动态星空</strong>
                    <small>显示背景星星动画</small>
                </div>

                <input
                    id="settingStars"
                    type="checkbox"
                    onchange="applySettings()"
                >
            </label>


            <label class="setting-row">
                <div>
                    <strong>🌍 动态地球</strong>
                    <small>显示旋转地球背景</small>
                </div>

                <input
                    id="settingGlobe"
                    type="checkbox"
                    onchange="applySettings()"
                >
            </label>


            <label class="setting-row">
                <div>
                    <strong>✨ 环境光</strong>
                    <small>蓝紫色动态氛围光</small>
                </div>

                <input
                    id="settingAmbient"
                    type="checkbox"
                    onchange="applySettings()"
                >
            </label>


            <label class="setting-row">
                <div>
                    <strong>🚀 流畅模式</strong>
                    <small>降低动画负载，提高手机流畅度</small>
                </div>

                <input
                    id="settingSmooth"
                    type="checkbox"
                    onchange="applySettings()"
                >
            </label>
        </div>


        <div class="settings-section">
            <div class="settings-section-title">
                系统
            </div>

            <label class="setting-row">
                <div>
                    <strong>🖥️ 启动动画</strong>
                    <small>打开网页时显示 Security Lab Logo</small>
                </div>

                <input
                    id="settingBoot"
                    type="checkbox"
                    onchange="applySettings()"
                >
            </label>


            <label class="setting-row">
                <div>
                    <strong>🔔 操作提示</strong>
                    <small>显示操作完成提示</small>
                </div>

                <input
                    id="settingToast"
                    type="checkbox"
                    onchange="applySettings()"
                >
            </label>
        </div>


        <div class="settings-section">
            <div class="settings-section-title">
                关于
            </div>

            <div class="about-box">
                <div class="about-logo">◇</div>

                <div>
                    <strong>Security Lab</strong>
                    <div>Community Interface</div>
                    <small>Version 2.0</small>
                </div>
            </div>
        </div>


        <button
            class="settings-reset"
            onclick="resetSettings()">
            恢复默认设置
        </button>

    </div>
</div>


<script>

/* =========================================
   Security Lab 设置系统
========================================= */

const SECURITY_SETTINGS_KEY =
    "security_lab_settings";


const defaultSettings = {

    stars: true,

    globe: true,

    ambient: true,

    smooth: true,

    boot: true,

    toast: true

};


let securitySettings = {

    ...defaultSettings

};


try {

    const saved =
        localStorage.getItem(
            SECURITY_SETTINGS_KEY
        );

    if (saved) {

        securitySettings = {

            ...defaultSettings,

            ...JSON.parse(saved)

        };

    }

} catch (error) {

    console.error(
        "Settings load error:",
        error
    );

}


/* =========================================
   设置保存
========================================= */

function saveSettings() {

    try {

        localStorage.setItem(
            SECURITY_SETTINGS_KEY,
            JSON.stringify(
                securitySettings
            )
        );

    } catch (error) {

        console.error(
            "Settings save error:",
            error
        );

    }

}


/* =========================================
   应用设置
========================================= */

function applySettings() {

    securitySettings.stars =
        document.getElementById(
            "settingStars"
        ).checked;


    securitySettings.globe =
        document.getElementById(
            "settingGlobe"
        ).checked;


    securitySettings.ambient =
        document.getElementById(
            "settingAmbient"
        ).checked;


    securitySettings.smooth =
        document.getElementById(
            "settingSmooth"
        ).checked;


    securitySettings.boot =
        document.getElementById(
            "settingBoot"
        ).checked;


    securitySettings.toast =
        document.getElementById(
            "settingToast"
        ).checked;


    saveSettings();


    const space =
        document.getElementById(
            "space"
        );


    const globe =
        document.querySelector(
            ".globe-layer"
        );


    const ambient =
        document.querySelectorAll(
            ".ambient"
        );


    if (space) {

        space.style.display =
            securitySettings.stars
                ? ""
                : "none";

    }


    if (globe) {

        globe.style.display =
            securitySettings.globe
                ? ""
                : "none";

    }


    ambient.forEach(
        element => {

            element.style.display =
                securitySettings.ambient
                    ? ""
                    : "none";

        }
    );


    document.body.classList.toggle(
        "smooth-mode",
        securitySettings.smooth
    );


    showSettingToast(
        "设置已保存"
    );

}


/* =========================================
   打开设置
========================================= */

function openSettings() {

    const modal =
        document.getElementById(
            "settingsModal"
        );


    if (!modal) return;


    document.getElementById(
        "settingStars"
    ).checked =
        securitySettings.stars;


    document.getElementById(
        "settingGlobe"
    ).checked =
        securitySettings.globe;


    document.getElementById(
        "settingAmbient"
    ).checked =
        securitySettings.ambient;


    document.getElementById(
        "settingSmooth"
    ).checked =
        securitySettings.smooth;


    document.getElementById(
        "settingBoot"
    ).checked =
        securitySettings.boot;


    document.getElementById(
        "settingToast"
    ).checked =
        securitySettings.toast;


    modal.classList.add(
        "show"
    );

}


function closeSettings() {

    const modal =
        document.getElementById(
            "settingsModal"
        );


    if (modal) {

        modal.classList.remove(
            "show"
        );

    }

}


function closeSettingsOutside(event) {

    if (
        event.target.id ===
        "settingsModal"
    ) {

        closeSettings();

    }

}


/* =========================================
   恢复默认
========================================= */

function resetSettings() {

    securitySettings =
        {

            ...defaultSettings

        };


    saveSettings();


    document.getElementById(
        "settingStars"
    ).checked = true;


    document.getElementById(
        "settingGlobe"
    ).checked = true;


    document.getElementById(
        "settingAmbient"
    ).checked = true;


    document.getElementById(
        "settingSmooth"
    ).checked = true;


    document.getElementById(
        "settingBoot"
    ).checked = true;


    document.getElementById(
        "settingToast"
    ).checked = true;


    applySettings();

}


/* =========================================
   设置提示
========================================= */

function showSettingToast(text) {

    if (
        !securitySettings.toast
    ) {

        return;

    }


    if (
        typeof showToast ===
        "function"
    ) {

        showToast(text);

    }

}


/* =========================================
   启动动画
========================================= */

function startBootAnimation() {

    const screen =
        document.getElementById(
            "bootScreen"
        );


    const progress =
        document.getElementById(
            "bootProgress"
        );


    const text =
        document.getElementById(
            "bootText"
        );


    if (!screen) return;


    if (
        !securitySettings.boot
    ) {

        screen.remove();

        return;

    }


    const messages = [

        "Starting Security Lab...",

        "Loading interface...",

        "Initializing modules...",

        "Connecting services...",

        "System ready."

    ];


    let value = 0;

    let index = 0;


    const timer =
        setInterval(
            function() {

                value +=
                    Math.random() *
                    12 +
                    8;


                if (
                    value > 100
                ) {

                    value = 100;

                }


                progress.style.width =
                    value + "%";


                if (
                    value > 20 &&
                    index < 1
                ) {

                    index = 1;

                    text.textContent =
                        messages[index];

                }


                if (
                    value > 42 &&
                    index < 2
                ) {

                    index = 2;

                    text.textContent =
                        messages[index];

                }


                if (
                    value > 65 &&
                    index < 3
                ) {

                    index = 3;

                    text.textContent =
                        messages[index];

                }


                if (
                    value >= 100
                ) {

                    clearInterval(
                        timer
                    );


                    text.textContent =
                        messages[4];


                    setTimeout(
                        function() {

                            screen.classList.add(
                                "boot-hide"
                            );


                            setTimeout(
                                function() {

                                    screen.remove();

                                },
                                650
                            );

                        },
                        350
                    );

                }

            },
            110
        );

}


/* =========================================
   苹果风格点击反馈
========================================= */

document.addEventListener(
    "pointerdown",
    function(event) {

        const target =
            event.target.closest(
                "button, .channel, .reaction, .message-action, .edit-profile-btn"
            );


        if (!target) return;


        target.classList.add(
            "apple-press"
        );

    },
    {
        passive:true
    }
);


document.addEventListener(
    "pointerup",
    function(event) {

        const target =
            event.target.closest(
                "button, .channel, .reaction, .message-action, .edit-profile-btn"
            );


        if (!target) return;


        target.classList.remove(
            "apple-press"
        );

    },
    {
        passive:true
    }
);


document.addEventListener(
    "pointercancel",
    function(event) {

        const target =
            event.target.closest(
                "button, .channel, .reaction, .message-action, .edit-profile-btn"
            );


        if (!target) return;


        target.classList.remove(
            "apple-press"
        );

    },
    {
        passive:true
    }
);


/* =========================================
   启动
========================================= */

applySettings();


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        startBootAnimation
    );

} else {

    startBootAnimation();

}

</script>
