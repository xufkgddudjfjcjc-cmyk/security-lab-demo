<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全实验室</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #020b06;
    color: #00ff66;
}

body {
    overflow-x: hidden;
}

#matrix {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: #020b06;
}

.page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 25px 15px;
}

.header {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    border: 1px solid rgba(0,255,102,.4);
    border-radius: 14px;
    background: rgba(0,15,8,.9);
}

.logo {
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 0 12px #00ff66;
}

.status {
    font-size: 14px;
}

.status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    background: #00ff66;
    border-radius: 50%;
    box-shadow: 0 0 12px #00ff66;
    margin-right: 6px;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
}

.login-box {
    max-width: 600px;
    margin: auto;
    padding: 35px;
    border: 1px solid #00ff66;
    border-radius: 20px;
    background: rgba(0,15,8,.92);
    box-shadow: 0 0 25px rgba(0,255,102,.25);
}

.title {
    text-align: center;
    font-size: 40px;
    margin: 0 0 8px;
    text-shadow: 0 0 20px #00ff66;
}

.subtitle {
    text-align: center;
    color: #72ffad;
    margin-bottom: 30px;
}

.input {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 1px solid #00aa44;
    border-radius: 8px;
    outline: none;
    background: rgba(0,0,0,.7);
    color: #00ff66;
    font-size: 16px;
}

.input::placeholder {
    color: #579b70;
}

.input:focus {
    border-color: #00ff66;
    box-shadow: 0 0 12px rgba(0,255,102,.35);
}

.btn {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #00b84f;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.btn:hover {
    background: #00e861;
    box-shadow: 0 0 20px rgba(0,255,102,.5);
}

.panel {
    max-width: 1100px;
    margin: 30px auto;
    padding: 25px;
    border: 1px solid rgba(0,255,102,.35);
    border-radius: 14px;
    background: rgba(0,15,8,.9);
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.stat {
    padding: 18px;
    text-align: center;
    border-radius: 10px;
    background: rgba(0,255,102,.06);
}

.stat-number {
    font-size: 24px;
    font-weight: bold;
    margin-top: 8px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.card {
    padding: 25px;
    border: 1px solid rgba(0,255,102,.35);
    border-radius: 14px;
    background: rgba(0,15,8,.9);
}

.card p {
    color: #8ed9aa;
    line-height: 1.6;
}

.terminal {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #00ff66;
    border-radius: 12px;
    background: #000904;
    font-family: monospace;
}

.terminal-line {
    margin: 8px 0;
}

.footer {
    text-align: center;
    margin-top: 40px;
    padding-bottom: 30px;
    color: #579b70;
}

@media (max-width: 700px) {
    .title {
        font-size: 32px;
    }

    .login-box {
        padding: 25px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="page">

<header class="header">
    <div class="logo">🛡 SECURITY LAB</div>

    <div class="status">
        <span class="status-dot"></span>
        系统在线
    </div>
</header>

<main class="container">

<section class="login-box">

    <h1 class="title">安全实验室</h1>

    <div class="subtitle">
        SECURITY LAB DEMO
    </div>

    <input
        id="username"
        class="input"
        type="text"
        placeholder="测试用户名"
    >

    <input
        id="password"
        class="input"
        type="password"
        placeholder="测试密码"
    >

    <button class="btn" onclick="demoLogin()">
        登录演示
    </button>

    <button class="btn" onclick="openTerminal()">
        打开安全终端
    </button>

    <div id="terminal" class="terminal">

        <div class="terminal-line">
            root@security-lab:~# ./start
        </div>

        <div class="terminal-line">
            [OK] Security Lab started
        </div>

        <div class="terminal-line">
            [OK] Demo environment ready
        </div>

        <div class="terminal-line">
            status: ONLINE
        </div>

        <button class="btn" onclick="closeTerminal()">
            关闭终端
        </button>

    </div>

</section>

<section class="panel">

    <h2>系统状态</h2>

    <div class="stats">

        <div class="stat">
            CPU
            <div class="stat-number">正常</div>
        </div>

        <div class="stat">
            网络
            <div class="stat-number">在线</div>
        </div>

        <div class="stat">
            防护
            <div class="stat-number">启用</div>
        </div>

        <div class="stat">
            时间
            <div id="clock" class="stat-number">--:--:--</div>
        </div>

    </div>

</section>

<section class="cards">

    <div class="card">
        <h3>🔐 身份验证</h3>

        <p>
            用于演示登录页面和表单验证。
        </p>

        <button
            class="btn"
            onclick="showMessage('身份验证模块已启动')">
            启动
        </button>
    </div>

    <div class="card">
        <h3>🖥 安全终端</h3>

        <p>
            模拟安全实验环境中的终端。
        </p>

        <button
            class="btn"
            onclick="openTerminal()">
            打开
        </button>
    </div>

    <div class="card">
        <h3>📊 系统监控</h3>

        <p>
            查看实验环境的模拟运行状态。
        </p>

        <button
            class="btn"
            onclick="showMessage('所有系统运行正常')">
            检查
        </button>
    </div>

</section>

</main>

<footer class="footer">
    SECURITY LAB DEMO · 仅用于合法安全实验
</footer>

</div>

<script>

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let width;
let height;
let columns;
let drops;

const characters =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789{}[]<>/\\$#@%";

function resizeMatrix() {

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    columns = Math.floor(width / 18);

    drops = [];

    for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -50;
    }
}

function drawMatrix() {

    ctx.fillStyle = "rgba(2,11,6,0.08)";
    ctx.fillRect(0, 0, width, height);

    ctx.font = "16px monospace";

    for (let i = 0; i < drops.length; i++) {

        const text =
            characters[
                Math.floor(
                    Math.random() * characters.length
                )
            ];

        ctx.fillStyle = "#00ff66";

        ctx.fillText(
            text,
            i * 18,
            drops[i] * 18
        );

        if (
            drops[i] * 18 > height &&
            Math.random() > 0.975
        ) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}

resizeMatrix();

window.addEventListener("resize", resizeMatrix);

setInterval(drawMatrix, 50);

function demoLogin() {

    const username =
        document.getElementById("username").value;

    if (username.trim() === "") {

        alert("请输入测试用户名");

        return;
    }

    alert(
        "安全实验演示\n\n" +
        "不会发送或保存真实账号密码。\n\n" +
        "用户名：" + username
    );
}

function openTerminal() {

    document.getElementById(
        "terminal"
    ).style.display = "block";
}

function closeTerminal() {

    document.getElementById(
        "terminal"
    ).style.display = "none";
}

function showMessage(message) {

    alert(message);
}

function updateClock() {

    const now = new Date();

    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString("zh-CN");
}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
