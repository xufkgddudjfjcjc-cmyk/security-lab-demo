<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全实验室聊天室</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #020b06;
    color: #00ff66;
}

body {
    overflow-x: hidden;
}

#matrix {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: #020b06;
}

.page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 20px 12px 40px;
}

.header {
    max-width: 1000px;
    margin: 0 auto 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 20px;

    border: 1px solid rgba(0,255,102,.45);
    border-radius: 15px;

    background: rgba(0,15,8,.92);

    box-shadow: 0 0 20px rgba(0,255,102,.12);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    text-shadow: 0 0 12px #00ff66;
}

.status {
    font-size: 14px;
}

.status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 6px;
    border-radius: 50%;
    background: #00ff66;
    box-shadow: 0 0 12px #00ff66;
}

.box {
    max-width: 1000px;
    margin: 20px auto;

    padding: 25px;

    border: 1px solid rgba(0,255,102,.4);
    border-radius: 18px;

    background: rgba(0,15,8,.92);

    box-shadow:
        0 0 25px rgba(0,255,102,.12),
        inset 0 0 20px rgba(0,255,102,.03);
}

.title {
    text-align: center;
    font-size: 38px;
    margin: 0 0 8px;
    text-shadow: 0 0 20px #00ff66;
}

.subtitle {
    text-align: center;
    color: #72ffad;
    margin-bottom: 25px;
}

.input {
    width: 100%;
    padding: 14px;

    margin: 7px 0;

    border: 1px solid #00aa44;
    border-radius: 9px;

    outline: none;

    background: rgba(0,0,0,.65);
    color: #00ff66;

    font-size: 16px;
}

.input::placeholder {
    color: #4d996b;
}

.input:focus {
    border-color: #00ff66;

    box-shadow:
        0 0 12px
        rgba(0,255,102,.35);
}

.btn {
    width: 100%;
    padding: 14px;

    margin-top: 10px;

    border: none;
    border-radius: 9px;

    background: #00b84f;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.btn:hover {
    background: #00e861;
    box-shadow: 0 0 18px rgba(0,255,102,.4);
}

.messages {
    height: 420px;

    overflow-y: auto;

    padding: 15px;

    border:
        1px solid
        rgba(0,255,102,.35);

    border-radius: 12px;

    background:
        rgba(0,0,0,.6);
}

.message {
    padding: 12px;
    margin-bottom: 10px;

    border-left:
        3px solid #00ff66;

    border-radius: 7px;

    background:
        rgba(0,255,102,.055);

    word-break: break-word;
}

.username {
    color: #00ff66;
    font-weight: bold;
}

.time {
    color: #579b70;
    font-size: 12px;
    margin-left: 8px;
}

.message-text {
    color: #d5ffe2;
    margin-top: 6px;
    line-height: 1.5;
}

.send-area {
    display: grid;
    grid-template-columns: 180px 1fr 110px;

    gap: 10px;

    margin-top: 12px;
}

.send-area .input {
    margin: 0;
}

.send {
    margin: 0;
}

.info {
    margin-top: 12px;
    color: #72ffad;
    font-size: 14px;
}

.success {
    color: #00ff66;
}

.error {
    color: #ff6666;
}

.system-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;
}

.system-item {
    padding: 18px;

    border-radius: 10px;

    background:
        rgba(0,255,102,.05);
}

.system-value {
    margin-top: 7px;

    font-size: 20px;
    font-weight: bold;
}

.footer {
    text-align: center;

    margin-top: 30px;

    color: #579b70;

    font-size: 13px;
}

@media (max-width: 700px) {

    .page {
        padding: 12px 10px 30px;
    }

    .header {
        padding: 13px;
    }

    .logo {
        font-size: 18px;
    }

    .title {
        font-size: 30px;
    }

    .box {
        padding: 18px;
    }

    .messages {
        height: 380px;
    }

    .send-area {
        grid-template-columns: 1fr;
    }

    .send {
        margin-top: 5px;
    }

    .system-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="page">

<header class="header">

    <div class="logo">
        🛡 SECURITY LAB
    </div>

    <div class="status">
        <span class="status-dot"></span>
        系统在线
    </div>

</header>


<!-- 用户区域 -->

<section class="box">

    <h1 class="title">
        安全实验室
    </h1>

    <div class="subtitle">
        SECURITY LAB · REALTIME CHAT
    </div>

    <input
        id="username"
        class="input"
        type="text"
        maxlength="30"
        placeholder="输入你的聊天昵称"
    >

    <div
        id="userInfo"
        class="info"
    >
        当前未设置昵称
    </div>

</section>


<!-- 聊天区域 -->

<section class="box">

    <h2>
        💬 实时聊天室
    </h2>

    <div
        id="messages"
        class="messages"
    >
        正在连接聊天服务器...
    </div>


    <div class="send-area">

        <input
            id="chatName"
            class="input"
            type="text"
            maxlength="30"
            placeholder="昵称"
        >

        <input
            id="chatText"
            class="input"
            type="text"
            maxlength="500"
            placeholder="输入消息，按 Enter 发送"
        >

        <button
            id="sendButton"
            class="btn send"
            type="button"
        >
            发送
        </button>

    </div>


    <div
        id="status"
        class="info"
    >
        正在连接 Supabase...
    </div>

</section>


<!-- 系统状态 -->

<section class="box">

    <h2>
        📊 系统状态
    </h2>

    <div class="system-grid">

        <div class="system-item">
            数据库
            <div
                id="databaseStatus"
                class="system-value"
            >
                检查中
            </div>
        </div>

        <div class="system-item">
            实时连接
            <div
                id="realtimeStatus"
                class="system-value"
            >
                连接中
            </div>
        </div>

        <div class="system-item">
            消息数量
            <div
                id="messageCount"
                class="system-value"
            >
                0
            </div>
        </div>

        <div class="system-item">
            当前时间
            <div
                id="clock"
                class="system-value"
            >
                --:--:--
            </div>
        </div>

    </div>

</section>


<footer class="footer">
    SECURITY LAB DEMO · 仅用于合法安全实验
</footer>

</div>


<script>

/* ==========================================
   1. Supabase 配置
========================================== */

const SUPABASE_URL =
"https://lnducpwbmyjhnnjkqyxq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aukve7aK4EQCniOtCSy8uQ_raK8MH0j";


/* ==========================================
   2. 创建 Supabase 客户端
========================================== */

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   3. 获取页面元素
========================================== */

const usernameInput =
document.getElementById("username");

const chatName =
document.getElementById("chatName");

const chatText =
document.getElementById("chatText");

const sendButton =
document.getElementById("sendButton");

const messages =
document.getElementById("messages");

const status =
document.getElementById("status");

const databaseStatus =
document.getElementById("databaseStatus");

const realtimeStatus =
document.getElementById("realtimeStatus");

const messageCount =
document.getElementById("messageCount");

const userInfo =
document.getElementById("userInfo");


/* ==========================================
   4. HTML 安全处理
========================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null
        ? ""
        : String(value);

    return div.innerHTML;
}


/* ==========================================
   5. 保存昵称
========================================== */

const savedName =
localStorage.getItem(
    "security_lab_username"
);

if (savedName) {

    usernameInput.value =
        savedName;

    chatName.value =
        savedName;

    userInfo.textContent =
        "当前昵称：" +
        savedName;
}


usernameInput.addEventListener(
    "input",
    function () {

        const name =
            usernameInput.value.trim();

        chatName.value =
            name;

        if (name) {

            localStorage.setItem(
                "security_lab_username",
                name
            );

            userInfo.textContent =
                "当前昵称：" +
                name;

        } else {

            userInfo.textContent =
                "当前未设置昵称";
        }
    }
);


/* ==========================================
   6. 显示聊天消息
========================================== */

function addMessage(item) {

    if (!item || !item.id) {
        return;
    }


    const old =
        document.querySelector(
            '[data-message-id="' +
            item.id +
            '"]'
        );

    if (old) {
        return;
    }


    const div =
        document.createElement("div");

    div.className =
        "message";

    div.dataset.messageId =
        item.id;


    const name =
        escapeHTML(
            item.username
        );

    const text =
        escapeHTML(
            item.message
        );


    let time = "";

    if (item.created_at) {

        time =
            new Date(
                item.created_at
            ).toLocaleString(
                "zh-CN"
            );
    }


    div.innerHTML =

        '<div>' +

            '<span class="username">' +
            name +
            '</span>' +

            '<span class="time">' +
            escapeHTML(time) +
            '</span>' +

        '</div>' +

        '<div class="message-text">' +
        text +
        '</div>';


    messages.appendChild(div);


    updateMessageCount();
}


/* ==========================================
   7. 更新消息数量
========================================== */

function updateMessageCount() {

    const count =
        messages.querySelectorAll(
            ".message"
        ).length;

    messageCount.textContent =
        count;
}


/* ==========================================
   8. 滚动到底部
========================================== */

function scrollToBottom() {

    messages.scrollTop =
        messages.scrollHeight;
}


/* ==========================================
   9. 读取历史消息
========================================== */

async function loadMessages() {

    status.textContent =
        "正在读取聊天记录...";


    const result =
        await supabaseClient
            .from("messages")
            .select(
                "id,created_at,username,message"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            )
            .limit(100);


    if (result.error) {

        console.error(
            "Supabase error:",
            result.error
        );


        databaseStatus.textContent =
            "连接失败";

        databaseStatus.className =
            "system-value error";


        status.innerHTML =
            '<span class="error">' +
            "读取聊天记录失败：" +
            escapeHTML(
                result.error.message
            ) +
            "</span>";


        return;
    }


    databaseStatus.textContent =
        "正常";

    databaseStatus.className =
        "system-value success";


    status.textContent =
        "聊天服务器已连接";


    messages.innerHTML = "";


    if (
        !result.data ||
        result.data.length === 0
    ) {

        messages.innerHTML =
            "<div>目前还没有聊天消息。</div>";

        updateMessageCount();

        return;
    }


    result.data.forEach(
        function(item) {

            addMessage(item);

        }
    );


    scrollToBottom();
}


/* ==========================================
   10. 发送消息
========================================== */

async function sendMessage() {

    const username =
        chatName.value.trim();

    const message =
        chatText.value.trim();


    if (!username) {

        alert("请输入昵称");

        chatName.focus();

        return;
    }


    if (!message) {

        alert("请输入消息");

        chatText.focus();

        return;
    }


    if (username.length > 30) {

        alert("昵称不能超过30个字符");

        return;
    }


    if (message.length > 500) {

        alert("消息不能超过500个字符");

        return;
    }


    sendButton.disabled =
        true;

    sendButton.textContent =
        "发送中...";


    status.textContent =
        "正在发送消息...";


    const result =
        await supabaseClient
            .from("messages")
            .insert({

                username:
                    username,

                message:
                    message

            })
            .select()
            .single();


    if (result.error) {

        console.error(
            "发送错误:",
            result.error
        );


        status.innerHTML =
            '<span class="error">' +
            "发送失败：" +
            escapeHTML(
                result.error.message
            ) +
            "</span>";


        sendButton.disabled =
            false;

        sendButton.textContent =
            "发送";

        return;
    }


    localStorage.setItem(
        "security_lab_username",
        username
    );


    chatText.value =
        "";


    status.innerHTML =
        '<span class="success">' +
        "消息发送成功" +
        "</span>";


    /*
       立即显示消息。
       Realtime 如果再次收到，
       addMessage 会自动防止重复。
    */

    if (result.data) {

        addMessage(
            result.data
        );

        scrollToBottom();
    }


    sendButton.disabled =
        false;

    sendButton.textContent =
        "发送";
}


/* ==========================================
   11. 点击发送
========================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* ==========================================
   12. Enter 发送
========================================== */

chatText.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* ==========================================
   13. Realtime 实时聊天
========================================== */

const chatChannel =
    supabaseClient
        .channel(
            "security-lab-messages"
        )
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            function(payload) {

                console.log(
                    "收到新消息:",
                    payload.new
                );


                addMessage(
                    payload.new
                );


                scrollToBottom();
            }
        )
        .subscribe(
            function(channelStatus) {

                console.log(
                    "Realtime状态:",
                    channelStatus
                );


                if (
                    channelStatus ===
                    "SUBSCRIBED"
                ) {

                    realtimeStatus.textContent =
                        "正常";

                    realtimeStatus.className =
                        "system-value success";

                } else if (
                    channelStatus ===
                    "CHANNEL_ERROR"
                ) {

                    realtimeStatus.textContent =
                        "连接失败";

                    realtimeStatus.className =
                        "system-value error";
                }
            }
        );


/* ==========================================
   14. 实时时钟
========================================== */

function updateClock() {

    document.getElementById(
        "clock"
    ).textContent =
        new Date().toLocaleTimeString(
            "zh-CN"
        );
}


updateClock();

setInterval(
    updateClock,
    1000
);


/* ==========================================
   15. Matrix 背景
========================================== */

const canvas =
    document.getElementById(
        "matrix"
    );

const ctx =
    canvas.getContext("2d");

let width;
let height;
let columns;
let drops;


const characters =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789{}[]<>/\\$#@%";


function resizeMatrix() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;


    columns =
        Math.floor(
            width / 18
        );


    drops = [];


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        drops[i] =
            Math.random() * -50;
    }
}


function drawMatrix() {

    ctx.fillStyle =
        "rgba(2,11,6,0.08)";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.font =
        "16px monospace";


    for (
        let i = 0;
        i < drops.length;
        i++
    ) {

        const text =
            characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];


        ctx.fillStyle =
            "#00ff66";


        ctx.fillText(
            text,
            i * 18,
            drops[i] * 18
        );


        if (
            drops[i] * 18 > height &&
            Math.random() > 0.975
        ) {

            drops[i] = 0;
        }


        drops[i]++;
    }
}


resizeMatrix();


window.addEventListener(
    "resize",
    resizeMatrix
);


setInterval(
    drawMatrix,
    50
);


/* ==========================================
   16. 启动
========================================== */

loadMessages();

</script>

</body>
</html>
