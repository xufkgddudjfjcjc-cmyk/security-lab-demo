<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Security Lab</title>
<style>
:root{--bg:#111214;--panel:#1a1b1e;--panel2:#202225;--panel3:#2b2d31;--line:#313338;--text:#f2f3f5;--muted:#b5bac1;--dim:#949ba4;--blue:#5865f2;--green:#23a55a;--red:#ed4245;--hover:#2e3035;--mention:#faa61a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:72px 240px minmax(0,1fr) 260px;background:#111214}
.servers{background:#0b0c0d;padding:12px 10px;display:flex;flex-direction:column;gap:10px;overflow:auto}.server{width:52px;height:52px;border-radius:16px;background:#1d1f22;display:grid;place-items:center;font-weight:800;color:#b5bac1;transition:.18s;position:relative}.server:hover,.server.active{border-radius:15px;background:var(--blue);color:#fff}.server.active:before{content:"";position:absolute;left:-10px;width:4px;height:32px;border-radius:0 4px 4px 0;background:#fff}.server.add{font-size:25px;color:#23a55a}.server img{width:100%;height:100%;border-radius:inherit;object-fit:cover}
.channels{background:#1a1b1e;display:flex;flex-direction:column;min-width:0;border-right:1px solid #0e0f10}.server-head{height:54px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:700}.server-head button{background:transparent;color:var(--muted)}.channel-list{flex:1;overflow:auto;padding:10px 8px}.cat{padding:12px 7px 5px;color:var(--dim);font-size:11px;font-weight:800;letter-spacing:.04em;display:flex;justify-content:space-between}.chan{height:38px;padding:0 9px;border-radius:5px;color:var(--muted);display:flex;align-items:center;gap:8px;margin:2px 0}.chan:hover{background:var(--hover);color:var(--text)}.chan.active{background:#404249;color:#fff}.chan .count{margin-left:auto;font-size:11px}.userbar{height:54px;background:#111214;padding:7px 9px;display:flex;align-items:center;gap:8px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5865f2,#9b59b6);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.presence{width:10px;height:10px;background:var(--green);border:2px solid #111214;border-radius:50%;position:absolute;right:-1px;bottom:0}.userbox{position:relative}.me{min-width:0;flex:1}.me b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.me span{color:var(--dim);font-size:10px}.iconbtn{width:30px;height:30px;border-radius:5px;background:transparent;color:var(--muted)}.iconbtn:hover{background:var(--hover);color:#fff}
.chat{min-width:0;display:flex;flex-direction:column;background:#313338}.chathead{height:54px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #25262a;background:#313338}.channel-title{font-weight:700}.channel-topic{color:var(--dim);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.headtools{margin-left:auto;display:flex;gap:4px;align-items:center}.search{width:170px;background:#1e1f22;border-radius:5px;height:30px;padding:0 9px;color:#fff;outline:0}.messages{flex:1;overflow:auto;padding:20px 18px}.welcome{text-align:center;color:var(--muted);padding:60px 20px}.msg{display:flex;gap:12px;padding:2px 8px;margin:2px 0;border-radius:5px;position:relative}.msg:hover{background:rgba(0,0,0,.06)}.msg.reply{margin-top:18px}.msg.reply:before{content:"";position:absolute;left:28px;top:-16px;width:2px;height:18px;background:#4e5058}.msg .avatar{width:40px;height:40px;border-radius:50%}.body{min-width:0;flex:1}.msgtop{display:flex;align-items:baseline;gap:8px}.name{font-weight:700;font-size:14px}.time{font-size:10px;color:var(--dim)}.content{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#dbdee1}.content .mention{background:rgba(88,101,242,.25);color:#c9cdfb;border-radius:3px;padding:0 2px}.reply-ref{font-size:11px;color:#949ba4;margin-bottom:3px;cursor:pointer}.reply-ref b{color:#c9cdfb}.msg-actions{display:none;position:absolute;right:8px;top:-12px;background:#1e1f22;border:1px solid #111;border-radius:6px;padding:3px}.msg:hover .msg-actions{display:flex}.msg-actions button{background:transparent;padding:4px 6px;color:#b5bac1;font-size:12px}.msg-actions button:hover{color:#fff}.attachment{margin-top:7px;max-width:420px;border-radius:7px;overflow:hidden;border:1px solid #45474e;background:#1e1f22}.attachment img{display:block;max-width:100%;max-height:330px}.filecard{padding:12px;display:flex;gap:10px;align-items:center}.composer{padding:0 18px 18px;background:#313338}.replybar{display:none;background:#1e1f22;border-radius:7px 7px 0 0;padding:8px 12px;color:var(--muted);font-size:11px}.replybar.show{display:flex}.replybar button{margin-left:auto;background:transparent;color:var(--muted)}.composebox{display:flex;align-items:center;gap:7px;background:#383a40;border-radius:8px;padding:4px 7px}.composebox textarea{flex:1;min-width:0;resize:none;max-height:120px;min-height:42px;padding:11px 5px;border:0;outline:0;background:transparent;color:#fff}.send{width:38px;height:38px;border-radius:7px;background:var(--blue);font-weight:700}.attach{width:38px;height:38px;border-radius:7px;background:transparent;color:var(--muted);font-size:22px}.typing{height:18px;color:#b5bac1;font-size:10px;padding:3px 5px}.members{background:#2b2d31;border-left:1px solid #25262a;padding:14px 10px;overflow:auto}.showMembers .members{display:block}.member-section{color:var(--dim);font-size:11px;font-weight:800;margin:9px 7px}.member{display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:5px}.member:hover{background:#35373c}.member .avatar{width:32px;height:32px}.membername{font-size:12px}.role{font-size:9px;color:var(--dim)}.empty{color:var(--dim);font-size:12px;padding:20px;text-align:center}
.mobilebar{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.card{width:min(520px,100%);max-height:90dvh;overflow:auto;background:#1e1f22;border-radius:10px;padding:20px;box-shadow:0 20px 60px #000}.card h2{margin:0 0 16px;font-size:18px}.field{width:100%;margin:7px 0 12px;padding:10px 12px;border-radius:5px;border:1px solid #111;background:#111214;color:#fff;outline:0}.rowbtn{display:flex;gap:8px}.primary{background:var(--blue);padding:10px 14px;border-radius:5px}.secondary{background:#4e5058;padding:10px 14px;border-radius:5px}.danger{background:var(--red);padding:10px 14px;border-radius:5px}.close{margin-left:auto;background:transparent;color:var(--muted);font-size:22px}.formline{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--muted);font-size:12px}.tabs{display:flex;gap:4px;margin-bottom:12px}.tab{padding:8px 10px;background:#2b2d31;border-radius:5px;color:var(--muted)}.tab.active{background:var(--blue);color:#fff}.notice{padding:10px;border-radius:6px;background:#2b2d31;color:var(--muted);font-size:12px;margin:7px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111214;border:1px solid #3b3d43;padding:10px 15px;border-radius:6px;z-index:2000;display:none}.toast.show{display:block}
@media(max-width:900px){.app{grid-template-columns:64px minmax(0,1fr)}.channels{display:none}.members{display:none}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:#1a1b1e;border-top:1px solid #0e0f10;z-index:100}.mobilebar button{flex:1;background:transparent;color:var(--muted);font-size:20px}.mobilebar span{display:block;font-size:9px}.mobilebar button.active{color:#fff}.servers{padding-bottom:70px}.chathead{padding-right:8px}.search{width:120px}.channel-topic{display:none}}
@media(max-width:600px){.app{grid-template-columns:54px minmax(0,1fr)}.servers{padding:8px 7px}.server{width:40px;height:40px;border-radius:13px}.server.active:before{left:-7px}.chathead{height:52px;padding:0 10px}.headtools .search{display:none}.messages{padding:12px 8px}.composer{padding:0 8px 70px}.msg-actions{display:none}.content{font-size:14px}.avatar{width:36px;height:36px}.msg .avatar{width:36px;height:36px}.card{padding:16px}.welcome{padding:45px 10px}}

/* ===== Security Lab mobile + UX patch ===== */
.connection{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);margin-right:4px;white-space:nowrap}
.connection-dot{width:8px;height:8px;border-radius:50%;background:#777}
.connection.ok .connection-dot{background:var(--green)}
.connection.bad .connection-dot{background:var(--red)}
.connection.busy .connection-dot{background:var(--mention)}
@media(max-width:900px){
  body.drawer-open:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:80}
  .channels,.members{z-index:90}
  body.mobile-channels .channels{display:flex;position:fixed;left:64px;top:0;bottom:60px;width:min(290px,calc(100vw - 64px));box-shadow:20px 0 50px rgba(0,0,0,.45)}
  body.mobile-members .members{display:block;position:fixed;right:0;top:0;bottom:60px;width:min(310px,calc(100vw - 54px));box-shadow:-20px 0 50px rgba(0,0,0,.45)}
  .mobilebar{box-shadow:0 -5px 20px rgba(0,0,0,.25)}
}
@media(max-width:600px){
  body.mobile-channels .channels{left:54px;width:calc(100vw - 54px)}
  .connection{display:none}
  .chathead{gap:7px}
  .channel-title{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .composebox{padding:3px 5px}
  .send,.attach{width:36px;height:36px}
  .send{font-size:14px}
  .modal{padding:10px}
  .card{max-height:86dvh}
  .rowbtn{flex-wrap:wrap}
  .rowbtn button{flex:1;min-width:110px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="servers" id="servers">
  <button class="server active" id="homeBtn" title="好友 / 私信">⌂</button>
</aside>
  <aside class="channels">
    <div class="server-head"><span id="serverName">Security Lab</span><button id="serverMenu">⌄</button></div>
    <div class="channel-list" id="channelList"></div>
    <div class="userbar">
      <div class="userbox"><div class="avatar" id="meAvatar">游</div><i class="presence"></i></div>
      <div class="me"><b id="meName">游客</b><span id="meStatus">在线</span></div>
      <button class="iconbtn" id="friendsBtn" title="好友与私信">👥</button><button class="iconbtn" id="profileBtn">⚙</button>
    </div>
  </aside>
  <main class="chat">
    <header class="chathead">
      <b style="color:#949ba4;font-size:22px">#</b>
      <div class="channel-title" id="channelTitle">总聊天室</div>
      <div class="channel-topic" id="channelTopic">Security Lab Community</div>
      <div class="headtools">
        <input class="search" id="search" placeholder="搜索消息">
        <button class="iconbtn" id="membersBtn">👥</button>
        <button class="iconbtn" id="noticeBtn">🔔</button>
      </div>
    </header>
    <section class="messages" id="messages"></section>
    <div class="composer">
      <div class="replybar" id="replyBar"><span id="replyText"></span><button id="cancelReply">×</button></div>
      <div class="typing" id="typing"></div>
      <div class="composebox">
        <button class="attach" id="attachBtn">＋</button>
        <input type="file" id="fileInput" hidden accept="image/*,.pdf,.txt,.md,.json,.zip,.rar">
        <textarea id="messageInput" rows="1" maxlength="4000" placeholder="发送消息…"></textarea>
        <button class="send" id="sendBtn">➤</button>
      </div>
    </div>
  </main>
  <aside class="members" id="members"></aside>
</div>
<nav class="mobilebar">
  <button id="mServers">◈<span>服务器</span></button>
  <button id="mChannels">☰<span>频道</span></button>
  <button id="mMembers">👥<span>成员</span></button>
  <button id="mProfile">●<span>我的</span></button>
</nav>


<div class="modal" id="friendsModal"><div class="card">
 <div style="display:flex;align-items:center"><h2>👥 好友与私信</h2><button class="close" data-close>×</button></div>
 <input class="field" id="userSearch" placeholder="搜索昵称或用户 ID">
 <div class="rowbtn"><button class="primary" id="userSearchBtn">搜索用户</button></div>
 <div id="userResults" style="margin-top:10px"></div>
 <div class="member-section" style="margin-top:16px">我的好友</div>
 <div id="friendList"></div>
</div></div>
<div class="modal" id="authModal">
 <div class="card">
  <div style="display:flex;align-items:center"><h2 id="authTitle">登录</h2><button class="close" data-close>×</button></div>
  <div class="tabs"><button class="tab active" id="loginTab">登录</button><button class="tab" id="signupTab">注册</button></div>
  <input class="field" id="email" type="email" placeholder="邮箱">
  <input class="field" id="password" type="password" placeholder="密码">
  <input class="field" id="displayName" placeholder="昵称（注册时）" style="display:none">
  <div class="rowbtn"><button class="primary" id="authSubmit">登录</button><button class="secondary" data-close>取消</button></div>
  <div class="notice" id="authNotice">使用 Supabase Auth 登录。登录后可使用服务器、频道、好友、私信、文件和管理员功能。</div>
 </div>
</div>

<div class="modal" id="profileModal">
 <div class="card">
  <div style="display:flex;align-items:center"><h2>个人资料</h2><button class="close" data-close>×</button></div>
  <input class="field" id="pName" maxlength="30" placeholder="昵称">
  <input class="field" id="pAvatar" placeholder="头像 URL（可留空）">
  <textarea class="field" id="pBio" maxlength="150" rows="3" placeholder="个性签名"></textarea><div class="notice">用户 ID：<code id="pId"></code></div>
  <div class="rowbtn"><button class="primary" id="saveProfile">保存</button><button class="danger" id="logout">退出登录</button></div>
 </div>
</div>

<div class="modal" id="serverModal"><div class="card">
 <div style="display:flex;align-items:center"><h2>服务器</h2><button class="close" data-close>×</button></div>
 <input class="field" id="serverInput" placeholder="服务器名称">
 <div class="rowbtn"><button class="primary" id="createServer">创建服务器</button></div>
 <div class="notice">创建后可使用文字频道、成员列表、未读消息、回复、编辑、删除、文件上传和管理员功能。</div>
</div></div>

<div class="modal" id="noticeModal"><div class="card">
 <div style="display:flex;align-items:center"><h2>通知</h2><button class="close" data-close>×</button></div>
 <div id="noticeList"></div>
</div></div>

<div class="modal" id="adminModal"><div class="card">
 <div style="display:flex;align-items:center"><h2>管理员面板</h2><button class="close" data-close>×</button></div>
 <div id="adminBody"></div>
</div></div>

<div class="modal" id="channelModal"><div class="card">
 <div style="display:flex;align-items:center"><h2>新建频道</h2><button class="close" data-close>×</button></div>
 <input class="field" id="channelInput" placeholder="频道名称">
 <div class="rowbtn"><button class="primary" id="createChannel">创建</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const SB_URL="https://lnducpwbmyjhnnjkqyxq.supabase.co";
const SB_KEY="sb_publishable_aukve7aK4EQCniOtCSy8uQ_raK8MH0j";
let sb=null,user=null,profile=null,servers=[],channels=[],currentServer=null,currentChannel=null,messages=[],replyTo=null,typingTimer=null,realtime=[],dmUser=null,homeMode=true;
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const setConnection=(state,text)=>{
  const e=$("connectionStatus"); if(!e)return;
  e.className="connection "+state;
  e.querySelector("span").textContent=text;
};
const closeMobileDrawers=()=>{
  document.body.classList.remove("drawer-open","mobile-channels","mobile-members");
};
const openMobileDrawer=(type)=>{
  document.body.classList.remove("mobile-channels","mobile-members");
  document.body.classList.add("drawer-open",type==="channels"?"mobile-channels":"mobile-members");
};
document.addEventListener("click",e=>{
  if(document.body.classList.contains("drawer-open") && e.target===document.body) closeMobileDrawers();
});
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)};
const openModal=id=>$(id).classList.add("show"), closeAll=()=>document.querySelectorAll(".modal").forEach(x=>x.classList.remove("show"));
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
function avatarHTML(p){const name=p?.display_name||"游";return p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc(name.slice(0,1))}

async function openHome(){
  homeMode=true;dmUser=null;currentServer=null;currentChannel=null;closeMobileDrawers();
  $("serverName").textContent="好友";
  $("channelList").innerHTML=`<div class="cat">好友</div><button class="chan active" id="friendsOpen">👥 好友列表</button><button class="chan" id="searchPeople">🔎 找用户</button>`;
  $("channelTitle").textContent="好友 / 私信";$("channelTopic").textContent="和朋友聊天";
  showWelcome("选择好友开始私信。");
  $("members").innerHTML='<div class="member-section">好友</div><div class="empty">打开好友列表查看联系人</div>';
  $("friendsOpen").onclick=()=>openFriends();
  $("searchPeople").onclick=()=>openFriends();
  renderServers();
}
async function openFriends(){
 if(!user){ensureAuth();return}
 const r=await sb.from("friendships").select("requester_id,addressee_id,status,profiles_requester:requester_id(id,display_name,avatar_url),profiles_addressee:addressee_id(id,display_name,avatar_url)").or(`requester_id.eq.${user.id},addressee_id.eq.${user.id}`);
 const rows=r.data||[];
 $("friendList").innerHTML=rows.map(x=>{
   const mine=x.requester_id===user.id; const p=mine?x.profiles_addressee:x.profiles_requester;
   if(x.status==="accepted") return `<div class="member" data-dm="${p.id}" style="cursor:pointer"><div class="avatar">${avatarHTML(p)}</div><div><div class="membername">${esc(p.display_name)}</div><div class="role">私信</div></div></div>`;
   if(!mine && x.status==="pending") return `<div class="member"><div class="avatar">${avatarHTML(p)}</div><div style="flex:1"><div class="membername">${esc(p.display_name)}</div><div class="role">好友请求</div></div><button class="primary" style="padding:5px 8px;font-size:10px" data-accept="${x.id}">接受</button></div>`;
   return `<div class="member"><div class="avatar">${avatarHTML(p)}</div><div><div class="membername">${esc(p.display_name)}</div><div class="role">等待对方接受</div></div></div>`;
 }).join("")||'<div class="empty">还没有好友</div>';
 $("userResults").innerHTML="";
 document.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{closeAll();openDM(b.dataset.dm)});
 openModal("friendsModal");document.querySelectorAll("[data-accept]").forEach(b=>b.onclick=()=>acceptFriend(b.dataset.accept));
}
async function searchUsers(){
 if(!user)return ensureAuth();
 const q=$("userSearch").value.trim();if(!q)return;
 const r=await sb.from("profiles").select("id,display_name,avatar_url,bio").or(`display_name.ilike.%${q}%,id.eq.${q}`).neq("id",user.id).limit(10);
 $("userResults").innerHTML=(r.data||[]).map(p=>`<div class="member"><div class="avatar">${avatarHTML(p)}</div><div style="flex:1"><div class="membername">${esc(p.display_name)}</div><div class="role">${esc(p.id)}</div></div><button class="primary" style="padding:5px 8px;font-size:10px" data-addfriend="${p.id}">加好友</button><button class="secondary" style="padding:5px 8px;font-size:10px" data-open-dm="${p.id}">私信</button></div>`).join("")||'<div class="empty">没有找到用户</div>';
 document.querySelectorAll("[data-addfriend]").forEach(b=>b.onclick=()=>addFriend(b.dataset.addfriend));
 document.querySelectorAll("[data-open-dm]").forEach(b=>b.onclick=()=>{closeAll();openDM(b.dataset.openDm)});
}
async function acceptFriend(id){const r=await sb.from("friendships").update({status:"accepted"}).eq("id",id).eq("addressee_id",user.id);if(r.error)toast(r.error.message);else{toast("已成为好友");await openFriends()}}
async function addFriend(uid){
 const r=await sb.from("friendships").upsert({requester_id:user.id,addressee_id:uid,status:"pending"},{onConflict:"requester_id,addressee_id"});
 if(r.error)toast(r.error.message);else toast("好友请求已发送");
}
async function openDM(uid){
 const r=await sb.from("profiles").select("*").eq("id",uid).single();if(r.error)return toast(r.error.message);
 dmUser=r.data;homeMode=true;$("serverName").textContent="私信";$("channelTitle").textContent=dmUser.display_name;$("channelTopic").textContent="直接消息 · "+dmUser.id;
 $("channelList").innerHTML=`<div class="cat">私信</div><button class="chan active">💬 ${esc(dmUser.display_name)}</button>`;
 await loadDM();subscribeDM();
}
async function loadDM(){
 const r=await sb.from("direct_messages").select("*,sender:sender_id(id,display_name,avatar_url),receiver:receiver_id(id,display_name,avatar_url)").or(`and(sender_id.eq.${user.id},receiver_id.eq.${dmUser.id}),and(sender_id.eq.${dmUser.id},receiver_id.eq.${user.id})`).order("created_at",{ascending:true}).limit(200);
 if(r.error)return toast(r.error.message);
 messages=(r.data||[]).map(m=>({...m,user_id:m.sender_id,content:m.content,profiles:m.sender}));
 renderMessages();
}
function subscribeDM(){
 realtime.forEach(x=>sb.removeChannel(x));realtime=[];
 const ch=sb.channel("dm-"+user.id+"-"+dmUser.id).on("postgres_changes",{event:"*",schema:"public",table:"direct_messages"},loadDM).subscribe();realtime.push(ch);
}
async function sendDM(){
 const input=$("messageInput"),content=input.value.trim();if(!content||!dmUser)return;
 const r=await sb.from("direct_messages").insert({sender_id:user.id,receiver_id:dmUser.id,content});
 if(r.error)toast(r.error.message);else{input.value="";autoResize();await sb.from("notifications").insert({user_id:dmUser.id,content:`${profile?.display_name||"有人"} 给你发来了一条私信`})}
}

async function init(){
 const mod=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");sb=mod.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data:{session}}=await sb.auth.getSession();user=session?.user||null;
 sb.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;await afterAuth()});
 await afterAuth();
}
async function afterAuth(){
 if(!user){profile=null;renderMe();renderServers();showWelcome("请登录或注册后加入社区");openModal("authModal");return}
 await ensureProfile();await sb.rpc("touch_presence");await loadServers();
}
async function ensureProfile(){
 let r=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(!r.data){await sb.from("profiles").insert({id:user.id,display_name:user.email?.split("@")[0]||"用户"});r=await sb.from("profiles").select("*").eq("id",user.id).single()}
 profile=r.data;
}
function renderMe(){$("meName").textContent=profile?.display_name||"游客";$("meStatus").textContent=user?"在线":"未登录";$("meAvatar").innerHTML=avatarHTML(profile)}
async function loadServers(){
 const r=await sb.from("server_members").select("server_id,role,servers(id,name,icon_url)").eq("user_id",user.id);
 if(r.error){toast(r.error.message);return}
 servers=(r.data||[]).map(x=>({...x.servers,role:x.role}));
 renderServers();
 if(!currentServer||!servers.some(x=>x.id===currentServer.id)){currentServer=servers[0]||null}
 if(currentServer){homeMode=false;await loadChannels();await selectChannel(currentChannel?.id||channels[0]?.id)}
 else showWelcome("还没有加入服务器。点击 ＋ 创建第一个服务器。");
}
function renderServers(){
 $("homeBtn").classList.toggle("active",homeMode && !currentServer);
 $("servers").innerHTML=`<button class="server ${homeMode && !currentServer?"active":""}" id="homeServer" title="好友 / 私信">⌂</button>`+servers.map(s=>`<button class="server ${currentServer?.id===s.id&&!homeMode?"active":""}" title="${esc(s.name)}" data-id="${s.id}">${s.icon_url?`<img src="${esc(s.icon_url)}">`:esc((s.name||"S")[0])}</button>`).join("")+`<button class="server add" id="addServer">＋</button>`;
 document.querySelectorAll(".server[data-id]").forEach(b=>b.onclick=async()=>{currentServer=servers.find(s=>s.id===b.dataset.id);homeMode=false;dmUser=null;closeMobileDrawers();renderServers();await loadChannels();await selectChannel(channels[0]?.id)});
 $("addServer").onclick=()=>openModal("serverModal");$("homeServer").onclick=openHome;
}
async function loadChannels(){
 if(!currentServer)return;const r=await sb.from("channels").select("*").eq("server_id",currentServer.id).order("position");
 if(r.error){toast(r.error.message);return}channels=r.data||[];$("serverName").textContent=currentServer.name;renderChannels();closeMobileDrawers();
}

async function updateUnreadCounts(){
 if(!user||!channels.length)return;
 const states=await sb.from("read_states").select("channel_id,last_read_at").eq("user_id",user.id).in("channel_id",channels.map(c=>c.id));
 const sm=new Map((states.data||[]).map(x=>[x.channel_id,x.last_read_at]));
 for(const c of channels){
   if(c.id===currentChannel?.id){$("unread-"+c.id)?.replaceChildren();continue}
   const since=sm.get(c.id)||new Date(0).toISOString();
   const r=await sb.from("messages").select("id",{count:"exact",head:true}).eq("channel_id",c.id).gt("created_at",since);
   const el=$("unread-"+c.id);if(el)el.textContent=r.count?String(Math.min(r.count,99)):"";
 }
}

function renderChannels(){
 $("channelList").innerHTML=`<div class="cat">文字频道 <button id="addChannel" style="background:none;color:#949ba4">＋</button></div>`+channels.map(c=>`<button class="chan ${currentChannel?.id===c.id?"active":""}" data-id="${c.id}"><span>#</span>${esc(c.name)}<span class="count" id="unread-${c.id}"></span></button>`).join("")+`<div class="cat" style="margin-top:10px">管理</div><button class="chan" id="adminOpen">⚙ 管理员面板</button>`;
 document.querySelectorAll(".chan[data-id]").forEach(b=>b.onclick=()=>selectChannel(b.dataset.id));
 $("addChannel").onclick=()=>openModal("channelModal");$("adminOpen").onclick=()=>openAdmin();updateUnreadCounts();
}
async function selectChannel(id){
 if(!id)return;currentChannel=channels.find(c=>c.id===id);renderChannels();$("channelTitle").textContent=currentChannel?.name||"频道";$("channelTopic").textContent=currentChannel?.topic||"";
 await loadMessages();subscribeRealtime();await markRead();
}
async function loadMessages(){
 if(!currentChannel)return;const r=await sb.from("messages").select("id,server_id,channel_id,user_id,content,created_at,reply_to,attachment_url,attachment_name,profiles:user_id(id,display_name,avatar_url)").eq("channel_id",currentChannel.id).order("created_at",{ascending:true}).limit(200);
 if(r.error){toast(r.error.message);return}messages=r.data||[];renderMessages();
}
function renderMessages(){
 const box=$("messages");if(!messages.length){showWelcome("还没有消息，发送第一条吧 👋");return}
 const q=$("search").value.trim().toLowerCase();const data=q?messages.filter(m=>(m.content||"").toLowerCase().includes(q)):messages;
 box.innerHTML=data.map(m=>{
  const p=m.profiles||{};const reply=m.reply_to?messages.find(x=>x.id===m.reply_to):null;
  const att=m.attachment_url?`<div class="attachment">${m.attachment_url.match(/\.(png|jpg|jpeg|gif|webp)(\?|$)/i)?`<img src="${esc(m.attachment_url)}">`:`<div class="filecard">📎 <a href="${esc(m.attachment_url)}" target="_blank" rel="noopener">${esc(m.attachment_name||"文件")}</a></div>`}</div>`:"";
  const content=esc(m.content||"").replace(/@([\w\u4e00-\u9fff-]+)/g,'<span class="mention">@$1</span>');
  return `<article class="msg ${reply?"reply":""}" data-id="${m.id}"><div class="avatar">${avatarHTML(p)}</div><div class="body">${reply?`<div class="reply-ref">↩ 回复 <b>${esc(reply.profiles?.display_name||"用户")}</b></div>`:""}<div class="msgtop"><span class="name">${esc(p.display_name||"用户")}</span><span class="time">${new Date(m.created_at).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div><div class="content">${content}</div>${att}<div class="msg-actions"><button data-reply="${m.id}">↩</button><button data-copy="${m.id}">复制</button>${!dmUser && m.user_id===user?.id?`<button data-edit="${m.id}">编辑</button><button data-del="${m.id}">删除</button>`:""}</div></div></article>`}).join("");
 box.scrollTop=box.scrollHeight;
 box.querySelectorAll("[data-reply]").forEach(b=>b.onclick=()=>startReply(messages.find(m=>m.id===b.dataset.reply)));
 box.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(messages.find(m=>m.id===b.dataset.copy)?.content||"");toast("已复制")});
 box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteMessage(b.dataset.del));
 box.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editMessage(b.dataset.edit));
}

async function markRead(){
 if(!user||!currentChannel)return;
 await sb.from("read_states").upsert({user_id:user.id,channel_id:currentChannel.id,last_read_at:new Date().toISOString()});updateUnreadCounts();
}

function showWelcome(t){$("messages").innerHTML=`<div class="welcome"><h3>Security Lab</h3><p>${esc(t)}</p></div>`}
function startReply(m){if(!m)return;replyTo=m;$("replyText").textContent=`回复 ${m.profiles?.display_name||"用户"}：${m.content||""}`;$("replyBar").classList.add("show");$("messageInput").focus()}
$("cancelReply").onclick=()=>{replyTo=null;$("replyBar").classList.remove("show")};
async function sendMessage(){
 if(dmUser){return sendDM()}
 const input=$("messageInput"),content=input.value.trim();if(!content||!currentChannel)return;
 if(!user){openModal("authModal");return}
 let payload={server_id:currentServer.id,channel_id:currentChannel.id,user_id:user.id,content,reply_to:replyTo?.id||null};
 const r=await sb.from("messages").insert(payload).select("id").single();
 if(r.error){toast("发送失败："+r.error.message);return}
 input.value="";autoResize();$("cancelReply").click();
 const names=[...content.matchAll(/@([\w\u4e00-\u9fff-]+)/g)].map(x=>x[1]);
 if(names.length){const ps=await sb.from("profiles").select("id,display_name").in("display_name",names);for(const p of (ps.data||[])){await sb.from("notifications").insert({user_id:p.id,content:`${profile?.display_name||"有人"} 在 #${currentChannel.name} 中提到了你`});}}
}
async function deleteMessage(id){if(!confirm("删除这条消息？"))return;const r=await sb.from("messages").delete().eq("id",id);if(r.error)toast(r.error.message);else toast("已删除")}
async function editMessage(id){const m=messages.find(x=>x.id===id);if(!m)return;const v=prompt("编辑消息",m.content||"");if(v===null)return;const r=await sb.from("messages").update({content:v}).eq("id",id).eq("user_id",user.id);if(r.error)toast(r.error.message)}
async function uploadFile(file){
 if(!file||!user)return;const path=`${user.id}/${crypto.randomUUID()}-${file.name.replace(/[^\\w.\\-]/g,"_")}`;const r=await sb.storage.from("chat-files").upload(path,file,{upsert:false});
 if(r.error){toast("上传失败："+r.error.message);return}
 const p=sb.storage.from("chat-files").getPublicUrl(path);return {url:p.data.publicUrl,name:file.name}
}
$("attachBtn").onclick=()=>$("fileInput").click();
$("fileInput").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>20*1024*1024){toast("文件最大 20MB");return}const a=await uploadFile(f);if(a){const r=await sb.from("messages").insert({server_id:currentServer.id,channel_id:currentChannel.id,user_id:user.id,content:"",attachment_url:a.url,attachment_name:a.name});if(r.error)toast(r.error.message)}e.target.value=""};
$("sendBtn").onclick=sendMessage;
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
$("messageInput").addEventListener("input",autoResize);
function autoResize(){const x=$("messageInput");x.style.height="42px";x.style.height=Math.min(x.scrollHeight,120)+"px"}
$("search").oninput=renderMessages;
function subscribeRealtime(){
 realtime.forEach(x=>sb.removeChannel(x));realtime=[];
 if(!currentChannel)return;
 const ch=sb.channel("channel-"+currentChannel.id).on("postgres_changes",{event:"*",schema:"public",table:"messages",filter:"channel_id=eq."+currentChannel.id},loadMessages).subscribe();realtime.push(ch);
 const tc=sb.channel("typing-"+currentChannel.id).on("broadcast",{event:"typing"},p=>{if(p.payload?.user_id!==user?.id){$("typing").textContent=(p.payload?.name||"有人")+" 正在输入…";clearTimeout(typingTimer);typingTimer=setTimeout(()=>$("typing").textContent="",1500)}}).subscribe();realtime.push(tc);
}
$("messageInput").addEventListener("input",()=>{if(user&&currentChannel&&realtime[1])realtime[1].send({type:"broadcast",event:"typing",payload:{user_id:user.id,name:profile?.display_name}})});
async function ensureAuth(){if(!user)openModal("authModal")}
let authMode="login";$("loginTab").onclick=()=>setAuthMode("login");$("signupTab").onclick=()=>setAuthMode("signup");
function setAuthMode(m){authMode=m;$("loginTab").classList.toggle("active",m==="login");$("signupTab").classList.toggle("active",m==="signup");$("authTitle").textContent=m==="login"?"登录":"注册";$("authSubmit").textContent=m==="login"?"登录":"注册";$("displayName").style.display=m==="signup"?"block":"none"}
$("authSubmit").onclick=async()=>{
 const email=$("email").value.trim(),password=$("password").value,display=$("displayName").value.trim();
 if(!email||!password)return toast("请填写邮箱和密码");
 let r=authMode==="login"?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{data:{display_name:display||email.split("@")[0]}}});
 if(r.error){$("authNotice").textContent=r.error.message;return}
 $("authNotice").textContent=authMode==="signup"&&!r.data.session?"注册成功，请查收邮箱确认":"成功";if(r.data.session)closeAll();
};
$("userSearchBtn").onclick=searchUsers;
$("userSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();searchUsers()}});
$("friendsBtn").onclick=()=>openFriends();
$("homeBtn").onclick=()=>openHome();
$("profileBtn").onclick=()=>{if(!user)return ensureAuth();$("pName").value=profile?.display_name||"";$("pId").textContent=user.id;$("pAvatar").value=profile?.avatar_url||"";$("pBio").value=profile?.bio||"";openModal("profileModal")};
$("saveProfile").onclick=async()=>{const v={display_name:$("pName").value.trim()||"用户",avatar_url:$("pAvatar").value.trim()||null,bio:$("pBio").value.trim()||null};const r=await sb.from("profiles").update(v).eq("id",user.id);if(r.error)toast(r.error.message);else{profile={...profile,...v};renderMe();closeAll();toast("资料已保存")}};
$("logout").onclick=async()=>{await sb.auth.signOut();closeAll()};
$("createServer").onclick=async()=>{
 if(!user)return ensureAuth();const name=$("serverInput").value.trim();if(!name)return;
 const r=await sb.rpc("create_server",{server_name:name});if(r.error){toast(r.error.message);return}$("serverInput").value="";closeAll();await loadServers();toast("服务器已创建");
};
$("createChannel").onclick=async()=>{const name=$("channelInput").value.trim();if(!name||!currentServer)return;const r=await sb.rpc("create_channel",{p_server_id:currentServer.id,p_name:name});if(r.error)toast(r.error.message);else{closeAll();await loadChannels();await selectChannel(channels.at(-1)?.id)}};
$("serverMenu").onclick=()=>openAdmin();
$("noticeBtn").onclick=async()=>{if(!user)return ensureAuth();const r=await sb.from("notifications").select("*").eq("user_id",user.id).order("created_at",{ascending:false}).limit(50);$("noticeList").innerHTML=(r.data||[]).map(n=>`<div class="notice">${esc(n.content)}<br><small>${new Date(n.created_at).toLocaleString("zh-CN")}</small></div>`).join("")||'<div class="empty">暂无通知</div>';openModal("noticeModal")};
$("membersBtn").onclick=async()=>{if(!user)return ensureAuth();await loadMembers();document.body.classList.toggle("showMembers");};
async function openAdmin(){
 if(!user||!currentServer)return;const me=servers.find(s=>s.id===currentServer.id);if(!["owner","admin","moderator"].includes(me?.role)){toast("你没有管理员权限");return}
 $("adminBody").innerHTML=`<div class="notice">当前服务器：${esc(currentServer.name)}<br>你的权限：${esc(me.role)}</div><h3>成员管理</h3><div id="adminMembers">加载中…</div>`;
 openModal("adminModal");
 const r=await sb.from("server_members").select("user_id,role,muted_until,profiles:user_id(display_name,avatar_url,status,last_seen)").eq("server_id",currentServer.id);
 $("adminMembers").innerHTML=(r.data||[]).map(m=>`<div class="member"><div class="avatar">${avatarHTML(m.profiles)}</div><div style="flex:1"><div class="membername">${esc(m.profiles?.display_name||"用户")}</div><div class="role">${m.profiles?.status==="online"?"🟢 在线":"⚫ 离线"} · ${esc(m.role)}</div></div>${m.user_id!==user.id?`<button class="danger" style="padding:5px 7px;font-size:10px" data-ban="${m.user_id}">封禁</button>`:""}</div>`).join("");
 document.querySelectorAll("[data-ban]").forEach(b=>b.onclick=()=>banUser(b.dataset.ban));
 document.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>kickUser(b.dataset.kick));
 document.querySelectorAll("[data-mute]").forEach(b=>b.onclick=()=>muteUser(b.dataset.mute));
}

async function kickUser(uid){
 if(!confirm("确定踢出该成员？"))return;
 const r=await sb.rpc("kick_member",{p_server_id:currentServer.id,p_user_id:uid});
 if(r.error)toast(r.error.message);else{toast("已踢出");await loadMembers();await openAdmin()}
}
async function muteUser(uid){
 const mins=parseInt(prompt("禁言多少分钟？输入 0 解除禁言","10"),10);if(Number.isNaN(mins))return;
 const r=await sb.rpc("mute_member",{p_server_id:currentServer.id,p_user_id:uid,p_minutes:mins});
 if(r.error)toast(r.error.message);else{toast(mins?"已禁言":"已解除禁言");await openAdmin()}
}

async function banUser(uid){const reason=prompt("封禁原因","违反社区规则")||"";const r=await sb.from("bans").upsert({server_id:currentServer.id,user_id:uid,reason,created_by:user.id});if(r.error)toast(r.error.message);else toast("已封禁")}
async function loadMembers(){
 if(!currentServer)return;$("members").innerHTML=`<div class="member-section">成员</div><div class="empty">加载中…</div>`;
 const r=await sb.from("server_members").select("user_id,role,muted_until,profiles:user_id(display_name,avatar_url,status,last_seen)").eq("server_id",currentServer.id);
 if(r.error){$("members").innerHTML='<div class="empty">无法加载成员</div>';return}
 $("members").innerHTML=`<div class="member-section">成员 — ${(r.data||[]).length}</div>`+(r.data||[]).map(m=>`<div class="member"><div class="avatar">${avatarHTML(m.profiles)}</div><div><div class="membername">${esc(m.profiles?.display_name||"用户")}</div><div class="role">${m.profiles?.status==="online"?"🟢 在线":"⚫ 离线"} · ${esc(m.role)}</div></div></div>`).join("");
}
const oldLoadChannels=loadChannels;
const _loadChannels=async()=>{await oldLoadChannels();await loadMembers()};
// override via wrapper
loadChannels=_loadChannels;
$("mServers").onclick=()=>{closeMobileDrawers();toast("服务器列表在左侧")};
$("mChannels").onclick=()=>{openMobileDrawer("channels")};
$("mMembers").onclick=async()=>{if(!user)return ensureAuth();await loadMembers();openMobileDrawer("members")};
$("mProfile").onclick=()=>$("profileBtn").click();
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
setInterval(()=>{if(sb&&user)sb.rpc("touch_presence")},30000);
init().catch(e=>{console.error(e);toast("初始化失败")});
</script>
</body></html>
