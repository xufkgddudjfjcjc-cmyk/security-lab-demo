* {

}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #020b06;
    color: #00ff66;

body {
    overflow-x: hidden;

/* =========================
   Matrix 背景
========================= */

#matrix {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: #020b06;
}

/* =========================
   页面
========================= */

.page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 25px 15px;
}

/* =========================
   顶部
========================= */

.header {
    max-width: 1100px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 20px;

    border: 1px solid rgba(0,255,102,.35);
    border-radius: 14px;

    background: rgba(0,15,8,.88);

    backdrop-filter: blur(8px);
}

.logo {
    font-size: 22px;
    font-weight: bold;

    text-shadow:

}

.status {
    font-size: 14px;
}

.status-dot {
    display: inline-block;

    width: 9px;
    height: 9px;

    background: #00ff66;

    border-radius: 50%;

    box-shadow:
        0 0 12px #00ff66;

    margin-right: 6px;
}

/* =========================
   主区域
========================= */

.container {
    max-width: 1100px;
    margin: 35px auto;
}

   登录 / 用户
========================= */

.login-box {
    max-width: 600px;

    text-align: center;

    font-size: 40px;

    margin:

    text-shadow:
        0 0 20px #00ff66;
}

.subtitle {
    text-align: center;

    color: #72ffad;

    margin-bottom: 30px;
}

    outline: none;

    background:
        rgba(0,0,0,.6);

    color: #00ff66;

    font-size: 16px;
}

.input::placeholder {
    color: #4d996b;
}

.input:focus {
    border-color: #00ff66;

    box-shadow:
        0 0 12px

}
