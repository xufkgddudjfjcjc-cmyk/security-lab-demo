<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Security Lab</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#020817;
    --panel:rgba(5,22,50,.82);
    --panel2:rgba(8,31,65,.76);
    --line:rgba(78,166,255,.28);

    --accent:#3b82f6;
    --accent2:#22d3ee;
    --purple:#8b5cf6;

    --green:#22c55e;
    --text:#eef6ff;
    --text2:#b9cee6;
    --muted:#7893b3;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    background:var(--bg);
    color:var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        "Microsoft YaHei",
        sans-serif;
}

body{
    overflow:hidden;
}

/* =====================================================
   动态星空
===================================================== */

#space{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:0;

    background:
        radial-gradient(
            circle at 50% 50%,
            #09265c 0%,
            #031637 42%,
            #010817 78%,
            #00030a 100%
        );
}

.ambient{
    position:fixed;

    width:380px;
    height:380px;

    border-radius:50%;

    pointer-events:none;

    z-index:0;

    filter:blur(95px);

    opacity:.25;

    animation:
        floatLight
        9s
        ease-in-out
        infinite
        alternate;
}

.ambient.one{
    background:var(--accent);

    left:5%;
    top:12%;
}

.ambient.two{
    background:var(--purple);

    right:5%;
    top:25%;

    animation-delay:-3s;
}

.ambient.three{
    background:var(--accent2);

    left:38%;
    bottom:-120px;

    animation-delay:-6s;
}

@keyframes floatLight{

    from{
        transform:
            translate3d(-20px,-15px,0)
            scale(.9);
    }

    to{
        transform:
            translate3d(25px,20px,0)
            scale(1.12);
    }

}

/* =====================================================
   地球
===================================================== */

.globe-layer{
    position:fixed;

    inset:0;

    z-index:0;

    pointer-events:none;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

#globe{
    width:min(720px,75vw);
    height:min(720px,75vw);

    opacity:.78;

    filter:
        drop-shadow(
            0 0 30px
            rgba(38,160,255,.25)
        )
        drop-shadow(
            0 0 100px
            rgba(0,110,255,.18)
        );
}

/* =====================================================
   APP
===================================================== */

.app{
    position:relative;

    z-index:2;

    width:100vw;
    height:100vh;

    display:grid;

    grid-template-columns:
        230px
        minmax(0,1fr)
        300px;

    gap:14px;

    padding:14px;
}

.sidebar,
.chat,
.profile{

    position:relative;

    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );

    border:
        1px solid
        var(--line);

    box-shadow:
        inset
        0 0 40px
        rgba(37,99,235,.06),

        0 20px 70px
        rgba(0,0,0,.32);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    overflow:hidden;
}

/* =====================================================
   左侧
===================================================== */

.sidebar{

    border-radius:24px;

    padding:18px 12px;

    display:flex;

    flex-direction:column;
}

.brand{

    display:flex;

    align-items:center;

    gap:11px;

    padding:
        8px
        10px
        22px;
}

.brand-icon{

    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--purple)
        );

    box-shadow:
        0 0 25px
        rgba(79,70,229,.55);

    font-size:20px;
}

.brand-name{

    font-size:16px;

    font-weight:800;
}

.brand-sub{

    color:var(--muted);

    font-size:10px;

    margin-top:3px;
}

.section-title{

    padding:10px;

    color:#7090b4;

    font-size:10px;

    font-weight:800;

    letter-spacing:.12em;
}

.channel{

    display:flex;

    align-items:center;

    gap:10px;

    margin:3px 0;

    padding:11px 12px;

    border-radius:12px;

    color:#9bb2cf;

    cursor:pointer;

    transition:.2s;
}

.channel:hover{

    background:
        rgba(37,99,235,.12);

    color:#dcebff;
}

.channel.active{

    color:white;

    background:
        linear-gradient(
            90deg,
            rgba(37,99,235,.42),
            rgba(79,70,229,.22)
        );

    border:
        1px solid
        rgba(70,150,255,.35);

    box-shadow:
        0 0 20px
        rgba(37,99,235,.15);
}

.channel-icon{

    color:#70b7ff;

    font-size:17px;
}

.sidebar-bottom{

    margin-top:auto;
}

.mini-status{

    display:flex;

    align-items:center;

    gap:8px;

    padding:12px;

    border:
        1px solid
        rgba(52,211,153,.18);

    border-radius:12px;

    background:
        rgba(16,185,129,.05);

    color:#8db1ad;

    font-size:11px;
}

.green-dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 8px
        var(--green),

        0 0 16px
        rgba(34,197,94,.55);

    flex:none;
}

/* =====================================================
   CHAT
===================================================== */

.chat{

    border-radius:24px;

    display:flex;

    flex-direction:column;

    min-width:0;
}

.chat-header{

    height:76px;

    flex:none;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0
        18px
        0
        22px;

    border-bottom:
        1px solid
        rgba(80,150,220,.18);

    background:
        rgba(3,18,45,.4);
}

.chat-title{

    display:flex;

    align-items:center;

    gap:11px;

    min-width:0;
}

.hash{

    font-size:25px;

    color:#62aefc;
}

.chat-name{

    font-size:16px;

    font-weight:800;
}

.chat-description{

    color:#7795b8;

    font-size:10px;

    margin-top:3px;
}

.header-actions{

    display:flex;

    align-items:center;

    gap:7px;
}

.header-btn{

    width:37px;
    height:37px;

    border:
        1px solid
        rgba(80,150,220,.25);

    border-radius:11px;

    background:
        rgba(11,38,76,.6);

    color:#bdd4ee;

    cursor:pointer;

    transition:.18s;
}

.header-btn:hover{

    background:
        rgba(37,99,235,.28);

    border-color:#4b9cff;
}

.connection{

    display:flex;

    align-items:center;

    gap:7px;

    color:#a8c0dc;

    font-size:12px;
}

/* =====================================================
   SEARCH
===================================================== */

.search-bar{

    display:none;

    padding:
        10px
        18px;

    border-bottom:
        1px solid
        rgba(80,150,220,.18);

    background:
        rgba(2,15,38,.48);
}

.search-bar.show{

    display:flex;

    gap:8px;
}

.search-input{

    flex:1;

    min-width:0;

    padding:10px 12px;

    border-radius:11px;

    border:
        1px solid
        rgba(80,150,220,.3);

    outline:none;

    background:
        rgba(5,28,62,.8);

    color:white;
}

.search-close{

    width:38px;

    border:
        1px solid
        rgba(80,150,220,.3);

    border-radius:11px;

    background:
        rgba(5,28,62,.8);

    color:#aac3df;
}

/* =====================================================
   消息区域
===================================================== */

.messages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:22px;

    position:relative;
}

.messages::-webkit-scrollbar{

    width:5px;
}

.messages::-webkit-scrollbar-thumb{

    background:
        rgba(91,155,220,.3);

    border-radius:10px;
}

.message{

    position:relative;

    display:flex;

    gap:11px;

    margin-bottom:22px;

    animation:
        messageIn
        .22s
        ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.avatar{

    width:39px;
    height:39px;

    flex:
        0 0
        39px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--purple)
        );

    border:
        1px solid
        rgba(120,190,255,.3);

    box-shadow:
        0 0 18px
        rgba(59,130,246,.2);

    font-weight:800;

    overflow:hidden;
}

.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.message-content{

    min-width:0;

    flex:1;
}

.message-top{

    display:flex;

    align-items:baseline;

    gap:8px;
}

.message-user{

    font-size:14px;

    font-weight:800;

    color:#e7f2ff;
}

.message-time{

    color:#64809f;

    font-size:10px;
}

.message-text{

    margin-top:5px;

    color:var(--text2);

    line-height:1.6;

    word-break:break-word;

    white-space:pre-wrap;
}

/* =====================================================
   回复引用
===================================================== */

.reply-preview{

    display:none;

    margin-top:7px;

    padding:
        7px
        10px;

    border-left:
        3px solid
        var(--accent);

    border-radius:
        7px;

    background:
        rgba(59,130,246,.10);

    color:#7897b9;

    font-size:10px;

    max-width:500px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.reply-preview.show{

    display:block;
}

.reply-preview strong{

    color:#b8d8ff;
}

.message-reply{

    margin-top:8px;

    padding:
        7px
        10px;

    border-left:
        3px solid
        #4b9cff;

    border-radius:7px;

    background:
        rgba(59,130,246,.09);

    color:#7f9dbc;

    font-size:10px;

    max-width:520px;

    cursor:pointer;
}

.message-reply:hover{

    background:
        rgba(59,130,246,.16);
}

.message-reply strong{

    color:#acd2ff;
}

.message-actions{

    display:flex;

    gap:5px;

    margin-top:8px;

    flex-wrap:wrap;
}

.message-action{

    border:
        1px solid
        rgba(86,150,210,.25);

    background:
        rgba(20,49,88,.55);

    color:#9fb8d3;

    border-radius:10px;

    padding:
        4px
        8px;

    font-size:10px;

    cursor:pointer;

    transition:.15s;
}

.message-action:hover{

    background:
        rgba(37,99,235,.3);

    border-color:#4b9cff;

    color:white;
}

.reactions{

    display:flex;

    gap:5px;

    margin-top:8px;

    flex-wrap:wrap;
}

.reaction{

    border:
        1px solid
        rgba(86,150,210,.25);

    background:
        rgba(20,49,88,.55);

    color:#b9cee6;

    border-radius:12px;

    padding:
        4px
        8px;

    font-size:12px;

    cursor:pointer;

    transition:.15s;
}

.reaction:hover{

    background:
        rgba(37,99,235,.3);

    border-color:#4b9cff;
}

/* =====================================================
   TYPING
===================================================== */

.typing{

    position:absolute;

    left:22px;

    bottom:8px;

    color:#6685a8;

    font-size:11px;

    opacity:0;

    transition:.2s;
}

.typing.show{

    opacity:1;
}

.typing-dots span{

    display:inline-block;

    width:4px;
    height:4px;

    margin-left:2px;

    border-radius:50%;

    background:#60a5fa;

    animation:
        typing
        1s
        infinite;
}

.typing-dots span:nth-child(2){

    animation-delay:.15s;
}

.typing-dots span:nth-child(3){

    animation-delay:.3s;
}

@keyframes typing{

    0%,100%{
        opacity:.2;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-2px);
    }

}

/* =====================================================
   输入区
===================================================== */

.input-area{

    flex:none;

    padding:
        10px
        18px
        18px;

    border-top:
        1px solid
        rgba(80,150,220,.18);

    background:
        rgba(2,15,38,.48);
}

/* 引用条 */

.reply-bar{

    display:none;

    align-items:center;

    gap:9px;

    margin-bottom:8px;

    padding:
        9px
        11px;

    border:
        1px solid
        rgba(72,145,225,.25);

    border-left:
        3px solid
        var(--accent);

    border-radius:10px;

    background:
        rgba(18,48,88,.55);

    color:#91acc9;

    font-size:11px;
}

.reply-bar.show{

    display:flex;
}

.reply-bar-content{

    flex:1;

    min-width:0;
}

.reply-bar-title{

    color:#a8caff;

    font-weight:700;

    margin-bottom:2px;
}

.reply-bar-text{

    color:#718ca9;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.cancel-reply{

    width:28px;
    height:28px;

    flex:none;

    border:0;

    border-radius:8px;

    background:
        rgba(255,255,255,.05);

    color:#8ca5c0;

    cursor:pointer;
}

.cancel-reply:hover{

    background:
        rgba(239,68,68,.15);

    color:#ff9da8;
}

.input-box{

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        6px
        7px
        6px
        15px;

    border:
        1px solid
        rgba(77,151,226,.35);

    border-radius:16px;

    background:
        rgba(5,29,65,.7);
}

.input-box:focus-within{

    border-color:#479cff;

    box-shadow:
        0 0 0 3px
        rgba(59,130,246,.1),

        0 0 25px
        rgba(37,99,235,.1);
}

.message-input{

    flex:1;

    min-width:0;

    border:0;

    outline:0;

    background:transparent;

    color:white;

    font-size:15px;
}

.message-input::placeholder{

    color:#6683a4;
}

.send{

    width:40px;
    height:40px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--purple)
        );

    color:white;

    font-size:19px;

    cursor:pointer;

    box-shadow:
        0 0 18px
        rgba(59,130,246,.3);

    transition:.18s;
}

.send:hover{

    transform:scale(1.05);
}

.send:disabled{

    opacity:.45;
}

/* =====================================================
   PROFILE
===================================================== */

.profile{

    border-radius:24px;

    padding:18px;

    overflow-y:auto;
}

.profile-title{

    color:#7290b3;

    font-size:10px;

    font-weight:800;

    letter-spacing:.12em;

    margin:
        5px
        4px
        13px;
}

.user-card{

    padding:17px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(23,56,104,.7),
            rgba(6,25,58,.68)
        );

    border:
        1px solid
        rgba(80,155,235,.3);
}

.user-main{

    display:flex;

    align-items:center;

    gap:11px;
}

.big-avatar{

    width:53px;
    height:53px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--purple)
        );

    font-size:18px;

    font-weight:800;

    overflow:hidden;
}

.big-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.user-name{

    font-weight:800;
}

.user-signature{

    margin-top:3px;

    color:#7896b7;

    font-size:10px;

    max-width:175px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.user-online{

    display:flex;

    align-items:center;

    gap:5px;

    margin-top:5px;

    color:#54e29a;

    font-size:10px;
}

.edit-profile-btn{

    width:100%;

    margin-top:14px;

    padding:9px;

    border:
        1px solid
        rgba(80,150,220,.25);

    border-radius:11px;

    background:
        rgba(20,56,100,.5);

    color:#bcd4ee;

    cursor:pointer;
}

.info-divider{

    height:1px;

    background:
        rgba(110,160,210,.15);

    margin:
        16px 0;
}

.info-row{

    display:flex;

    align-items:center;

    gap:9px;

    padding:7px 0;

    color:#9bb2cd;

    font-size:12px;
}

.info-icon{

    width:24px;

    text-align:center;
}

/* =====================================================
   WEATHER
===================================================== */

.weather{

    padding:17px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(22,86,160,.65),
            rgba(8,37,78,.72)
        );

    border:
        1px solid
        rgba(82,173,255,.35);
}

.weather-top{

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.weather-temp{

    font-size:34px;

    font-weight:800;
}

.weather-icon{

    font-size:34px;
}

.weather-city{

    margin-top:6px;

    color:#9db6d3;

    font-size:12px;
}

.weather-detail{

    margin-top:13px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;
}

.weather-small{

    padding:9px;

    border-radius:10px;

    background:
        rgba(2,20,49,.5);

    color:#7695b7;

    font-size:10px;
}

.weather-small strong{

    display:block;

    margin-top:3px;

    color:#dcecff;

    font-size:12px;
}

.status-message{

    margin-top:12px;

    color:#7794b5;

    font-size:10px;
}

.forecast{

    margin-top:10px;

    display:flex;

    gap:6px;

    overflow-x:auto;
}

.forecast-day{

    min-width:58px;

    padding:8px 5px;

    text-align:center;

    border-radius:11px;

    background:
        rgba(2,20,49,.42);

    border:
        1px solid
        rgba(100,170,230,.12);
}

.forecast-date{

    color:#7190b2;

    font-size:9px;
}

.forecast-icon{

    font-size:18px;

    margin:4px 0;
}

.forecast-temp{

    color:#dcecff;

    font-size:10px;
}

/* =====================================================
   MODAL
===================================================== */

.modal{

    position:fixed;

    inset:0;

    z-index:80;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,5,15,.65);

    backdrop-filter:
        blur(10px);
}

.modal.show{

    display:flex;
}

.modal-card{

    width:min(
        430px,
        100%
    );

    padding:22px;

    border-radius:22px;

    border:
        1px solid
        rgba(80,160,240,.35);

    background:
        linear-gradient(
            145deg,
            rgba(8,34,70,.97),
            rgba(3,16,37,.97)
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);
}

.modal-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    font-size:18px;

    font-weight:800;

    margin-bottom:18px;
}

.modal-close{

    width:34px;
    height:34px;

    border:0;

    border-radius:10px;

    background:
        rgba(80,140,210,.14);

    color:#9fb8d3;

    cursor:pointer;
}

.profile-preview{

    display:flex;

    justify-content:center;

    margin:
        8px 0
        18px;
}

.profile-preview-avatar{

    width:80px;
    height:80px;

    border-radius:24px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--purple)
        );

    font-size:28px;

    font-weight:800;
}

.profile-preview-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.form-label{

    display:block;

    margin:
        12px 0
        6px;

    color:#86a4c5;

    font-size:11px;
}

.form-input,
.form-textarea{

    width:100%;

    border:
        1px solid
        rgba(80,150,220,.28);

let supabaseClient = null;


try{

/* =========================================================
   用户
========================================================= */

let nickname =
    localStorage.getItem(
        "security_lab_nickname"
    ) || "游客";


let signature =
    localStorage.getItem(
        "security_lab_signature"
    ) ||
    "还没有个性签名";


let avatarURL =
    localStorage.getItem(
        "security_lab_avatar"
    ) ||
    "";


function updateProfile(){

    const name =
        nickname ||
        "游客";


    document.getElementById(
        "profileName"
    ).textContent =
        name;


    document.getElementById(
        "profileSignature"
    ).textContent =
        signature ||
        "还没有个性签名";


    const avatar =
        document.getElementById(
            "bigAvatar"
        );


    if(avatarURL){

        avatar.innerHTML = `
            <img
                src="${escapeAttribute(
                    avatarURL
                )}"
                onerror="
                    this.style.display='none'
                "
            >
        `;

    }else{

        avatar.textContent =
            name
                .charAt(0)
                .toUpperCase();

    }

}


updateProfile();


/* =========================================================
   安全
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(
        value
    );

}


/* =========================================================
   Toast
========================================================= */

let toastTimer = null;


function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        text;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   Profile Modal
========================================================= */

function openProfileModal(){

    document.getElementById(
        "nicknameInput"
    ).value =
        nickname;


    document.getElementById(
        "signatureInput"
    ).value =
        signature ===
        "还没有个性签名"
            ? ""
            : signature;


    document.getElementById(
        "avatarInput"
    ).value =
        avatarURL;


    updatePreview();


    document.getElementById(
        "profileModal"
    ).classList.add(
        "show"
    );

}


function closeProfileModal(){

    document.getElementById(
        "profileModal"
    ).classList.remove(
        "show"
    );

}


function modalOutside(event){

    if(
        event.target.id ===
        "profileModal"
    ){

        closeProfileModal();

    }

}


function updatePreview(){

    const name =
        document.getElementById(
            "nicknameInput"
        ).value.trim() ||
        "游客";


    const url =
        document.getElementById(
            "avatarInput"
        ).value.trim();


    const preview =
        document.getElementById(
            "previewAvatar"
        );


    if(url){

        preview.innerHTML = `
            <img
                src="${escapeAttribute(url)}"
                onerror="
                    this.style.display='none'
                "
            >
        `;

    }else{

        preview.textContent =
            name
                .charAt(0)
                .toUpperCase();

    }

}


document.getElementById(
    "nicknameInput"
).addEventListener(
    "input",
    updatePreview
);


document.getElementById(
    "avatarInput"
).addEventListener(
    "input",
    updatePreview
);


function saveProfile(){

    nickname =
        document.getElementById(
            "nicknameInput"
        ).value.trim() ||
        "游客";


    signature =
        document.getElementById(
            "signatureInput"
        ).value.trim() ||
        "还没有个性签名";


    avatarURL =
        document.getElementById(
            "avatarInput"
        ).value.trim();


    localStorage.setItem(
        "security_lab_nickname",
        nickname
    );


    localStorage.setItem(
        "security_lab_signature",
        signature
    );


    localStorage.setItem(
        "security_lab_avatar",
        avatarURL
    );


    updateProfile();

    closeProfileModal();

    showToast(
        "个人资料已保存"
    );

}


/* =========================================================
   回复系统
========================================================= */

let replyTarget = null;


/*
 * replyTarget 格式：

 {
     id,
     username,
     message
 }

 * 只存在当前页面。
 */


function startReply(
    id,
    username,
    message
){

    replyTarget = {

        id:
            id,

        username:
            username,

        message:
            message

    };


    document.getElementById(
        "replyBarTitle"
    ).textContent =
        "回复 @" +
        username;


    document.getElementById(
        "replyBarText"
    ).textContent =
        message;


    document.getElementById(
        "replyBar"
    ).classList.add(
        "show"
    );


    const input =
        document.getElementById(
            "messageInput"
        );


    input.placeholder =
        "回复 @" +
        username +
        " ...";


    input.focus();


    showToast(
        "正在回复 @" +
        username
    );

}


function cancelReply(){

    replyTarget =
        null;


    document.getElementById(
        "replyBar"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "messageInput"
    ).placeholder =
        "发送消息...";

}


/* =========================================================
   频道
========================================================= */

let currentChannel =
    "general";


let localChannelMessages = {

    general:[],

    tech:[

        {
            id:"local-tech-1",

            username:"Security Lab",

            message:
                "欢迎来到技术交流频道 💻",

            created_at:
                new Date().toISOString()

        }

    ],

    chat:[

        {
            id:"local-chat-1",

            username:"Security Lab",

            message:
                "这里可以随便聊聊 💬",

            created_at:
                new Date().toISOString()

        }

    ],

    security:[

        {
            id:"local-security-1",

            username:"Security Lab",

            message:
                "这里是安全公告频道 🔐",

            created_at:
                new Date().toISOString()

        }

    ],

    share:[

        {
            id:"local-share-1",

            username:"Security Lab",

            message:
                "欢迎分享有趣的东西 ✨",

            created_at:
                new Date().toISOString()

        }

    ]

};


try{

    const saved =
        localStorage.getItem(
            "security_lab_channels"
        );


    if(saved){

        const parsed =
            JSON.parse(saved);


        Object.keys(
            localChannelMessages
        ).forEach(
            function(key){

                if(
                    Array.isArray(
                        parsed[key]
                    )
                ){

                    localChannelMessages[key] =
                        parsed[key];

                }

            }
        );

    }

}catch(error){

    console.error(error);

}


function saveLocalChannels(){

    try{

        localStorage.setItem(
            "security_lab_channels",
            JSON.stringify(
                localChannelMessages
            )
        );

    }catch(error){

        console.error(error);

    }

}


function switchChannel(
    channelId,
    channelName
){

    currentChannel =
        channelId;


    cancelReply();


    document
        .querySelectorAll(
            ".channel"
        )
        .forEach(
            function(channel){

                channel.classList.remove(
                    "active"
                );

            }
        );


    const selected =
        document.querySelector(
            '[data-channel="' +
            channelId +
            '"]'
        );


    if(selected){

        selected.classList.add(
            "active"
        );

    }


    document.getElementById(
        "chatName"
    ).textContent =
        channelName;


    document.getElementById(
        "chatDescription"
    ).textContent =
        "Security Lab · #" +
        channelName;


    if(
        channelId ===
        "general"
    ){

        loadMessages();

    }else{

        renderMessages(
            localChannelMessages[
                channelId
            ] || []
        );

    }

}


/* =========================================================
   消息渲染
========================================================= */

function getAvatarHTML(
    username
){

    if(
        username === nickname &&
        avatarURL
    ){

        return `
            <img
                src="${escapeAttribute(
                    avatarURL
                )}"
            >
        `;

    }


    return escapeHTML(
        String(
            username ||
            "匿"
        )
        .charAt(0)
        .toUpperCase()
    );

}


function renderMessages(
    list
){

    const box =
        document.getElementById(
            "messages"
        );


    box.innerHTML = "";


    if(!list.length){

        box.innerHTML = `

            <div style="
                text-align:center;
                color:#7190b3;
                padding:55px 20px;
            ">

                <div style="
                    font-size:32px;
                    margin-bottom:10px;
                ">
                    #
                </div>

                还没有消息

                <div style="
                    font-size:11px;
                    margin-top:6px;
                ">
                    发送第一条消息吧
                </div>

            </div>
        `;

    }else{

        list.forEach(
            function(item){

                renderOneMessage(
                    box,

            <span></span>

    );


    box.scrollTop =
        box.scrollHeight;

}

async function copyMessage(

){

            text

        showToast(
            "消息已复制"
        );

    }catch(error){

        showToast(

        );

}


/* =========================================================
   表情
========================================================= */

function fakeReaction(
    button
){

    const match =
        button.textContent.match(
            /(\d+)$/
        );


    if(!match){

        return;

    }


    const number =
        Number(
            match[1]
        ) + 1;


    button.textContent =
        button.textContent.replace(
            /\d+$/,
            number
        );

}


/* =========================================================
   Supabase 加载
========================================================= */

async function loadMessages(){

    if(
        currentChannel !==
        "general"
    ){

        return;

    }


    if(!supabaseClient){

        document.getElementById(
            "serverStatus"
        ).textContent =
            "聊天服务器不可用";


        renderMessages(
            localChannelMessages.general
        );


        return;

    }


    try{

        const result =
            await supabaseClient
                .from("messages")
                .select(
                    "id,username,message,created_at"
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                )
                .limit(100);


        if(result.error){

            console.error(
                result.error
            );


            document.getElementById(
                "serverStatus"
            ).textContent =
                "服务器连接失败";


            renderMessages(
                localChannelMessages.general
            );


            return;

        }


        document.getElementById(
            "serverStatus"
        ).textContent =
            "聊天服务器已连接";


        renderMessages(
            result.data || []
        );

    }catch(error){

        console.error(
            error
        );


        renderMessages(
            localChannelMessages.general
        );

    }

}


/* =========================================================
   发送消息
========================================================= */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    button.disabled =
        true;


    /*
     * 这里记录引用信息，
     * 但不会写入 Supabase。
     */

    const replyInfo =
        replyTarget
            ? {

                username:
                    replyTarget.username,

                message:
                    replyTarget.message

            }
            : null;


    const localMessage = {

        id:
            "local-" +
            Date.now(),

        username:
            nickname ||
            "游客",

        message:
            text,

        created_at:
            new Date().toISOString(),

        reply_to_username:
            replyInfo
                ? replyInfo.username
                : null,

        reply_to_message:
            replyInfo
                ? replyInfo.message
                : null

    };


    /* 非总聊天室 */

    if(
        currentChannel !==
        "general"
    ){

        localChannelMessages[
            currentChannel
        ].push(
            localMessage
        );


        saveLocalChannels();


        renderMessages(
            localChannelMessages[
                currentChannel
            ]
        );


        input.value = "";


        cancelReply();


        button.disabled =
            false;


        input.focus();


        return;

    }


    /* 总聊天室 */

    if(!supabaseClient){

        showToast(
            "聊天服务器暂时不可用"
        );


        button.disabled =
            false;


        return;

    }


    try{

        /*
         * 重要：
         *
         * 这里只发送原来的两个字段：
         *
         * username
         * message
         *
         * 所以不会要求你修改
         * Supabase messages 表结构。
         */

        const result =
            await supabaseClient
                .from("messages")
                .insert([
                    {

                        username:
                            nickname ||
                            "游客",

                        message:
                            text

                    }
                ]);


        if(result.error){

            console.error(
                result.error
            );


            showToast(
                "发送失败：" +
                result.error.message
            );


            return;

        }


        input.value =
            "";


        cancelReply();


        await loadMessages();


        input.focus();


    }catch(error){

        console.error(
            error
        );


        showToast(
            "发送失败"
        );


    }finally{

        button.disabled =
            false;

    }

}

/* =========================================================
   时间
========================================================= */

function formatTime(
    value
){

    if(!value){

        return "";

    }


    const date =
        new Date(
            value
        );


    if(
        isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    return date.toLocaleString(
        "zh-CN",
        {

            month:"2-digit",

            day:"2-digit",

            hour:"2-digit",

            minute:"2-digit"

        }
    );

}

function toggleSearch(){

    const bar =
        document.getElementById(
            "searchBar"
        );


    const show =
        !bar.classList.contains(
            "show"
        );


    if(show){

        bar.classList.add(

        );


        document.getElementById(
            "searchInput"
        ).focus();

function closeSearch(){

    ).classList.remove(
        "show"
    );


    document.getElementById(
        "searchInput"
    ).value =

}


document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    async function(){

        const query =
            this.value
                .trim()
                .toLowerCase();


        if(!query){

            return;

        }


        if(
            !supabaseClient
        ){

            return;

        }


        try{

            const result =
                await supabaseClient
                    .from("messages")
                    .select(
                        "id,username,message,created_at"
                    )
                    .order(
                        "created_at",
                        {
                            ascending:false
                        }
                    )
                    .limit(100);


            if(
                result.error
            ){

                return;

            }


            const found =
                (result.data || [])
                    .filter(
                        function(item){

                            return (

                                String(
                                    item.message ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(
                                    query
                                )

                                ||

                                String(
                                    item.username ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(
                                    query
                                )

                            );

                        }
                    );


            if(
                found.length
            ){

                showToast(
                    "找到 " +
                    found.length +
                    " 条相关消息"
                );

            }else{

                showToast(
                    "没有找到相关消息"
                );

            }

        }catch(error){

            console.error(
                error
            );

        }

    }
);


/* =========================================================
   天气
========================================================= */

async function loadWeather(){

    try{

        const ipResponse =
            await fetch(
                "https://ipwho.is/",
                {
                    cache:"no-store"
                }
            );


        if(
            !ipResponse.ok
        ){

            throw new Error(
                "IP服务不可用"
            );

        }


        const ipData =
            await ipResponse.json();


        if(
            !ipData.success
        ){

            throw new Error(
                "无法获取位置"
            );

        }


        const city =
            ipData.city ||
            "未知城市";


        document.getElementById(
            "location"
        ).textContent =
            city;


        document.getElementById(
            "weatherCity"
        ).textContent =
            city;


        const weatherURL =
            "https://api.open-meteo.com/v1/forecast" +

            "?latitude=" +
            encodeURIComponent(
                ipData.latitude
            ) +

            "&longitude=" +
            encodeURIComponent(
                ipData.longitude
            ) +

            "&current=" +
            "temperature_2m," +
            "relative_humidity_2m," +
            "wind_speed_10m," +
            "weather_code" +

            "&daily=" +
            "weather_code," +
            "temperature_2m_max," +
            "temperature_2m_min" +

            "&forecast_days=7" +

            "&timezone=auto";


        const response =
            await fetch(
                weatherURL
            );


        if(
            !response.ok
        ){

            throw new Error(
                "天气服务失败"
            );

        }


        const weather =
            await response.json();


        const current =
            weather.current;


        document.getElementById(
            "temperature"
        ).textContent =
            Math.round(
                current.temperature_2m
            ) +
            "°";


        document.getElementById(
            "humidity"
        ).textContent =
            current.relative_humidity_2m +
            "%";


        document.getElementById(
            "wind"
        ).textContent =
            Math.round(
                current.wind_speed_10m
            ) +
            " km/h";


        const info =
            getWeatherInfo(
                current.weather_code
            );


        document.getElementById(
            "weatherIcon"
        ).textContent =
            info.icon;


        document.getElementById(
            "weatherStatus"
        ).textContent =
            info.text;


        renderForecast(
            weather.daily
        );

    }catch(error){

        console.error(
            "天气:",
            error
        );


        document.getElementById(
            "weatherStatus"
        ).textContent =
            "天气暂时无法获取";

    }

}


function getWeatherInfo(
    code
){

    if(
        code === 0
    ){

        return {
            icon:"☀️",
            text:"晴朗"
        };

    }


    if(
        code === 1 ||
        code === 2
    ){

        return {
            icon:"🌤️",
            text:"晴间多云"
        };

    }


    if(
        code === 3
    ){

        return {
            icon:"☁️",
            text:"多云"
        };

    }


    if(
        code >=45 &&
        code <=48
    ){

        return {
            icon:"🌫️",
            text:"雾"
        };

    }


    if(
        code >=51 &&
        code <=67
    ){

        return {
            icon:"🌧️",
            text:"降雨"
        };

    }


    if(
        code >=71 &&
        code <=77
    ){

        return {
            icon:"❄️",
            text:"降雪"
        };

    }


    if(
        code >=80 &&
        code <=82
    ){

        return {
            icon:"🌦️",
            text:"阵雨"
        };

    }


    if(
        code >=95
    ){

        return {
            icon:"⛈️",
            text:"雷暴"
        };

    }


    return {

        icon:"🌤️",

        text:"天气未知"

    };

}


function renderForecast(
    daily
){

    const box =
        document.getElementById(
            "forecast"
        );


    box.innerHTML =
        "";


    if(
        !daily ||
        !daily.time
    ){

        return;

    }


    for(
        let i=0;
        i<daily.time.length;
        i++
    ){

        const date =
            new Date(
                daily.time[i] +
                "T00:00:00"
            );


        const day =
            i === 0
                ? "今天"
                : date.toLocaleDateString(
                    "zh-CN",
                    {
                        weekday:"short"
                    }
                );


        const info =
            getWeatherInfo(
                daily.weather_code[i]
            );


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "forecast-day";


        item.innerHTML = `

            <div class="forecast-date">
                ${day}
            </div>

            <div class="forecast-icon">
                ${info.icon}
            </div>

            <div class="forecast-temp">

                ${Math.round(
                    daily.temperature_2m_max[i]
                )}°

                /

                ${Math.round(
                    daily.temperature_2m_min[i]
                )}°

            </div>

        `;


        box.appendChild(
            item
        );

    }

}

/* =========================================================
   星空
========================================================= */

const space =
    document.getElementById(
        "space"
    );


const sctx =
    space.getContext(
        "2d"
    );


let stars = [];


function resizeSpace(){

    const ratio =
        window.devicePixelRatio ||
        1;


    space.width =
        window.innerWidth *
        ratio;


    space.height =
        window.innerHeight *
        ratio;


    sctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    stars = [];


    const count =
        Math.min(
            250,
            Math.floor(
                window.innerWidth *
                window.innerHeight /
                6500
            )
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        stars.push({

            x:
                Math.random() *
                window.innerWidth,

            y:
                Math.random() *
                window.innerHeight,

            r:
                Math.random() *
                1.2 +
                .2,

            a:
                Math.random() *
                .7 +
                .2,

            speed:
                Math.random() *
                .15 +
                .03

        });

    }

}


resizeSpace();


window.addEventListener(
    "resize",
    resizeSpace
);


function animateSpace(){

    const w =
        window.innerWidth;


    const h =
        window.innerHeight;


    sctx.clearRect(
        0,
        0,
        w,
        h
    );


    stars.forEach(
        function(star){

            star.y -=
                star.speed;


            if(
                star.y < -5
            ){

                star.y =
                    h + 5;

            }


            sctx.beginPath();


            sctx.arc(
                star.x,
                star.y,
                star.r,
                0,
                Math.PI*2
            );


            sctx.fillStyle =
                "rgba(180,225,255," +
                star.a +
                ")";


            sctx.fill();

        }
    );


    requestAnimationFrame(
        animateSpace
    );

}


animateSpace();


/* =========================================================
   地球
========================================================= */

const globe =
    document.getElementById(
        "globe"
    );


const gctx =
    globe.getContext(
        "2d"
    );


let globeSize =
    600;


function resizeGlobe(){

    globeSize =
        Math.min(
            720,
            Math.max(
                260,
                Math.min(
                    window.innerWidth*.72,
                    window.innerHeight*.72
                )
            )
        );


    const scale =
        window.devicePixelRatio ||
        1;


    globe.width =
        globeSize *
        scale;


    globe.height =
        globeSize *
        scale;


    globe.style.width =
        globeSize +
        "px";


    globe.style.height =
        globeSize +
        "px";


    gctx.setTransform(
        scale,
        0,
        0,
        scale,
        0,
        0
    );

}


resizeGlobe();


window.addEventListener(
    "resize",
    resizeGlobe
);


function drawGlobe(
    time
){

    const size =
        globeSize;


    const cx =
        size/2;


    const cy =
        size/2;


    const r =
        size*.35;


    gctx.clearRect(
        0,
        0,
        size,
        size
    );


    const glow =
        gctx.createRadialGradient(
            cx,
            cy,
            r*.7,
            cx,
            cy,
            r*1.45
        );


    glow.addColorStop(
        0,
        "rgba(30,150,255,.22)"
    );


    glow.addColorStop(
        .55,
        "rgba(20,100,255,.08)"
    );


    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    gctx.beginPath();


    gctx.arc(
        cx,
        cy,
        r*1.45,
        0,
        Math.PI*2
    );


    gctx.fillStyle =
        glow;


    gctx.fill();


    const earth =
        gctx.createRadialGradient(
            cx-r*.35,
            cy-r*.35,
            r*.05,
            cx,
            cy,
            r
        );


    earth.addColorStop(
        0,
        "#1c8edb"
    );


    earth.addColorStop(
        .45,
        "#0753a4"
    );


    earth.addColorStop(
        .82,
        "#032b65"
    );


    earth.addColorStop(
        1,
        "#01152f"
    );


    gctx.beginPath();


    gctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI*2
    );


    gctx.fillStyle =
        earth;


    gctx.fill();


    const rotation =
        time*.00018;


    gctx.save();


    gctx.beginPath();


    gctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI*2
    );


    gctx.clip();


    gctx.strokeStyle =
        "rgba(80,205,255,.28)";


    gctx.lineWidth =
        1;


    for(
        let i=-4;
        i<=4;
        i++
    ){

        const lat =
            i/5;


        const y =
            cy +
            lat*r;


        const width =
            r *
            Math.sqrt(
                Math.max(
                    0,
                    1-lat*lat
                )
            );


        gctx.beginPath();


        gctx.ellipse(
            cx,
            y,
            width,
            r*.13,
            0,
            0,
            Math.PI*2
        );


        gctx.stroke();

    }


    for(
        let i=-5;
        i<=5;
        i++
    ){

        const longitude =
            i/5*Math.PI +
            rotation;


        const visible =
            Math.cos(
                longitude
            );


        const width =
            Math.max(
                4,
                Math.abs(
                    visible
                )*r
            );


        gctx.beginPath();


        gctx.ellipse(
            cx,
            cy,
            width,
            r,
            0,
            0,
            Math.PI*2
        );


        gctx.stroke();

    }


    gctx.restore();


    requestAnimationFrame(
        drawGlobe
    );

}


requestAnimationFrame(
    drawGlobe
);
